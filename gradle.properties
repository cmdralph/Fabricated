org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Fabricated release version (the Minecraft version is appended per target).
fabricated_version=0.6.0
# Version of the public API in :api (semantic versioning, independent of the release version).
fabricated_api_version=1.1.0
group=io.github.cmdralph.fabricated

# Shared tool versions. ASM is compile-only; NeoForge provides it at runtime.
asm_version=9.8
junit_version=5.13.4
moddevgradle_version=2.0.142
# ForgeGradle, for the forge branch's projects only (Gradle 9.3 or later).
forgegradle_version=7.0.40
