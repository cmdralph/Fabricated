pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
    plugins {
        // Each platform's build plugin (docs/PORTING.md §5). NeoForge's projects (mc/neoforge).
        id 'net.neoforged.moddev' version providers.gradleProperty('moddevgradle_version').get()
        // Forge up to 1.20.1 (mc/forge-legacy): ModDevGradle's legacyforge plugin, from the same jar.
        id 'net.neoforged.moddev.legacyforge' version providers.gradleProperty('moddevgradle_version').get()
        // Minecraft Forge 61 and later (mc/forge).
        id 'net.minecraftforge.gradle' version providers.gradleProperty('forgegradle_version').get()
    }
}

plugins {
    // Provisions the Java 25 toolchain for the 26.x projects when it is not installed locally.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'fabricated'

include 'fabric-loader-api'
include 'api'
include 'core'

// The Minecraft projects need their platform's maven and Mojang's servers. Pass -Pfabricated.coreOnly=true to build
// and test only the Minecraft-independent modules.
def coreOnly = providers.gradleProperty('fabricated.coreOnly').map { it.toBoolean() }.getOrElse(false)
// Each platform's versions are in mc/<platform>/<version>, as the project :mc:<platform>-<version>. Only the platforms
// -Pfabricated.platforms names (comma-separated, or "all") are configured, NeoForge's by default: a build configures
// one platform's plugin, as each branch's CI builds one platform.
def platforms = ['neoforge', 'forge', 'forge-legacy']
def selected = providers.gradleProperty('fabricated.platforms').getOrElse('neoforge').split(',')*.trim().findAll { it }
if (selected == ['all']) selected = platforms
def unknown = selected - platforms
if (unknown) {
    throw new GradleException("Unknown platforms in fabricated.platforms: ${unknown.join(', ')}" +
            " (known: ${platforms.join(', ')}, all)")
}
if (!coreOnly) {
    selected.each { platform ->
        file("mc/${platform}").eachDir { dir ->
            if (new File(dir, 'build.gradle').isFile()) {
                include "mc:${platform}-${dir.name}"
                project(":mc:${platform}-${dir.name}").projectDir = dir
            }
        }
    }
}
