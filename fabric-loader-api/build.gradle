// Binary-compatible copy of Fabric Loader's public API (Apache-2.0, see NOTICE) plus the
// clean-room implementations it delegates to (versions, predicates, language adapter).
plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    // Main code stays loadable on Java 17, for the 1.20.1 branch (docs/PORTING.md, D2); tests may use newer APIs.
    options.release = name == 'compileJava' ? 17 : 21
    // The upstream API sources use deprecation and raw types we must not change.
    options.compilerArgs.removeAll(['-Werror'])
    options.compilerArgs.add('-Xlint:-deprecation')
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
