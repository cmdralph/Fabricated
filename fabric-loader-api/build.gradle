// Binary-compatible copy of Fabric Loader's public API (Apache-2.0, see NOTICE) plus the
// clean-room implementations it delegates to (versions, predicates, language adapter).
plugins {
    id 'java-library'
}

tasks.withType(JavaCompile).configureEach {
    // The upstream API sources use deprecation and raw types we must not change.
    options.compilerArgs.removeAll(['-Werror'])
    options.compilerArgs.add('-Xlint:-deprecation')
}
