name: Diagnose 1.21.1

# Scratch workflow, removed again before the task's pull request: the evidence task 3 needs for the 1.21.1 findings,
# printed to the job log (the runner reaches the mavens and Modrinth; the session's container doesn't).
on:
  push:
    branches: ['claude/project-thread-9ljb9j']
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MC: "1.21.1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build 1.21.1
        run: ./gradlew :mc:neoforge-1.21.1:fabricatedJar :mc:neoforge-1.21.1:testmods --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Fabric API and the corpora
        run: |
          fapi=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fabricApiVersion"])' mc/neoforge/1.21.1/src/fabricated/resources/META-INF/fabricated/fabric-api-plan.json)
          mkdir -p "$RUNNER_TEMP/extra"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/extra/fabric-api.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${fapi}/fabric-api-${fapi}.jar"
          python3 ci/fetch-corpus.py "$MC" "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/corpus.txt" || true
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/corpus/"
          python3 ci/fetch-corpus.py "$MC" "$RUNNER_TEMP/advanced" fabric $(sed -e '/^#/d' -e '/^$/d' ci/mod-corpus-advanced.txt) > "$RUNNER_TEMP/advanced.txt" || true
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/advanced/"
          mkdir -p "$RUNNER_TEMP/extra-client"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-client/"
          cp mc/neoforge/1.21.1/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-client/"
      - name: Install Mesa EGL for the client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Select Java 21 for the game
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV" && echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Server with the mod corpus (data packs)
        continue-on-error: true
        run: |
          set +e
          neo=$(sed -n 's/^neoforge_version=//p' mc/neoforge/1.21.1/gradle.properties)
          ci/neoforge/smoke-server.sh "$MC" "$neo" "$RUNNER_TEMP/server-corpus" "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/server-corpus.out" 2>&1
          echo "=== SERVER-CORPUS status $?"
          grep -E "^(PASS|FAIL|NOTE)" "$RUNNER_TEMP/server-corpus.out" | cut -c1-300 | head -6
          log="$RUNNER_TEMP/server-corpus/logs/latest.log"
          echo "=== SERVER-CORPUS datapacks"
          grep -n -B4 -A80 "Failed to load datapacks" "$log" | cut -c1-500 | head -140
          echo "=== SERVER-CORPUS suppsquared"
          grep -n -i -E "suppsquared|supplementaries_squared|copper_lantern|Fabric entrypoint|entrypoint failed" "$log" | cut -c1-500 | head -60
          grep -n -i -E "suppsquared|Entrypoint failures" -A3 "$RUNNER_TEMP/server-corpus/logs/fabric-bridge-report.txt" | cut -c1-500 | head -60
          j=$(ls "$RUNNER_TEMP"/corpus/*.jar | grep -i -E "squared" | head -1); echo "jar: $j"
          if [ -n "$j" ]; then unzip -Z1 "$j" | grep -i -E "copper_lantern|fabric.mod.json|\.mixins\.json$" | head -20; unzip -p "$j" fabric.mod.json | head -c 2500; echo; fi
          echo "=== SERVER-CORPUS ingredients"
          grep -n -i -E "recipe-api|recipe_api|CustomIngredient|IngredientMixin" "$log" | cut -c1-400 | head -20
          grep -n -i -E "recipe-api|IngredientMixin|CustomIngredient" "$RUNNER_TEMP/server-corpus/logs/fabric-bridge-report.txt" | cut -c1-500 | head -20
          true
      - name: Server with the advanced corpus (CORPUS-46)
        continue-on-error: true
        run: |
          set +e
          neo=$(sed -n 's/^neoforge_version=//p' mc/neoforge/1.21.1/gradle.properties)
          ci/neoforge/smoke-server.sh "$MC" "$neo" "$RUNNER_TEMP/server-advanced" "$RUNNER_TEMP/advanced" > "$RUNNER_TEMP/server-advanced.out" 2>&1
          echo "=== SERVER-ADVANCED status $?"
          grep -n -E "Critical injection|InjectionError|InvalidInjection|Mixin apply|MixinApplyError|Caused by|Exception|Error:" "$RUNNER_TEMP/server-advanced.out" | cut -c1-500 | head -40
          echo "=== SERVER-ADVANCED stdout tail"
          grep -v -E "^(PASS|FAIL|NOTE)" "$RUNNER_TEMP/server-advanced.out" | tail -n 120 | cut -c1-400
          ls "$RUNNER_TEMP/server-advanced/crash-reports" 2>/dev/null && head -n 100 "$RUNNER_TEMP"/server-advanced/crash-reports/*.txt
          echo "=== SERVER-ADVANCED pehkui reach mixin"
          j=$(ls "$RUNNER_TEMP"/advanced/*.jar | grep -i pehkui | head -1); echo "jar: $j"
          if [ -n "$j" ]; then
            d="$RUNNER_TEMP/pehkui-x"; mkdir -p "$d" && (cd "$d" && unzip -o -q "$j" 'virtuoel/pehkui/mixin/reach/*' 'pehkui.mixins.json' 'pehkui.refmap.json' 2>/dev/null || true)
            ls "$d" "$d/virtuoel/pehkui/mixin/reach" 2>/dev/null | head -30
            javap -v -p "$d/virtuoel/pehkui/mixin/reach/PlayerEntityMixin.class" | grep -v -E "^\s+(line|[0-9]+:)" | head -150
          fi
          grep -n -i "reach" "$RUNNER_TEMP/server-advanced/logs/fabric-bridge-report.txt" | cut -c1-600 | head -30
          echo "=== SERVER-ADVANCED pre-flight on pehkui"
          grep -n -i "pehkui" "$RUNNER_TEMP/server-advanced/logs/fabric-bridge-report.txt" | cut -c1-500 | head -30
          true
      - name: Client with the mod corpus (KEYMAP-2)
        continue-on-error: true
        run: |
          set +e
          neo=$(sed -n 's/^neoforge_version=//p' mc/neoforge/1.21.1/gradle.properties)
          SMOKE_TIMEOUT=300 ci/neoforge/smoke-client.sh "$MC" "$neo" "$RUNNER_TEMP/client-corpus" "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/client-corpus.out" 2>&1
          echo "=== CLIENT-CORPUS status $?"
          grep -E "^(PASS|FAIL|NOTE)|reached its world|crashed|stopping the client" "$RUNNER_TEMP/client-corpus.out" | cut -c1-300 | head -8
          log="$RUNNER_TEMP/client-corpus/run/logs/latest.log"
          grep -n -i -E "GameOptions has already|Failed to load options|Failed to load datapacks" "$log" | cut -c1-400 | head -10
          echo "=== CLIENT-CORPUS threads"
          awk 'BEGIN { RS = ""; ORS = "\n\n" } /^"(Render thread|Worker-|Server thread|main|Download|pool)/' "$RUNNER_TEMP/client-corpus/thread-dump.txt" | cut -c1-300 | head -400
          echo "=== CLIENT-CORPUS log tail"
          tail -n 25 "$log" | cut -c1-400
          ls "$RUNNER_TEMP/client-corpus/run/crash-reports" 2>/dev/null && head -n 80 "$RUNNER_TEMP"/client-corpus/run/crash-reports/*.txt
          true

