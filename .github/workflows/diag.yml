name: Diagnose 1.21.1

# Scratch workflow, removed again before the task's pull request: the evidence task 3 needs for the 1.21.1 findings,
# printed to the job log (the runner reaches the mavens and Modrinth; the session's container doesn't).
on:
  push:
    branches: ['claude/project-thread-9ljb9j']
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MC: "1.21.1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      # Upstream's key binding API as scripts/import-fabric-api.sh would import it next to the modules already imported
      # (into a copy): the diff shows the files it adds and whether the others come out the same.
      - name: Upstream's key binding API, imported
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/fapi"
          cp -R mc/neoforge/1.21.1/src/fabricapi "$RUNNER_TEMP/fapi/fabricapi"
          cp -R mc/neoforge/1.21.1/src/fabricapi-overrides "$RUNNER_TEMP/fapi/fabricapi-overrides"
          modules=$(sed -n 's/^modules=//p' mc/neoforge/1.21.1/src/fabricapi/UPSTREAM.properties)
          JAVA_HOME="$JAVA_HOME_25_X64" scripts/import-fabric-api.sh --yarn 1.21.1+build.3 0.116.17+1.21.1 "$RUNNER_TEMP/fapi/fabricapi" $modules fabric-key-binding-api-v1:api > "$RUNNER_TEMP/import.out" 2>&1
          echo "import status $?"; tail -n 20 "$RUNNER_TEMP/import.out"
          echo "=== IMPORT DIFF"
          diff -ruN mc/neoforge/1.21.1/src/fabricapi "$RUNNER_TEMP/fapi/fabricapi"
          echo "=== END IMPORT DIFF"
          true
      - name: Build 1.21.1
        run: ./gradlew :mc:neoforge-1.21.1:fabricatedJar :mc:neoforge-1.21.1:testmods --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Fabric API and the corpora
        run: |
          fapi=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fabricApiVersion"])' mc/neoforge/1.21.1/src/fabricated/resources/META-INF/fabricated/fabric-api-plan.json)
          mkdir -p "$RUNNER_TEMP/extra"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/extra/fabric-api.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${fapi}/fabric-api-${fapi}.jar"
          python3 ci/fetch-corpus.py "$MC" "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/corpus.txt" || true
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/corpus/"
          python3 ci/fetch-corpus.py "$MC" "$RUNNER_TEMP/advanced" fabric $(sed -e '/^#/d' -e '/^$/d' ci/mod-corpus-advanced.txt) > "$RUNNER_TEMP/advanced.txt" || true
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/advanced/"
          mkdir -p "$RUNNER_TEMP/extra-client"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-client/"
          cp mc/neoforge/1.21.1/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-client/"
      - name: Install Mesa EGL for the client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Select Java 21 for the game
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV" && echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Client with Fabric API and the FRAPI test mod (KEYMAP-2)
        continue-on-error: true
        run: |
          set +e
          neo=$(sed -n 's/^neoforge_version=//p' mc/neoforge/1.21.1/gradle.properties)
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "$MC" "$neo" "$RUNNER_TEMP/client-fapi" "$RUNNER_TEMP/extra-client" > "$RUNNER_TEMP/client-fapi.out" 2>&1
          echo "=== CLIENT-FAPI status $?"
          grep -E "^(PASS|FAIL|NOTE)" "$RUNNER_TEMP/client-fapi.out" | cut -c1-300
          log="$RUNNER_TEMP/client-fapi/run/logs/latest.log"
          grep -h "FABRICATED-TEST" "$log" | cut -c1-400
          grep -n -i -E "keybinding|key binding|GameOptions has already" "$log" | cut -c1-400 | head -30
          python3 ci/log-digest.py "$log" | head -120
          true
      - name: Server with the mod corpus (CORPUS-44)
        continue-on-error: true
        run: |
          set +e
          neo=$(sed -n 's/^neoforge_version=//p' mc/neoforge/1.21.1/gradle.properties)
          ci/neoforge/smoke-server.sh "$MC" "$neo" "$RUNNER_TEMP/server-corpus" "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/server-corpus.out" 2>&1
          echo "=== SERVER-CORPUS status $?"
          grep -E "^(PASS|FAIL|NOTE)" "$RUNNER_TEMP/server-corpus.out" | cut -c1-300 | head -12
          log="$RUNNER_TEMP/server-corpus/logs/latest.log"
          grep -n -i -E "moonlight|ModNioResourcePack" "$log" | grep -i -E "warn|error|exception|ModNio" | cut -c1-400 | head -20
          python3 ci/log-digest.py "$log" | head -120
          ls "$RUNNER_TEMP/server-corpus/crash-reports" 2>/dev/null && head -n 80 "$RUNNER_TEMP"/server-corpus/crash-reports/*.txt
          true
      - name: Client with the mod corpus (KEYMAP-2, CORPUS-44, CORPUS-45)
        continue-on-error: true
        run: |
          set +e
          neo=$(sed -n 's/^neoforge_version=//p' mc/neoforge/1.21.1/gradle.properties)
          SMOKE_TIMEOUT=600 ci/neoforge/smoke-client.sh "$MC" "$neo" "$RUNNER_TEMP/client-corpus" "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/client-corpus.out" 2>&1
          echo "=== CLIENT-CORPUS status $?"
          grep -E "^(PASS|FAIL|NOTE)|reached its world|crashed|stopping the client" "$RUNNER_TEMP/client-corpus.out" | cut -c1-300 | head -20
          log="$RUNNER_TEMP/client-corpus/run/logs/latest.log"
          grep -n -i -E "GameOptions has already|lambdynlights.*(error|fail)|getLightColor|ModNioResourcePack" "$log" | cut -c1-400 | head -20
          echo "=== CLIENT-CORPUS report"
          grep -A120 "== " "$RUNNER_TEMP/client-corpus/run/logs/fabric-bridge-report.txt" | cut -c1-400 | head -160
          python3 ci/log-digest.py "$log" | head -160
          ls "$RUNNER_TEMP/client-corpus/run/crash-reports" 2>/dev/null && head -n 80 "$RUNNER_TEMP"/client-corpus/run/crash-reports/*.txt
          true
      - name: Server with the advanced corpus (CORPUS-46)
        continue-on-error: true
        run: |
          set +e
          neo=$(sed -n 's/^neoforge_version=//p' mc/neoforge/1.21.1/gradle.properties)
          ci/neoforge/smoke-server.sh "$MC" "$neo" "$RUNNER_TEMP/server-advanced" "$RUNNER_TEMP/advanced" > "$RUNNER_TEMP/server-advanced.out" 2>&1
          echo "=== SERVER-ADVANCED status $?"
          grep -E "^(PASS|FAIL|NOTE)" "$RUNNER_TEMP/server-advanced.out" | cut -c1-300 | head -12
          grep -n -i -E "server start|Done \(|timed out|stopp" "$RUNNER_TEMP/server-advanced.out" | cut -c1-300 | head -10
          log="$RUNNER_TEMP/server-advanced/logs/latest.log"
          tail -n 15 "$log" | cut -c1-300
          python3 ci/log-digest.py "$log" | head -160
          ls "$RUNNER_TEMP/server-advanced/crash-reports" 2>/dev/null && head -n 80 "$RUNNER_TEMP"/server-advanced/crash-reports/*.txt
          true
      - name: Client with the advanced corpus (CORPUS-46)
        continue-on-error: true
        run: |
          set +e
          neo=$(sed -n 's/^neoforge_version=//p' mc/neoforge/1.21.1/gradle.properties)
          SMOKE_TIMEOUT=600 ci/neoforge/smoke-client.sh "$MC" "$neo" "$RUNNER_TEMP/client-advanced" "$RUNNER_TEMP/advanced" > "$RUNNER_TEMP/client-advanced.out" 2>&1
          echo "=== CLIENT-ADVANCED status $?"
          grep -E "^(PASS|FAIL|NOTE)|reached its world|crashed|stopping the client" "$RUNNER_TEMP/client-advanced.out" | cut -c1-300 | head -20
          log="$RUNNER_TEMP/client-advanced/run/logs/latest.log"
          python3 ci/log-digest.py "$log" | head -160
          ls "$RUNNER_TEMP/client-advanced/run/crash-reports" 2>/dev/null && head -n 80 "$RUNNER_TEMP"/client-advanced/run/crash-reports/*.txt
          true
  # Forge's facts for CORPUS-33 (the retyped featuresPerStep) and PRE-18 (ImmediatelyFast's @Local hook on Forge 65).
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Forge's ChunkGenerator and lazy classes
        continue-on-error: true
        run: |
          set +e
          for pair in 1.21.11-61.2.4 26.2-65.1.5 26.3-66.1.0; do
            dir="$RUNNER_TEMP/forge-$pair"; mkdir -p "$dir" && cd "$dir"
            curl -fsSL --retry 4 -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${pair}/forge-${pair}-installer.jar"
            java -jar installer.jar --installServer . > installer.log 2>&1 || tail -n 20 installer.log
            echo "=== FORGE $pair"
            for j in $(find libraries -name "*.jar"); do
              unzip -Z1 "$j" 2>/dev/null | grep -q "^net/minecraft/world/level/chunk/ChunkGenerator.class$" && { echo "-- $j"; javap -p -cp "$j" net.minecraft.world.level.chunk.ChunkGenerator | head -30; javap -c -p -cp "$j" net.minecraft.world.level.chunk.ChunkGenerator | grep -n -i -E "featuresPerStep|Lazy" | head -20; }
              for c in $(unzip -Z1 "$j" 2>/dev/null | grep -E "^net/minecraftforge/common/util/.*Lazy.*\.class$"); do
                n=${c%.class}; echo "-- $j $n"; javap -p -cp "$j" "${n//\//.}"
              done
            done
            cd "$GITHUB_WORKSPACE"
          done
          true
      - name: ImmediatelyFast's map atlas mixin against Forge 65's client classes (PRE-18)
        continue-on-error: true
        run: |
          set +e
          python3 ci/fetch-corpus.py 26.2 "$RUNNER_TEMP/if" fabric immediatelyfast
          j=$(ls "$RUNNER_TEMP"/if/*.jar | grep -i immediatelyfast | head -1); echo "== $j"
          mkdir -p "$RUNNER_TEMP/ifx" && unzip -q -o "$j" -d "$RUNNER_TEMP/ifx"
          for c in $(find "$RUNNER_TEMP/ifx" -name "MixinGuiGraphicsExtractor*.class" -path "*map_atlas*"); do
            echo "-- $c"; javap -v -p "$c" | grep -v -E "^\s+#[0-9]+ = |^\s+line [0-9]+:|StackMapTable|frame_type|offset_delta" | grep -E "Mixin|method=|value=|target=|ordinal|Local|Ref|  (public|private|protected) |argsOnly|index|name=|require|Operation" | head -80
          done
          dir="$RUNNER_TEMP/forge-client"; mkdir -p "$dir/minecraft" && cd "$dir"
          echo '{"profiles":{}}' > minecraft/launcher_profiles.json
          curl -fsSL --retry 4 -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/26.2-65.1.5/forge-26.2-65.1.5-installer.jar"
          java -jar installer.jar --installClient minecraft > installer.log 2>&1 || tail -n 20 installer.log
          target=$(javap -v -p $(find "$RUNNER_TEMP/ifx" -name "MixinGuiGraphicsExtractor*.class" -path "*map_atlas*" | head -1) | grep -A2 "org.spongepowered.asm.mixin.Mixin(" | grep -o -E "class L[^;]+;" | head -1 | sed 's/^class L//; s/;$//')
          echo "== target class: $target"
          for j in $(find minecraft -name "*.jar"); do
            if unzip -Z1 "$j" 2>/dev/null | grep -q "^${target}.class$"; then
              echo "-- $j"
              javap -c -l -p -cp "$j" "${target//\//.}" > "$RUNNER_TEMP/target-$(basename "$j").txt"
              wc -l "$RUNNER_TEMP/target-$(basename "$j").txt"
            fi
          done
          methods=$(for c in $(find "$RUNNER_TEMP/ifx" -name "MixinGuiGraphicsExtractor*.class" -path "*map_atlas*"); do javap -v -p "$c" | grep -o -E 'method=\["[^"]+"' | sed -E 's/method=\["//; s/"$//'; done | sort -u)
          echo "== target methods: $methods"
          for f in "$RUNNER_TEMP"/target-*.txt; do
            for m in $methods; do
              name=${m%%(*}
              echo "=== $f: $m"
              awk -v n="$name" '/^  [a-z].*[ .]/ { show = index($0, " " n "(") > 0 } show' "$f" | grep -v -E "^\s+line [0-9]+:" | head -120
            done
          done
          true
