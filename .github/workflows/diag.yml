name: Diagnose 1.21.1

# Scratch workflow, removed again before the task's pull request: the evidence task 3 needs for the Forge findings,
# printed to the job log (the runner reaches the mavens; the session's container doesn't).
on:
  push:
    branches: ['claude/project-thread-9ljb9j']
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      # Fabric API's screen input events and JSON load conditions on Forge 61 to 66: Forge's screen input events, the
      # calls Forge's input handlers make, and Forge's JSON data loader and registry loader.
      - name: Forge's screen input events and data loaders
        continue-on-error: true
        run: |
          set +e
          for pair in 1.21.11-61.2.4 26.1.2-64.1.5 26.2-65.1.5 26.3-66.1.0; do
            dir="$RUNNER_TEMP/forge-$pair"; mkdir -p "$dir/minecraft" && cd "$dir"
            echo '{"profiles":{}}' > minecraft/launcher_profiles.json
            curl -fsSL --retry 4 -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${pair}/forge-${pair}-installer.jar"
            java -jar installer.jar --installClient minecraft > installer.log 2>&1 || tail -n 20 installer.log
            client=$(find minecraft -name "forge-${pair}-client.jar" | head -1)
            universal=$(find minecraft -name "forge-${pair}-universal.jar" | head -1)
            cp=$(find minecraft/libraries -name "*.jar" | tr '\n' ':')
            echo "######## FORGE $pair client=$client universal=$universal"
            echo "== screen input events"
            for c in $(unzip -Z1 "$universal" | grep -E '^net/minecraftforge/client/event/ScreenEvent\$(KeyInput|KeyPressed|KeyReleased|CharacterTyped|MouseInput|MouseButtonPressed|MouseButtonReleased|MouseDragged|MouseScrolled)(\$Pre|\$Post)?\.class$'); do
              n=${c%.class}; javap -p -cp "$universal" "${n//\//.}" | grep -v -E "toString|hashCode|equals|static \{\}|^Compiled" | sed "s|^|  |"
            done
            echo "== Forge's input handlers' calls"
            for cls in net.minecraft.client.KeyboardHandler net.minecraft.client.MouseHandler; do
              javap -c -p -cp "$client:$cp" "$cls" > code.txt 2>&1
              awk '/^  [a-z].*\(/ { m = $0 } /invoke/ && /(Screen|Forge|Event|Hooks)/ { print m " ||| " $0 }' code.txt \
                | grep -E "keyPress|charTyped|onButton|handleAccumulatedMovement|onScroll|onMove|lambda" | sed -E 's/ +/ /g' | cut -c1-330 | head -60
            done
            echo "== Forge's screen input hooks"
            for cls in net.minecraftforge.client.ForgeHooksClient net.minecraftforge.client.event.ForgeEventFactoryClient; do
              javap -c -p -cp "$universal:$client:$cp" "$cls" > hooks.txt 2>&1 || continue
              awk '/^  [a-z].*\(/ { m = $0; p = (m ~ /onScreen|Screen(Key|Mouse|Char)|ScreenKey|ScreenMouse|ScreenChar/) ; if (p) print "  " m } p && /invoke|ireturn|ifeq|ifne/ { print "      " $0 }' hooks.txt \
                | sed -E 's/ +/ /g' | cut -c1-260 | head -120
            done
            echo "== SimpleJsonResourceReloadListener"
            javap -c -p -cp "$client:$cp" net.minecraft.server.packs.resources.SimpleJsonResourceReloadListener > sjrrl.txt 2>&1
            grep -E "^  [a-z].*\(|invoke|getstatic|instanceof|checkcast" sjrrl.txt | sed -E 's/ +/ /g' | cut -c1-260 | head -90
            echo "== RegistryDataLoader.loadElementFromResource"
            javap -c -p -cp "$client:$cp" net.minecraft.resources.RegistryDataLoader > rdl.txt 2>&1
            awk '/^  [a-z].*\(/ { m = $0; p = (m ~ /loadElementFromResource|loadContentsFromManager/) ; if (p) print "  " m } p && /invoke|getstatic|instanceof/ { print "      " $0 }' rdl.txt | sed -E 's/ +/ /g' | cut -c1-260 | head -60
            echo "== Forge's conditions"
            unzip -Z1 "$universal" | grep -E "^net/minecraftforge/common/crafting/conditions/[A-Za-z]+\.class$" | head -30
            cd "$GITHUB_WORKSPACE"
          done
          true
