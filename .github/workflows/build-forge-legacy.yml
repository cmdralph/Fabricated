name: Build forge-legacy

# The full matrix for Forge 47 for 1.20.1 (mc/forge-legacy, the project :mc:forge-legacy-1.20.1), on the forge-legacy
# branch: built, then a dedicated server and a client with the test mod, and again with Fabric API, each a gate but the
# client with Fabric API. It runs for pull requests to forge-legacy and by hand, with the quick check (check.yml) on
# each push to a working branch, which stands down while the branch has a pull request. The plan job reads the version's
# pins from its folder (ci/changed-targets.py); a push to forge-legacy (a merge) only builds, which keeps its Gradle
# caches current. Shared changes come from main by merge (scripts/sync-platform-branch.sh). Changes to documentation
# alone build nothing.
on:
  pull_request:
    branches: [forge-legacy]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/check.yml'
  push:
    branches: [forge-legacy]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/check.yml'
  workflow_dispatch:
    inputs:
      extended:
        description: Also the mod corpus on a server and a client (informational)
        type: boolean
        default: false

env:
  GAME_RUNS: ${{ github.event_name != 'push' || github.ref_type == 'tag' }}
  EXTENDED: ${{ github.ref_type == 'tag' || inputs.extended == true }}

permissions:
  contents: read

concurrency:
  group: build-forge-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Pick the versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The versions a pull request's changes touch, or a push's (a merge). A run by hand, or a push whose previous
          # commit can't be fetched, runs every version.
          mode=--all
          : > "$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt" && mode=--full
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git fetch -q --depth=1 origin "$BEFORE"; then
            git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/changed.txt" && mode=--full
          fi
          targets=$(python3 -I ci/changed-targets.py "$mode" . < "$RUNNER_TEMP/changed.txt")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Versions: $(python3 -c 'import json, sys; print(" ".join(t["minecraft"] for t in json.loads(sys.argv[1])) or "none")' "$targets")" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  core:
    name: Core and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Minecraft-independent modules
        run: ./gradlew -Pfabricated.coreOnly=true build --stacktrace

  minecraft:
    name: Forge ${{ matrix.target.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: plan
    if: ${{ needs.plan.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Newest Forge builds for ${{ matrix.target.minecraft }} (informational)
        run: |
          newest=$(curl -fsS https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml \
            | grep -o "<version>${{ matrix.target.minecraft }}-[^<]*" | sed 's/<version>//' | tail -n 5 | tr '\n' ' ') || true
          echo "Pinned: ${{ matrix.target.loader }}. Newest published: ${newest:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Only the requested project and what it depends on are configured, not main's NeoForge projects.
      - name: Forge libraries on the compile classpath (informational)
        run: ./gradlew -Pfabricated.platforms=forge-legacy --configure-on-demand :mc:forge-legacy-${{ matrix.target.minecraft }}:forgeClasspathReport || true
      - name: Build Fabricated and the test mod
        run: ./gradlew -Pfabricated.platforms=forge-legacy --configure-on-demand :mc:forge-legacy-${{ matrix.target.minecraft }}:fabricatedJar :mc:forge-legacy-${{ matrix.target.minecraft }}:testmodJar --stacktrace
      - name: Check the jar's layout for Forge
        run: ./gradlew -Pfabricated.platforms=forge-legacy --configure-on-demand :mc:forge-legacy-${{ matrix.target.minecraft }}:checkForgeJar --stacktrace
      # Forge 47 runs on Java 17 (the version's java_version).
      - name: Select Java ${{ matrix.target.java }} for the game
        run: echo "JAVA_HOME=$JAVA_HOME_${{ matrix.target.java }}_X64" >> "$GITHUB_ENV" && echo "$JAVA_HOME_${{ matrix.target.java }}_X64/bin" >> "$GITHUB_PATH"
      # The game on this branch: what Forge 47 makes of the jar and of the translated test mod. The server must start
      # and every check pass (#93's first run showed a registration failure stopping it, under a green job).
      - name: Server with Fabricated (must pass)
        if: ${{ env.GAME_RUNS == 'true' }}
        run: |
          ci/forge-legacy/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server"
      # The official Fabric API jar (downloaded here in CI, never by Fabricated) with every module passed through: what
      # loads on Forge 47 and what pre-flight disables, for L4's choice of native modules. A gate like the first run.
      - name: Server with Fabricated and Fabric API (must pass)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/extra/fabric-api.jar" \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${{ matrix.target.fabric_api }}/fabric-api-${{ matrix.target.fabric_api }}.jar"
          ci/forge-legacy/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-fapi" "$RUNNER_TEMP/extra"
      # The client (docs/PORTING.md §7, L4): a Forge 47 client with the test mod reaches a singleplayer world through
      # mc-runtime-test, and the Fabric client entrypoints run after the main ones. A gate like the server runs.
      - name: Install Mesa EGL for the client
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Client with Fabricated (must pass)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci/forge-legacy/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client"
      # The client with the official Fabric API jar the server run downloaded: which of its client modules load on
      # Forge, and whether the client still reaches a world with them. Informational until it holds.
      - name: Client with Fabricated and Fabric API (informational)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci/forge-legacy/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-fapi" "$RUNNER_TEMP/extra"
      # Popular Fabric mods from Modrinth (ci/mod-corpus.txt, downloaded here in CI and checked against Modrinth's
      # SHA-512) with Fabric API, as build.yml runs them on NeoForge: which load on Forge, which are disabled and why.
      # Informational, with "extended" or on a release tag; a mod whose initializer throws is disabled, not fatal.
      - name: Fetch the mod corpus
        id: corpus
        if: ${{ env.EXTENDED == 'true' && !cancelled() }}
        continue-on-error: true
        run: |
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/corpus" | tee "$RUNNER_TEMP/corpus.txt"
          # Left out: jars Forge refuses before Fabricated runs, which put it in its error state (CORPUS-35): YACL's Fabric
          # build, whose mods.toml asks for no javafml version (YACL has a Forge build).
          rm -f "$RUNNER_TEMP"/corpus/yet_another_config_lib_v3-*-fabric.jar
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/corpus/"
      - name: Server with the mod corpus (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        env:
          SMOKE_ON_ENTRYPOINT_FAILURE: disable
        run: |
          ci/forge-legacy/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-corpus" "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/server-corpus.out" 2>&1 || true
          ci/corpus-summary.sh "$RUNNER_TEMP/server-corpus" "server with the corpus"
      - name: Client with the mod corpus (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_ON_ENTRYPOINT_FAILURE: disable
        run: |
          SMOKE_TIMEOUT=600 ci/forge-legacy/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-corpus" "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/client-corpus.out" 2>&1 || true
          ci/corpus-summary.sh "$RUNNER_TEMP/client-corpus/run" "client with the corpus"
      - name: Upload mod corpus logs and reports
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: corpus-forge-legacy-${{ matrix.target.minecraft }}
          path: |
            ${{ runner.temp }}/corpus.txt
            ${{ runner.temp }}/server-corpus.out
            ${{ runner.temp }}/server-corpus/logs
            ${{ runner.temp }}/server-corpus/crash-reports
            ${{ runner.temp }}/client-corpus.out
            ${{ runner.temp }}/client-corpus/run/logs
            ${{ runner.temp }}/client-corpus/run/crash-reports
          if-no-files-found: ignore
      - name: Upload Fabricated jar
        uses: actions/upload-artifact@v4
        with:
          name: fabricated-forge-${{ matrix.target.minecraft }}
          path: build/libs/fabricated-forge-*+mc${{ matrix.target.minecraft }}.jar
          if-no-files-found: error
