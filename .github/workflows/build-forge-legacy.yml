name: Build forge-legacy

# The full matrix for Forge 47 for 1.20.1 (mc/forge-legacy, the project :mc:forge-legacy-1.20.1), on the forge-legacy
# branch: built, then a dedicated server and a client with the test mod, and again with Fabric API, each a gate but the
# client with Fabric API. It runs for pull requests to forge-legacy and by hand, with the quick check (check.yml) on
# each push to a working branch, which stands down while the branch has a pull request. The plan job reads the version's
# pins from its folder (ci/changed-targets.py); a push to forge-legacy (a merge) only builds, which keeps its Gradle
# caches current. Shared changes come from main by merge (scripts/sync-platform-branch.sh). Changes to documentation
# alone build nothing.
on:
  pull_request:
    branches: [forge-legacy]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/check.yml'
  push:
    branches: [forge-legacy]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/check.yml'
  workflow_dispatch:
    inputs:
      extended:
        description: Also the mod corpus on a server and a client (informational), and the difficult mods' Fabric builds on a client (gates)
        type: boolean
        default: false

env:
  GAME_RUNS: ${{ github.event_name != 'push' || github.ref_type == 'tag' }}
  EXTENDED: ${{ github.ref_type == 'tag' || inputs.extended == true }}

permissions:
  contents: read

concurrency:
  group: build-forge-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Pick the versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The versions a pull request's changes touch, or a push's (a merge). A run by hand, or a push whose previous
          # commit can't be fetched, runs every version.
          mode=--all
          : > "$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt" && mode=--full
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git fetch -q --depth=1 origin "$BEFORE"; then
            git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/changed.txt" && mode=--full
          fi
          targets=$(python3 -I ci/changed-targets.py "$mode" . < "$RUNNER_TEMP/changed.txt")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Versions: $(python3 -c 'import json, sys; print(" ".join(t["minecraft"] for t in json.loads(sys.argv[1])) or "none")' "$targets")" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  core:
    name: Core and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Minecraft-independent modules
        run: ./gradlew -Pfabricated.coreOnly=true build --stacktrace

  minecraft:
    name: Forge ${{ matrix.target.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: plan
    if: ${{ needs.plan.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Newest Forge builds for ${{ matrix.target.minecraft }} (informational)
        run: |
          newest=$(curl -fsS https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml \
            | grep -o "<version>${{ matrix.target.minecraft }}-[^<]*" | sed 's/<version>//' | tail -n 5 | tr '\n' ' ') || true
          echo "Pinned: ${{ matrix.target.loader }}. Newest published: ${newest:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Only the requested project and what it depends on are configured, not main's NeoForge projects.
      - name: Forge libraries on the compile classpath (informational)
        run: ./gradlew -Pfabricated.platforms=forge-legacy --configure-on-demand :mc:forge-legacy-${{ matrix.target.minecraft }}:forgeClasspathReport || true
      # With the test mod that fails on purpose (mc/shared/src/testmodbroken), which the server runs beside it (HOLD-2),
      # and the renderer test mod, reobfuscated to Forge 47's names (testmods builds that copy).
      - name: Build Fabricated and the test mods
        run: >-
          ./gradlew -Pfabricated.platforms=forge-legacy --configure-on-demand :mc:forge-legacy-${{ matrix.target.minecraft }}:fabricatedJar
          :mc:forge-legacy-${{ matrix.target.minecraft }}:testmodJar :mc:forge-legacy-${{ matrix.target.minecraft }}:testmodThrowsJar
          :mc:forge-legacy-${{ matrix.target.minecraft }}:testmods --stacktrace
      - name: Check the jar's layout for Forge
        run: ./gradlew -Pfabricated.platforms=forge-legacy --configure-on-demand :mc:forge-legacy-${{ matrix.target.minecraft }}:checkForgeJar --stacktrace
      # Forge 47 runs on Java 17 (the version's java_version).
      - name: Select Java ${{ matrix.target.java }} for the game
        run: echo "JAVA_HOME=$JAVA_HOME_${{ matrix.target.java }}_X64" >> "$GITHUB_ENV" && echo "$JAVA_HOME_${{ matrix.target.java }}_X64/bin" >> "$GITHUB_PATH"
      # The game on this branch: what Forge 47 makes of the jar and of the translated test mod. The server must start
      # and every check pass (#93's first run showed a registration failure stopping it, under a green job).
      - name: Server with Fabricated (must pass)
        if: ${{ env.GAME_RUNS == 'true' }}
        run: |
          ci/forge-legacy/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server"
      # The official Fabric API jar (downloaded here in CI, never by Fabricated) with every module passed through: what
      # loads on Forge 47 and what pre-flight disables, for L4's choice of native modules. A gate like the first run.
      - name: Server with Fabricated and Fabric API (must pass)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/extra/fabric-api.jar" \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${{ matrix.target.fabric_api }}/fabric-api-${{ matrix.target.fabric_api }}.jar"
          ci/forge-legacy/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-fapi" "$RUNNER_TEMP/extra"
      # Mods that share the game with Fabricated, as stand-ins built from Fabricated's own jar (ci/forge-legacy/standins.py):
      # a Fabric API module another Forge mod provides, straight and nested with its mixins, and two versions of a library
      # Fabric mods nest. Fabricated's part of each module must stand down (PROVIDER-1, as on NeoForge), and the copy of
      # Fabric Loader the Forgified Fabric API stand-in nests must be left out for the in-game mod's empty jar (PROVIDER-2);
      # a gate.
      - name: Server with stand-ins for coexisting mods (must pass)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/standins"
          python3 -I ci/forge-legacy/standins.py build/libs/fabricated-forge-[0-9]*+mc${{ matrix.target.minecraft }}.jar "$RUNNER_TEMP/standins"
          ci/forge-legacy/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-standins" "$RUNNER_TEMP/standins"
      # Sinytra Connector (a stand-in with its mod id), a second Fabricated jar or a jar with its own copy of Fabric Loader
      # in the mods folder: the launch must stop with Fabricated's error naming them, as on NeoForge: two loaders of Fabric
      # mods can't share them (DUP-1), nor two copies of Fabric Loader's packages one game (PROVIDER-2).
      - name: Server refusing Sinytra Connector, a second Fabricated jar and a copy of Fabric Loader (must pass)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/refuse-connector/src/META-INF" "$RUNNER_TEMP/refuse-twice"
          printf 'modLoader = "lowcodefml"\nloaderVersion = "[1,)"\nlicense = "GPL-3.0-only"\n[[mods]]\nmodId = "connector"\nversion = "1.0.0"\n' \
              > "$RUNNER_TEMP/refuse-connector/src/META-INF/mods.toml"
          jar --create --file "$RUNNER_TEMP/refuse-connector/connector-standin.jar" -C "$RUNNER_TEMP/refuse-connector/src" META-INF/mods.toml
          cp build/libs/fabricated-forge-*+mc${{ matrix.target.minecraft }}.jar "$RUNNER_TEMP/refuse-twice/fabricated-forge-0.0.1+mc${{ matrix.target.minecraft }}.jar"
          SMOKE_TESTMODS=none SMOKE_TIMEOUT=300 SMOKE_EXPECT_REFUSAL="Sinytra Connector (connector-standin.jar)" \
              ci/forge-legacy/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-refuse-connector" "$RUNNER_TEMP/refuse-connector"
          SMOKE_TESTMODS=none SMOKE_TIMEOUT=300 SMOKE_EXPECT_REFUSAL="2 Fabricated jars (fabricated-forge-0.0.1+mc${{ matrix.target.minecraft }}.jar" \
              ci/forge-legacy/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-refuse-twice" "$RUNNER_TEMP/refuse-twice"
          # A jar with its own copy of Fabric Loader under another identifier than Forgified Fabric Loader's, which the
          # in-game mod's empty jar replaces (the stand-ins' run above): refused at once, before Forge builds a layer, where
          # both copies would stop the launch with a module error naming neither (PROVIDER-2).
          mkdir -p "$RUNNER_TEMP/refuse-loader"
          python3 -I ci/forge-legacy/standins.py build/libs/fabricated-forge-[0-9]*+mc${{ matrix.target.minecraft }}.jar "$RUNNER_TEMP/refuse-loader" own-loader
          SMOKE_TESTMODS=none SMOKE_TIMEOUT=300 SMOKE_REFUSAL_AT_ONCE=1 \
              SMOKE_EXPECT_REFUSAL="standin-own-loader.jar (its standin-fabric-loader.jar) has its own copy of Fabric Loader" \
              ci/forge-legacy/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-refuse-loader" "$RUNNER_TEMP/refuse-loader"
      # The client (docs/PORTING.md §7, L4): a Forge 47 client with the test mod reaches a singleplayer world through
      # mc-runtime-test, and the Fabric client entrypoints run after the main ones. A gate like the server runs.
      - name: Install Mesa EGL for the client
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Client with Fabricated (must pass)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci/forge-legacy/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client"
      # The client with the official Fabric API jar the server run downloaded: its client modules load on Forge, and the
      # client still reaches a world with them. The renderer test mod (task 4, R5) joins it, and its checks are the
      # smoke's. A gate like the other runs since the v0.6.0-beta pass.
      - name: Client with Fabricated and Fabric API (must pass)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-client"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-client/"
          cp mc/forge-legacy/${{ matrix.target.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-client/"
          ci/forge-legacy/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-fapi" "$RUNNER_TEMP/extra-client"
      # Forgified Fabric API for 1.20.1, its newest build from Modrinth (downloaded here in CI), beside Fabricated and the
      # test mods (task 5, PROVIDER-2): Forge's jar-in-jar must leave its Fabric Loader out for the in-game mod's empty
      # jar, its modules provide Fabric API's (Fabricated's copies standing down), and the server must start, the test
      # mod's checks of those modules taking the provider's answers its source reads as its own (PROVIDER-14). A gate
      # since it passed on two extended runs in a row (41833110379 and 41840874477, CI-1), as on NeoForge.
      - name: Server with Forgified Fabric API (must pass)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        run: |
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/ffapi" forge forgified-fabric-api || true
          mkdir -p "$RUNNER_TEMP/with-ffapi"
          cp "$RUNNER_TEMP"/ffapi/*.jar "$RUNNER_TEMP/with-ffapi/" 2>/dev/null || { echo "Forgified Fabric API wasn't downloaded"; exit 0; }
          status=0
          ci/forge-legacy/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-ffapi" "$RUNNER_TEMP/with-ffapi" \
              > "$RUNNER_TEMP/server-ffapi.out" 2>&1 || status=$?
          [ "$status" = 0 ] && echo "== the server with Forgified Fabric API passed" || echo "== the server with Forgified Fabric API failed"
          grep -E '^(PASS|FAIL|SKIP|NOT SEEN):' "$RUNNER_TEMP/server-ffapi.out" | grep -v '^PASS' | head -n 60 || true
          # What the test mod's checks met where they didn't pass: the provider's modules answer some differently.
          echo "== The test mod's other lines"
          grep -h 'FABRICATED-FORGE-TEST' "$RUNNER_TEMP/server-ffapi/logs/latest.log" 2>/dev/null | grep -v ' OK$\| OK (' | head -n 30 | cut -c1-600 || true
          echo "== Fabric API providers"
          sed -n '/^== Fabric API providers/,/^== /p' "$RUNNER_TEMP/server-ffapi/logs/fabric-bridge-report.txt" 2>/dev/null | head -n 40 || true
          if [ "$status" != 0 ]; then
            ci/forge-legacy/corpus-causes.sh "$RUNNER_TEMP/server-ffapi" "$RUNNER_TEMP/server-ffapi/server.out" "server with Forgified Fabric API" || true
            exit 1
          fi
      # What Forgified Fabric API's build nests, and which of Fabric Loader's classes outside its API its modules use,
      # read off the jar. Informational, with "extended".
      - name: What Forgified Fabric API for 1.20.1 nests and uses of Fabric Loader
        if: ${{ env.EXTENDED == 'true' && !cancelled() }}
        continue-on-error: true
        run: |
          for jar in "$RUNNER_TEMP"/ffapi/*.jar; do
            [ -f "$jar" ] && { python3 -I ci/forge-legacy/ffapi-anatomy.py "$jar" | head -n 220 || true; }
          done
      # The client with Forgified Fabric API for 1.20.1 beside Fabricated and the test mod (task 5): it must reach its world;
      # the test mod's checks of the modules it provides are evidence, as those modules are then its own, as on NeoForge.
      # Informational, with "extended".
      - name: Client with Forgified Fabric API (informational)
        if: ${{ env.EXTENDED == 'true' && !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls "$RUNNER_TEMP"/with-ffapi/*.jar > /dev/null 2>&1 || { echo "Forgified Fabric API wasn't downloaded"; exit 0; }
          ci/forge-legacy/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-ffapi" "$RUNNER_TEMP/with-ffapi" \
              > "$RUNNER_TEMP/client-ffapi.out" 2>&1 && echo "== the client with Forgified Fabric API passed" || echo "== the client with Forgified Fabric API failed"
          grep -E '^(PASS|FAIL|SKIP|NOT SEEN):' "$RUNNER_TEMP/client-ffapi.out" | grep -v '^PASS' | head -n 60 || true
          echo "== The test mod's other lines"
          grep -h 'FABRICATED-FORGE-TEST' "$RUNNER_TEMP/client-ffapi/run/logs/latest.log" 2>/dev/null | grep -v ' OK$\| OK (' | head -n 30 | cut -c1-600 || true
          ci/forge-legacy/corpus-causes.sh "$RUNNER_TEMP/client-ffapi/run" "$RUNNER_TEMP/client-ffapi/client.out" "client with Forgified Fabric API" || true
      # Popular Fabric mods from Modrinth (ci/mod-corpus.txt, downloaded here in CI and checked against Modrinth's
      # SHA-512) with Fabric API, as build.yml runs them on NeoForge: which load on Forge, which are disabled and why.
      # Informational, with "extended" or on a release tag; a mod whose initializer throws is disabled, not fatal.
      - name: Fetch the mod corpus
        id: corpus
        if: ${{ env.EXTENDED == 'true' && !cancelled() }}
        continue-on-error: true
        run: |
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/corpus" | tee "$RUNNER_TEMP/corpus.txt"
          # Left out: jars Forge refuses before Fabricated runs, which put it in its error state (CORPUS-35): YACL's Fabric
          # build, whose mods.toml asks for no javafml version (YACL has a Forge build).
          rm -f "$RUNNER_TEMP"/corpus/yet_another_config_lib_v3-*-fabric.jar
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/corpus/"
      - name: Server with the mod corpus (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        env:
          SMOKE_ON_ENTRYPOINT_FAILURE: disable
        run: |
          ci/forge-legacy/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-corpus" "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/server-corpus.out" 2>&1 || true
          ci/corpus-summary.sh "$RUNNER_TEMP/server-corpus" "server with the corpus"
      - name: Client with the mod corpus (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_ON_ENTRYPOINT_FAILURE: disable
        run: |
          SMOKE_TIMEOUT=600 ci/forge-legacy/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-corpus" "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/client-corpus.out" 2>&1 || true
          ci/corpus-summary.sh "$RUNNER_TEMP/client-corpus/run" "client with the corpus"
      # What stopped the corpus runs, past the summary's crash descriptions (CORPUS-54, CORPUS-55): the crash reports'
      # exception chains to their innermost cause, the logs' Mixin errors, and the console's last lines.
      - name: What stopped the mod corpus runs (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        run: |
          ci/forge-legacy/corpus-causes.sh "$RUNNER_TEMP/server-corpus" "$RUNNER_TEMP/server-corpus/server.out" "server with the corpus"
          ci/forge-legacy/corpus-causes.sh "$RUNNER_TEMP/client-corpus/run" "$RUNNER_TEMP/client-corpus/client.out" "client with the corpus"
      - name: Upload mod corpus logs and reports
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: corpus-forge-legacy-${{ matrix.target.minecraft }}
          path: |
            ${{ runner.temp }}/corpus.txt
            ${{ runner.temp }}/server-corpus.out
            ${{ runner.temp }}/server-corpus/server.out
            ${{ runner.temp }}/server-corpus/logs
            ${{ runner.temp }}/server-corpus/crash-reports
            ${{ runner.temp }}/client-corpus.out
            ${{ runner.temp }}/client-corpus/client.out
            ${{ runner.temp }}/client-corpus/run/logs
            ${{ runner.temp }}/client-corpus/run/crash-reports
          if-no-files-found: ignore
      - name: Upload Fabricated jar
        uses: actions/upload-artifact@v4
        with:
          name: fabricated-forge-${{ matrix.target.minecraft }}
          path: build/libs/fabricated-forge-*+mc${{ matrix.target.minecraft }}.jar
          if-no-files-found: error

  # The difficult mods' Fabric builds (task 5, decision 3), each on a client with Fabric API, with "extended", beside the
  # version's own job. The compatibility plan loads them on NeoForge and Forge, as each run here held on two extended runs
  # in a row (CI-1): every run is a gate.
  difficult:
    name: Forge ${{ matrix.target.minecraft }}, the difficult mods' Fabric builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: plan
    if: ${{ needs.plan.outputs.targets != '[]' && (github.ref_type == 'tag' || inputs.extended == true) }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SMOKE_ON_ENTRYPOINT_FAILURE: disable
      MC: ${{ matrix.target.minecraft }}
      FORGE: ${{ matrix.target.loader }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabricated and the test mods
        run: >-
          ./gradlew -Pfabricated.platforms=forge-legacy --configure-on-demand :mc:forge-legacy-${{ matrix.target.minecraft }}:fabricatedJar
          :mc:forge-legacy-${{ matrix.target.minecraft }}:testmodJar :mc:forge-legacy-${{ matrix.target.minecraft }}:testmods --stacktrace
      - name: Select Java ${{ matrix.target.java }} for the game
        run: echo "JAVA_HOME=$JAVA_HOME_${{ matrix.target.java }}_X64" >> "$GITHUB_ENV" && echo "$JAVA_HOME_${{ matrix.target.java }}_X64/bin" >> "$GITHUB_PATH"
      - name: Install Mesa EGL for the client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Fabric API
        run: |
          mkdir -p "$RUNNER_TEMP/fabric-api"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/fabric-api/fabric-api.jar" \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${{ matrix.target.fabric_api }}/fabric-api-${{ matrix.target.fabric_api }}.jar"
      # What a run of these mods shows: the report's summary and what it left out, the mods' errors, and what stopped
      # the game, to its innermost cause.
      # With Indium, Sodium 0.5's renderer of Fabric's API, which Fabric mods' block models need under Sodium on 1.20.1
      # (on Fabric too; Sodium has its own from 0.6). A gate, as on NeoForge: every smoke check passes, with a mod whose
      # initializer throws stopping the game, and the two load. On their own, as Iris changes what Sodium hooks.
      - name: Sodium and Indium, with the renderer test mod (must pass)
        if: ${{ !cancelled() }}
        env:
          SMOKE_ON_ENTRYPOINT_FAILURE: ''
        run: |
          dir="$RUNNER_TEMP/extra-sodium-gate"
          mkdir -p "$dir"
          python3 ci/fetch-corpus.py "$MC" "$dir" fabric sodium indium || true
          ls "$dir"/sodium*.jar >/dev/null 2>&1 || { echo "Modrinth has no Fabric build of Sodium for $MC: nothing to run"; exit 0; }
          cp "$RUNNER_TEMP/fabric-api/fabric-api.jar" mc/forge-legacy/$MC/build/testmods/fabricated-testmod-frapi.jar "$dir/"
          status=0
          SMOKE_TIMEOUT=480 ci/forge-legacy/smoke-client.sh "$MC" "$FORGE" "$RUNNER_TEMP/client-sodium-gate" "$dir" > "$RUNNER_TEMP/client-sodium-gate.out" 2>&1 || status=$?
          ci/forge-legacy/difficult-summary.sh "$RUNNER_TEMP/client-sodium-gate" "$status" "Sodium and Indium" "FABRICATED-TEST frapi|Sodium|Indium|sodium|indium" sodium indium
          ci/gate-mods.sh "$RUNNER_TEMP/client-sodium-gate" "$status" "Sodium and Indium" sodium indium
      # Iris with them, its particle and shader hooks repaired for Forge 47 (IRIS-1). A gate the same way: the three load.
      - name: Sodium, Indium and Iris, with the renderer test mod (must pass)
        if: ${{ !cancelled() }}
        env:
          SMOKE_ON_ENTRYPOINT_FAILURE: ''
        run: |
          dir="$RUNNER_TEMP/extra-sodium"
          mkdir -p "$dir"
          python3 ci/fetch-corpus.py "$MC" "$dir" fabric sodium iris indium || true
          ls "$dir"/sodium*.jar >/dev/null 2>&1 || { echo "Modrinth has no Fabric build of Sodium for $MC: nothing to run"; exit 0; }
          cp "$RUNNER_TEMP/fabric-api/fabric-api.jar" mc/forge-legacy/$MC/build/testmods/fabricated-testmod-frapi.jar "$dir/"
          status=0
          SMOKE_TIMEOUT=480 ci/forge-legacy/smoke-client.sh "$MC" "$FORGE" "$RUNNER_TEMP/client-sodium" "$dir" > "$RUNNER_TEMP/client-sodium.out" 2>&1 || status=$?
          ci/forge-legacy/difficult-summary.sh "$RUNNER_TEMP/client-sodium" "$status" "Sodium and Iris" "FABRICATED-TEST frapi|Sodium|Iris|Indium|sodium|iris|indium" sodium iris indium
          ci/gate-mods.sh "$RUNNER_TEMP/client-sodium" "$status" "Sodium, Indium and Iris" sodium iris indium
      # A gate, as on NeoForge: every smoke check passes, with a mod whose initializer throws stopping the game, and the
      # four load.
      - name: malilib, MiniHUD, Tweakeroo and Litematica (must pass)
        if: ${{ !cancelled() }}
        env:
          SMOKE_ON_ENTRYPOINT_FAILURE: ''
        run: |
          dir="$RUNNER_TEMP/extra-malilib"
          mkdir -p "$dir"
          python3 ci/fetch-corpus.py "$MC" "$dir" fabric malilib minihud tweakeroo litematica || true
          ls "$dir"/malilib*.jar >/dev/null 2>&1 || { echo "Modrinth has no Fabric build of malilib for $MC: nothing to run"; exit 0; }
          cp "$RUNNER_TEMP/fabric-api/fabric-api.jar" "$dir/"
          status=0
          SMOKE_TIMEOUT=420 ci/forge-legacy/smoke-client.sh "$MC" "$FORGE" "$RUNNER_TEMP/client-malilib" "$dir" > "$RUNNER_TEMP/client-malilib.out" 2>&1 || status=$?
          ci/forge-legacy/difficult-summary.sh "$RUNNER_TEMP/client-malilib" "$status" "malilib and the mods needing it" "malilib|minihud|tweakeroo|litematica|MiniHUD|Tweakeroo|Litematica" malilib minihud tweakeroo litematica
          ci/gate-mods.sh "$RUNNER_TEMP/client-malilib" "$status" "malilib and the mods needing it" malilib minihud tweakeroo litematica
      # Launched twice, as on main: the first launch's loader downloads Essential, which Fabricated loads from the
      # second (DOWNLOAD-1). A gate, as on NeoForge: both launches pass every smoke check, with a mod whose initializer
      # throws stopping the game, and Essential loads in the second. Where its loader downloaded nothing (its server,
      # not Fabricated), the second launch is skipped with a warning.
      - name: Essential (must pass)
        if: ${{ !cancelled() }}
        env:
          SMOKE_ON_ENTRYPOINT_FAILURE: ''
        run: |
          dir="$RUNNER_TEMP/extra-essential"
          mkdir -p "$dir"
          python3 ci/fetch-corpus.py "$MC" "$dir" fabric essential | tee "$RUNNER_TEMP/summary-essential.txt" || true
          grep -qE "^essential: [^n]" "$RUNNER_TEMP/summary-essential.txt" || { echo "Modrinth has no Fabric build of Essential for $MC: nothing to run"; exit 0; }
          cp "$RUNNER_TEMP/fabric-api/fabric-api.jar" "$dir/"
          status=0
          SMOKE_TIMEOUT=420 ci/forge-legacy/smoke-client.sh "$MC" "$FORGE" "$RUNNER_TEMP/client-essential-first" "$dir" > "$RUNNER_TEMP/client-essential-first.out" 2>&1 || status=$?
          ci/forge-legacy/difficult-summary.sh "$RUNNER_TEMP/client-essential-first" "$status" "Essential's first launch" "essential|Essential" essential-container essential-loader
          failed=0
          ci/gate-mods.sh "$RUNNER_TEMP/client-essential-first" "$status" "Essential's first launch" essential-container essential-loader || failed=1
          mkdir -p "$RUNNER_TEMP/seed-essential"
          [ -d "$RUNNER_TEMP/client-essential-first/run/essential" ] && cp -r "$RUNNER_TEMP/client-essential-first/run/essential" "$RUNNER_TEMP/seed-essential/"
          if ! ls "$RUNNER_TEMP/seed-essential/essential/"Essential*.jar >/dev/null 2>&1; then
            echo "::warning::Essential's loader downloaded nothing in the first launch (its server): no second launch to gate"
            exit "$failed"
          fi
          status=0
          SMOKE_SEED="$RUNNER_TEMP/seed-essential" SMOKE_TIMEOUT=420 ci/forge-legacy/smoke-client.sh "$MC" "$FORGE" "$RUNNER_TEMP/client-essential" "$dir" \
              > "$RUNNER_TEMP/client-essential.out" 2>&1 || status=$?
          ci/forge-legacy/difficult-summary.sh "$RUNNER_TEMP/client-essential" "$status" "Essential's second launch" "essential|Essential" essential-container essential-loader essential
          ci/gate-mods.sh "$RUNNER_TEMP/client-essential" "$status" "Essential's second launch" essential-container essential-loader essential || failed=1
          exit "$failed"
      # A gate, as on NeoForge: every smoke check passes, with a mod whose initializer throws stopping the game, and
      # Flashback loads.
      - name: Flashback (must pass)
        if: ${{ !cancelled() }}
