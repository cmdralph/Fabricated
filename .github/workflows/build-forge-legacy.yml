name: Build forge-legacy

# The forge-legacy branch's build of Forge 1.20.1 (mc/forge-legacy, the project :mc:forge-legacy-1.20.1): pull requests
# to the branch only (owner decision D6). Every branch holds every platform; main's build.yml builds NeoForge's. Two
# server smokes on Forge 47, with the test mod and with Fabric API too, each a gate: the server must start and every
# check pass (docs/PORTING.md §7). Changes to documentation alone build nothing, nor do changes to another platform's
# folders alone.
on:
  pull_request:
    branches: [forge-legacy]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'mc/neoforge/**'
      - 'mc/forge/**'
      - 'mc/platform-neoforge.gradle'
      - 'mc/platform-forge.gradle'
      - 'loader/neoforge/**'
      - 'loader/forge/**'
      - 'ci/neoforge/**'
      - 'ci/forge/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-forge.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/branch-readme.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-forge-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Minecraft-independent modules
        run: ./gradlew -Pfabricated.coreOnly=true build --stacktrace

  minecraft:
    name: Forge ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: core
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.20.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Newest Forge builds for ${{ matrix.minecraft }} (informational)
        run: |
          pinned=$(sed -n 's/^forge_version=//p' "mc/forge-legacy/${{ matrix.minecraft }}/gradle.properties")
          newest=$(curl -fsS https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml \
            | grep -o "<version>${{ matrix.minecraft }}-[^<]*" | sed 's/<version>//' | tail -n 5 | tr '\n' ' ') || true
          echo "Pinned: $pinned. Newest published: ${newest:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Only the requested project and what it depends on are configured, not main's NeoForge projects.
      - name: Forge libraries on the compile classpath (informational)
        run: ./gradlew -Pfabricated.platforms=forge-legacy --configure-on-demand :mc:forge-legacy-${{ matrix.minecraft }}:forgeClasspathReport || true
      - name: Build Fabricated and the test mod
        run: ./gradlew -Pfabricated.platforms=forge-legacy --configure-on-demand :mc:forge-legacy-${{ matrix.minecraft }}:fabricatedJar :mc:forge-legacy-${{ matrix.minecraft }}:testmodJar --stacktrace
      - name: Check the jar's layout for Forge
        run: ./gradlew -Pfabricated.platforms=forge-legacy --configure-on-demand :mc:forge-legacy-${{ matrix.minecraft }}:checkForgeJar --stacktrace
      # The game on this branch: what Forge 47 makes of the jar and of the translated test mod. The server must start
      # and every check pass (#93's first run showed a registration failure stopping it, under a green job).
      - name: Server with Fabricated (must pass)
        run: |
          # Forge 47 runs on Java 17.
          export PATH="$JAVA_HOME_17_X64/bin:$PATH"
          forge=$(sed -n 's/^forge_version=//p' "mc/forge-legacy/${{ matrix.minecraft }}/gradle.properties")
          ci/forge-legacy/smoke-server.sh "${{ matrix.minecraft }}" "$forge" "$RUNNER_TEMP/server"
      # The official Fabric API jar (downloaded here in CI, never by Fabricated) with every module passed through: what
      # loads on Forge 47 and what pre-flight disables, for L4's choice of native modules. A gate like the first run.
      - name: Server with Fabricated and Fabric API (must pass)
        if: ${{ !cancelled() }}
        run: |
          export PATH="$JAVA_HOME_17_X64/bin:$PATH"
          forge=$(sed -n 's/^forge_version=//p' "mc/forge-legacy/${{ matrix.minecraft }}/gradle.properties")
          fabric_api=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fabricApiVersion"])' \
            "mc/forge-legacy/${{ matrix.minecraft }}/src/fabricated/resources/META-INF/fabricated/fabric-api-plan.json")
          mkdir -p "$RUNNER_TEMP/extra"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/extra/fabric-api.jar" \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${fabric_api}/fabric-api-${fabric_api}.jar"
          ci/forge-legacy/smoke-server.sh "${{ matrix.minecraft }}" "$forge" "$RUNNER_TEMP/server-fapi" "$RUNNER_TEMP/extra"
      # The client (docs/PORTING.md §7, L4): a Forge 47 client with the test mod reaches a singleplayer world through
      # mc-runtime-test, and the Fabric client entrypoints run after the main ones. A gate like the server runs.
      - name: Install Mesa EGL for the client
        if: ${{ !cancelled() }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Client with Fabricated (must pass)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Forge 47 runs on Java 17.
          export JAVA_HOME="$JAVA_HOME_17_X64"; export PATH="$JAVA_HOME/bin:$PATH"
          forge=$(sed -n 's/^forge_version=//p' "mc/forge-legacy/${{ matrix.minecraft }}/gradle.properties")
          ci/forge-legacy/smoke-client.sh "${{ matrix.minecraft }}" "$forge" "$RUNNER_TEMP/client"
      # The client with the official Fabric API jar the server run downloaded: which of its client modules load on
      # Forge, and whether the client still reaches a world with them. Informational until it holds.
      - name: Client with Fabricated and Fabric API (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"; export PATH="$JAVA_HOME/bin:$PATH"
          forge=$(sed -n 's/^forge_version=//p' "mc/forge-legacy/${{ matrix.minecraft }}/gradle.properties")
          ci/forge-legacy/smoke-client.sh "${{ matrix.minecraft }}" "$forge" "$RUNNER_TEMP/client-fapi" "$RUNNER_TEMP/extra"
      - name: Upload Fabricated jar
        uses: actions/upload-artifact@v4
        with:
          name: fabricated-forge-${{ matrix.minecraft }}
          path: build/libs/fabricated-forge-*+mc${{ matrix.minecraft }}.jar
          if-no-files-found: error
