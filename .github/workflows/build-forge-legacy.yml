          grep -qE "^flashback: [^n]" "$RUNNER_TEMP/summary-flashback.txt" || { echo "Modrinth has no Fabric build of Flashback for $MC: nothing to run"; exit 0; }
          cp "$RUNNER_TEMP/fabric-api/fabric-api.jar" "$dir/"
          status=0
          SMOKE_TIMEOUT=420 ci/forge-legacy/smoke-client.sh "$MC" "$FORGE" "$RUNNER_TEMP/client-flashback" "$dir" > "$RUNNER_TEMP/client-flashback.out" 2>&1 || status=$?
          ci/forge-legacy/difficult-summary.sh "$RUNNER_TEMP/client-flashback" "$status" "Flashback" "flashback|Flashback" flashback
          ci/gate-mods.sh "$RUNNER_TEMP/client-flashback" "$status" "Flashback" flashback
