name: Build forge

# The full matrix for Forge 61 to 66 (mc/forge, the projects :mc:forge-<version>), on the forge branch: built, then a
# dedicated server and a client with the test mod, and again with Fabric API, each a gate but the client with Fabric
# API. It runs for pull requests to forge and by hand, with the quick check (check.yml) on each push to a working
# branch, which stands down while the branch has a pull request. A pull request runs the versions it touches
# (ci/changed-targets.py --full: a version's own folder runs that version, anything shared every version), a run by hand
# all of them; a push to forge (a merge) only builds what it changed, which keeps its Gradle caches current. Shared
# changes come from main by merge (scripts/sync-platform-branch.sh). Changes to documentation alone build nothing.
on:
  pull_request:
    branches: [forge]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/check.yml'
  push:
    branches: [forge]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/check.yml'
  workflow_dispatch:
    inputs:
      extended:
        description: Also the mod corpus on a server and a client (informational)
        type: boolean
        default: false

env:
  GAME_RUNS: ${{ github.event_name != 'push' || github.ref_type == 'tag' }}
  EXTENDED: ${{ github.ref_type == 'tag' || inputs.extended == true }}

permissions:
  contents: read

concurrency:
  group: build-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Pick the versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The versions a pull request's changes touch, or a push's (a merge). A run by hand, or a push whose previous
          # commit can't be fetched, runs every version.
          mode=--all
          : > "$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt" && mode=--full
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git fetch -q --depth=1 origin "$BEFORE"; then
            git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/changed.txt" && mode=--full
          fi
          targets=$(python3 -I ci/changed-targets.py "$mode" . < "$RUNNER_TEMP/changed.txt")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Versions: $(python3 -c 'import json, sys; print(" ".join(t["minecraft"] for t in json.loads(sys.argv[1])) or "none")' "$targets")" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  core:
    name: Core and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Minecraft-independent modules
        run: ./gradlew -Pfabricated.coreOnly=true build --stacktrace

  minecraft:
    name: Forge ${{ matrix.target.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: plan
    if: ${{ needs.plan.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # ForgeGradle's Mavenizer runs on Java 25 for every target; 26.x builds with 25 and 1.21.11 with 21.
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Newest Forge builds for ${{ matrix.target.minecraft }} (informational)
        run: |
          newest=$(curl -fsS https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml \
            | grep -o "<version>${{ matrix.target.minecraft }}-[^<]*" | sed 's/<version>//' | tail -n 5 | tr '\n' ' ') || true
          echo "Pinned: ${{ matrix.target.loader }}. Newest published: ${newest:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Only Forge's projects are included, and of those only the requested one and what it depends on are configured.
      - name: Forge libraries on the compile classpath (informational)
        run: ./gradlew -Pfabricated.platforms=forge --configure-on-demand :mc:forge-${{ matrix.target.minecraft }}:forgeClasspathReport || true
      # With the test mod that fails on purpose (mc/shared/src/testmodbroken), which the server runs beside it (HOLD-2),
      # and the test mod for Fabric API's client modules and renderer (src/testmodfrapi: mc/forge/common26's on 26.x, the
      # version's own on 1.21.11), which the client run with Fabric API loads.
      - name: Build Fabricated and the test mods
        run: >-
          ./gradlew -Pfabricated.platforms=forge --configure-on-demand :mc:forge-${{ matrix.target.minecraft }}:fabricatedJar
          :mc:forge-${{ matrix.target.minecraft }}:testmodJar :mc:forge-${{ matrix.target.minecraft }}:testmodThrowsJar
          :mc:forge-${{ matrix.target.minecraft }}:testmodFrapiJar --stacktrace
      - name: Check the jar's layout for Forge
        run: ./gradlew -Pfabricated.platforms=forge --configure-on-demand :mc:forge-${{ matrix.target.minecraft }}:checkForgeJar --stacktrace
      # Forge 61 (1.21.11) runs on Java 21, Forge 64 to 66 (26.x) on Java 25 (each version's java_version).
      - name: Select Java ${{ matrix.target.java }} for the game
        run: echo "JAVA_HOME=$JAVA_HOME_${{ matrix.target.java }}_X64" >> "$GITHUB_ENV" && echo "$JAVA_HOME_${{ matrix.target.java }}_X64/bin" >> "$GITHUB_PATH"
      # The game on this branch (docs/PORTING.md §4.1): what Forge makes of the jar's layout and of the translated test
      # mod. The server must start and every check that applies pass.
      - name: Server with Fabricated (must pass)
        if: ${{ env.GAME_RUNS == 'true' }}
        run: |
          ci/forge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server"
      # The official Fabric API jar (downloaded here in CI, never by Fabricated) with every module passed through: what
      # loads on Forge and what pre-flight disables, for F4's choice of native modules. A gate like the first run.
      - name: Server with Fabricated and Fabric API (must pass)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/extra/fabric-api.jar" \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${{ matrix.target.fabric_api }}/fabric-api-${{ matrix.target.fabric_api }}.jar"
          ci/forge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-fapi" "$RUNNER_TEMP/extra"
      # Mods that share the game with Fabricated, as stand-ins built from Fabricated's own jar (ci/forge/standins.py): a
      # Fabric API module another Forge mod provides, straight and nested with its mixins, and two versions of a library
      # Fabric mods nest. Fabricated's part of each module must stand down (PROVIDER-1, as on NeoForge); a gate.
      - name: Server with stand-ins for coexisting mods (must pass)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/standins"
          python3 -I ci/forge/standins.py build/libs/fabricated-forge-[0-9]*+mc${{ matrix.target.minecraft }}.jar "$RUNNER_TEMP/standins"
          ci/forge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-standins" "$RUNNER_TEMP/standins"
      # Sinytra Connector (a stand-in with its mod id), a second Fabricated jar or a jar with its own copy of Fabric Loader
      # in the mods folder: the launch must stop with Fabricated's error naming them, as on NeoForge: two loaders of Fabric
      # mods can't share them (DUP-1), nor two copies of Fabric Loader's packages one game (PROVIDER-2).
      - name: Server refusing Sinytra Connector, a second Fabricated jar and a copy of Fabric Loader (must pass)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/refuse-connector/src/META-INF" "$RUNNER_TEMP/refuse-twice"
          printf 'modLoader = "lowcodefml"\nloaderVersion = "[1,)"\nlicense = "GPL-3.0-only"\n[[mods]]\nmodId = "connector"\nversion = "1.0.0"\n' \
              > "$RUNNER_TEMP/refuse-connector/src/META-INF/mods.toml"
          jar --create --file "$RUNNER_TEMP/refuse-connector/connector-standin.jar" -C "$RUNNER_TEMP/refuse-connector/src" META-INF/mods.toml
          cp build/libs/fabricated-forge-*+mc${{ matrix.target.minecraft }}.jar "$RUNNER_TEMP/refuse-twice/fabricated-forge-0.0.1+mc${{ matrix.target.minecraft }}.jar"
          SMOKE_TESTMODS=none SMOKE_TIMEOUT=300 SMOKE_EXPECT_REFUSAL="Sinytra Connector (connector-standin.jar)" \
              ci/forge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-refuse-connector" "$RUNNER_TEMP/refuse-connector"
          SMOKE_TESTMODS=none SMOKE_TIMEOUT=300 SMOKE_EXPECT_REFUSAL="2 Fabricated jars (fabricated-forge-0.0.1+mc${{ matrix.target.minecraft }}.jar" \
              ci/forge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-refuse-twice" "$RUNNER_TEMP/refuse-twice"
          # A jar with its own copy of Fabric Loader, as Forgified Fabric API for 1.20.1 nests one: refused at once, before
          # Forge builds a layer, where both copies would stop the launch with a module error naming neither (PROVIDER-2).
          mkdir -p "$RUNNER_TEMP/refuse-loader"
          python3 -I ci/forge/standins.py build/libs/fabricated-forge-[0-9]*+mc${{ matrix.target.minecraft }}.jar "$RUNNER_TEMP/refuse-loader" own-loader
          SMOKE_TESTMODS=none SMOKE_TIMEOUT=300 SMOKE_REFUSAL_AT_ONCE=1 \
              SMOKE_EXPECT_REFUSAL="standin-own-loader.jar (its standin-fabric-loader.jar) has its own copy of Fabric Loader" \
              ci/forge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-refuse-loader" "$RUNNER_TEMP/refuse-loader"
      # The client (docs/PORTING.md §7, F4): a Forge client with the test mod reaches a singleplayer world through
      # mc-runtime-test, and the Fabric client entrypoints run after the main ones. A gate like the server runs.
      - name: Install Mesa EGL for the client
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Client with Fabricated (must pass)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci/forge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client"
      # The client with the official Fabric API jar the server run downloaded: its client modules load on Forge, and the
      # client still reaches a world with them. On 26.x the test mod for Fabric API's client modules joins it, and its
      # checks are the smoke's (key mapping, HUD, screen events with their input events, client commands). A gate like
      # the other runs since the v0.6.0-beta pass.
      - name: Client with Fabricated and Fabric API (must pass)
        if: ${{ env.GAME_RUNS == 'true' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-client"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-client/"
          # The renderer test mod (task 4, R5) on every version, with the client API checks on 26.x.
          cp mc/forge/${{ matrix.target.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-client/"
          ci/forge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-fapi" "$RUNNER_TEMP/extra-client"
      # Popular Fabric mods from Modrinth (ci/mod-corpus.txt, downloaded here in CI and checked against Modrinth's
      # SHA-512) with Fabric API, as build.yml runs them on NeoForge: which load on Forge, which are disabled and why.
      # Informational, with "extended" or on a release tag; a mod whose initializer throws is disabled, not fatal.
      - name: Fetch the mod corpus
        id: corpus
        if: ${{ env.EXTENDED == 'true' && !cancelled() }}
        continue-on-error: true
        run: |
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/corpus" | tee "$RUNNER_TEMP/corpus.txt"
          # Left out: jars Forge refuses before Fabricated runs, which put it in its error state (CORPUS-34): JEI's Fabric
          # build, whose module-info names packages it lacks (JEI has a Forge build).
          rm -f "$RUNNER_TEMP"/corpus/jei-*-fabric-*.jar
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/corpus/"
      - name: Server with the mod corpus (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        env:
          SMOKE_ON_ENTRYPOINT_FAILURE: disable
        run: |
          ci/forge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-corpus" "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/server-corpus.out" 2>&1 || true
          ci/corpus-summary.sh "$RUNNER_TEMP/server-corpus" "server with the corpus"
      - name: Client with the mod corpus (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_ON_ENTRYPOINT_FAILURE: disable
        run: |
          SMOKE_TIMEOUT=600 ci/forge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-corpus" "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/client-corpus.out" 2>&1 || true
          ci/corpus-summary.sh "$RUNNER_TEMP/client-corpus/run" "client with the corpus"
      # What stopped the corpus runs, past the summary's crash descriptions (CORPUS-53, CORPUS-55): the crash reports'
      # exception chains to their innermost cause, the logs' Mixin errors, and the console's last lines.
      - name: What stopped the mod corpus runs (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        run: |
          ci/forge/corpus-causes.sh "$RUNNER_TEMP/server-corpus" "$RUNNER_TEMP/server-corpus/server.out" "server with the corpus"
          ci/forge/corpus-causes.sh "$RUNNER_TEMP/client-corpus/run" "$RUNNER_TEMP/client-corpus/client.out" "client with the corpus"
      - name: Upload mod corpus logs and reports
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: corpus-forge-${{ matrix.target.minecraft }}
          path: |
            ${{ runner.temp }}/corpus.txt
            ${{ runner.temp }}/server-corpus.out
            ${{ runner.temp }}/server-corpus/server.out
            ${{ runner.temp }}/server-corpus/logs
            ${{ runner.temp }}/server-corpus/crash-reports
            ${{ runner.temp }}/client-corpus.out
            ${{ runner.temp }}/client-corpus/client.out
            ${{ runner.temp }}/client-corpus/run/logs
            ${{ runner.temp }}/client-corpus/run/crash-reports
          if-no-files-found: ignore
      - name: Upload Fabricated jar
        uses: actions/upload-artifact@v4
        with:
          name: fabricated-forge-${{ matrix.target.minecraft }}
          path: build/libs/fabricated-forge-*+mc${{ matrix.target.minecraft }}.jar
          if-no-files-found: error
