name: Build forge

# The forge branch's own build: pull requests to the branch only (owner decision D6); main's build.yml builds
# NeoForge's targets for main. Compile only until the branch runs the game (docs/PORTING.md §7, F2). A version's
# project is mc/forge-<version>, next to main's NeoForge project of that version.
on:
  pull_request:
    branches: [forge]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Minecraft-independent modules
        run: ./gradlew -Pfabricated.coreOnly=true build --stacktrace

  minecraft:
    name: Forge ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: core
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.21.11", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # ForgeGradle's Mavenizer runs on Java 25 for every target; 26.x builds with 25 and 1.21.11 with 21.
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Newest Forge builds for ${{ matrix.minecraft }} (informational)
        run: |
          pinned=$(sed -n 's/^forge_version=//p' "mc/forge-${{ matrix.minecraft }}/gradle.properties")
          newest=$(curl -fsS https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml \
            | grep -o "<version>${{ matrix.minecraft }}-[^<]*" | sed 's/<version>//' | tail -n 5 | tr '\n' ' ') || true
          echo "Pinned: $pinned. Newest published: ${newest:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Only the requested project and what it depends on are configured, not main's NeoForge projects.
      - name: Forge libraries on the compile classpath (informational)
        run: ./gradlew --configure-on-demand :mc:forge-${{ matrix.minecraft }}:forgeClasspathReport || true
      - name: Build Fabricated and the test mod
        run: ./gradlew --configure-on-demand :mc:forge-${{ matrix.minecraft }}:fabricatedJar :mc:forge-${{ matrix.minecraft }}:testmodJar --stacktrace
      - name: Check the jar's layout for Forge
        run: ./gradlew --configure-on-demand :mc:forge-${{ matrix.minecraft }}:checkForgeJar --stacktrace
      # The game on this branch (docs/PORTING.md §4.1): what Forge makes of the jar's layout and of the translated test
      # mod. Reported, not gated, until F3's discovery is settled.
      - name: Server with Fabricated (informational)
        continue-on-error: true
        run: |
          # Forge 61 (1.21.11) runs on Java 21, Forge 64 to 66 (26.x) on Java 25.
          [ "${{ matrix.minecraft }}" = "1.21.11" ] || export PATH="$JAVA_HOME_25_X64/bin:$PATH"
          forge=$(sed -n 's/^forge_version=//p' "mc/forge-${{ matrix.minecraft }}/gradle.properties")
          ci/forge/smoke-server.sh "${{ matrix.minecraft }}" "$forge" "$RUNNER_TEMP/server"
      - name: Upload Fabricated jar
        uses: actions/upload-artifact@v4
        with:
          name: fabricated-forge-${{ matrix.minecraft }}
          path: build/libs/fabricated-forge-*+mc${{ matrix.minecraft }}.jar
          if-no-files-found: error
