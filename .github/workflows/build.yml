          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-coexist" "$RUNNER_TEMP/extra-coexist" || true
          report="$RUNNER_TEMP/client-coexist/run/logs/fabric-bridge-report.txt"
          sed -n '/== Fabric API modules provided by other mods ==/,/^$/p;/== Fabric Loader API ==/,/^$/p;/== Fabric API providers ==/,/^$/p' "$report" || true
          if grep -q "ResolutionException" "$RUNNER_TEMP/client-coexist/run/logs/latest.log" "$RUNNER_TEMP/client-coexist/client.out" 2>/dev/null; then
            echo "::error::Forgified Fabric API and Sodium 1.21.1: a module layer refused a package two mods share"
          fi
      - name: Upload Fabric API client run logs and report
        if: ${{ matrix.part == 'client' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-fabric-api-${{ matrix.target.minecraft }}
          path: |
            ${{ runner.temp }}/client-fapi/run/logs
            ${{ runner.temp }}/client-fapi/run/crash-reports
            ${{ runner.temp }}/client-fapi/client.out
            ${{ runner.temp }}/client-fapi/thread-dump.txt
          if-no-files-found: ignore
      # Sodium and Iris for NeoForge (downloaded here from Modrinth, never redistributed) with Fabric API and the test
      # mod for Fabric's renderer API: Sodium meshes the world through its own Fabric renderer, which must draw Fabric
      # models, and Fabric API's default renderer must stand down for it.
      - name: Client smoke test with Sodium and Iris for NeoForge (26.x)
        if: ${{ matrix.part == 'mods' && !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.target.minecraft, '26.') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-sodium"
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/extra-sodium" neoforge sodium iris
          cp "$RUNNER_TEMP/extra/fabric-api.jar" mc/neoforge/${{ matrix.target.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-sodium/"
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-sodium" "$RUNNER_TEMP/extra-sodium" || true
          grep -A200 "== " "$RUNNER_TEMP/client-sodium/run/logs/fabric-bridge-report.txt" || true
      - name: Fabric models under Sodium (26.x)
        if: ${{ matrix.part == 'mods' && !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.target.minecraft, '26.') }}
        env:
          MC: ${{ matrix.target.minecraft }}
        run: |
          if ! ls "$RUNNER_TEMP"/extra-sodium/sodium*.jar >/dev/null 2>&1; then
            echo "::warning::Modrinth has no Sodium for NeoForge $MC build: nothing to check"
            exit 0
          fi
          log="$RUNNER_TEMP/client-sodium/run/logs/latest.log"
          failed=0
          check() {
            if grep -h "$1" "$log"; then
              echo "PASS: $2"
            else
              echo "::error::FAIL: $2 (no \"$1\" line)"
              failed=1
            fi
          }
          check "Different rendering plugin detected; not applying Indigo" "Fabric API's default renderer stood down for Sodium's"
          check "FABRICATED-TEST frapi terrain OK .*LevelSlice" "Sodium meshed a Fabric block model through its Fabric renderer"
          check "FABRICATED-TEST frapi level-aware default OK" "a NeoForge model inside a Fabric model got Sodium's chunk section"
          check "FABRICATED-TEST frapi moving block OK" "a falling Fabric block model was drawn with Sodium's renderer"
          check "FABRICATED-TEST frapi breaking OK" "a Fabric block model got the breaking overlay with Sodium's renderer"
          if [ "$failed" = 1 ]; then
            grep -n -m 60 -E "frapi|Indigo|sodium|Sodium|iris|Iris|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      # R6: Continuity, a real consumer of Fabric's renderer API (connected textures), its Fabric build from Modrinth where
      # it has one for the version, with Fabric API and the renderer API test mod. The test mod puts a glass wall above its
      # blocks and wraps glass's model after Continuity's, and logs whether the quads a chunk section gets for it are off
      # glass's own sprite, as the connected textures of Continuity's default resource pack are. Continuity registers that
      # pack as one the player switches on (NORMAL), so the run selects it in the options, as a player would.
      # Informational until it holds on two extended runs in a row (CI-1's rule).
      - name: Client with Continuity (informational)
        if: ${{ matrix.part == 'mods' && !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MC: ${{ matrix.target.minecraft }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-continuity"
          python3 ci/fetch-corpus.py "$MC" "$RUNNER_TEMP/extra-continuity" fabric continuity | tee "$RUNNER_TEMP/summary-continuity.txt" || true
          if ! grep -qE "^continuity: [^n]" "$RUNNER_TEMP/summary-continuity.txt"; then
            echo "Modrinth has no Continuity build for $MC: nothing to run"
            exit 0
          fi
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "mc/neoforge/$MC/build/testmods/fabricated-testmod-frapi.jar" "$RUNNER_TEMP/extra-continuity/"
          SMOKE_RESOURCE_PACKS='"continuity:default"' SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "$MC" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-continuity" "$RUNNER_TEMP/extra-continuity" || true
          log="$RUNNER_TEMP/client-continuity/run/logs/latest.log"
          grep -h "FABRICATED-TEST continuity" "$log" || true
          # Which resource packs the game loaded: Continuity's default one must be among them.
          grep -h -m 2 "Reloading ResourceManager" "$log" || true
          if grep -q "FABRICATED-TEST continuity connected textures OK" "$log"; then
            echo "PASS: Continuity's connected textures reached a chunk section through Fabric's renderer"
          else
            echo "::warning::Continuity on $MC: no connected textures seen in a chunk section (informational)"
            grep -n -m 60 -E "[Cc]ontinuity|frapi|/(ERROR|FATAL)\]" "$log" || true
            awk '/^== /{show = /^== (Summary|Disabled|Rendering)/} show' "$RUNNER_TEMP/client-continuity/run/logs/fabric-bridge-report.txt" | head -80 || true
            exit 1
          fi
      # R7: Forgified Fabric API's renderer API beside Fabricated's seams, where it has a build for the version, with the
      # renderer API test mod (and Fabric API's official jar for the modules it doesn't provide). The renderer API is then
      # Forgified Fabric API's and Fabricated's renderer seams stand down, so no block may come through them (seam=other
      # on each block the test mod logs), or a Fabric model would be sent to a renderer twice; the test mod's broken models
      # don't throw there (another mod's renderer isn't Fabricated's to guard). Informational, as the other coexisting
      # clients.
      - name: Client with Forgified Fabric API's renderer (informational, 1.21.1 and 26.x)
        if: ${{ matrix.part == 'mods' && env.EXTENDED == 'true' && !cancelled() && steps.build.outcome == 'success' && matrix.target.minecraft != '1.21.11' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MC: ${{ matrix.target.minecraft }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-ffapi"
          python3 ci/fetch-corpus.py "$MC" "$RUNNER_TEMP/extra-ffapi" neoforge forgified-fabric-api | tee "$RUNNER_TEMP/summary-ffapi.txt" || true
          if ! grep -qE "^forgified-fabric-api: [^n]" "$RUNNER_TEMP/summary-ffapi.txt"; then
            echo "Modrinth has no Forgified Fabric API build for $MC: nothing to run"
            exit 0
          fi
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "mc/neoforge/$MC/build/testmods/fabricated-testmod-frapi.jar" "$RUNNER_TEMP/extra-ffapi/"
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "$MC" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-ffapi" "$RUNNER_TEMP/extra-ffapi" || true
          log="$RUNNER_TEMP/client-ffapi/run/logs/latest.log"
          provided=$(sed -n '/== Fabric API modules provided by other mods ==/,/^$/p' "$RUNNER_TEMP/client-ffapi/run/logs/fabric-bridge-report.txt" || true)
          echo "$provided"
          grep -h "FABRICATED-TEST frapi" "$log" || true
          if ! echo "$provided" | grep -q "fabric-renderer-api-v1"; then
            echo "::warning::Forgified Fabric API on $MC: the renderer API isn't among the modules it provides here, nothing to check"
            exit 0
          fi
          failed=0
          if grep -q "FABRICATED-TEST frapi .*seam=Fabricated" "$log"; then
            echo "::warning::Forgified Fabric API provides the renderer API on $MC, yet a block came through Fabricated's seam"
            failed=1
          fi
          for check in "frapi terrain OK" "frapi nested terrain OK" "frapi moving block OK" "frapi breaking OK"; do
            if grep -q "FABRICATED-TEST $check" "$log"; then echo "PASS: $check"; else echo "::warning::Forgified Fabric API on $MC: no \"$check\" line"; failed=1; fi
          done
          if [ "$failed" = 1 ]; then grep -n -m 60 -E "frapi|[Ff]orgified|/(ERROR|FATAL)\]" "$log" || true; fi
          exit $failed
      # The same mods with a shader pack (ci/neoforge/smoke-client.sh writes a minimal one): Iris's pipeline, with its extended
      # vertex format, under the Fabric models Sodium's Fabric renderer meshes. Informational until it has passed.
      - name: Client with Sodium, Iris and a shader pack (informational, 26.x)
        if: ${{ matrix.part == 'mods' && env.EXTENDED == 'true' && !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.target.minecraft, '26.') }}
        continue-on-error: true
        run: |
          if ! ls "$RUNNER_TEMP"/extra-sodium/iris*.jar >/dev/null 2>&1; then
            echo "Modrinth has no Iris for NeoForge ${{ matrix.target.minecraft }} build: nothing to run"
            exit 0
          fi
          SMOKE_SHADERS=1 SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-shaders" "$RUNNER_TEMP/extra-sodium" || true
          grep -n -m 80 -E "FABRICATED-TEST frapi|[Ss]haderpack|shader pack|Iris|/(ERROR|FATAL)\]" "$RUNNER_TEMP/client-shaders/run/logs/latest.log" || true
      # The Fabric builds of Sodium and Iris, which the compatibility plan loads on NeoForge (task 5, decision 3), with
      # Fabric API and the renderer API test mod, on every version Modrinth has them for. A gate: every smoke check
      # passes, both load (Iris's Fabric build but on 1.21.1, where pre-flight refuses its particle hook, which NeoForge's
      # code doesn't make: docs/COMPATIBILITY.md) and Sodium's renderer draws Fabric's block models.
      - name: Client with the Fabric builds of Sodium and Iris
        if: ${{ matrix.part == 'mods' && env.EXTENDED == 'true' && !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-sodium-fabric"
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/extra-sodium-fabric" fabric sodium iris || true
          if ! ls "$RUNNER_TEMP"/extra-sodium-fabric/sodium*.jar >/dev/null 2>&1; then
            echo "Modrinth has no Fabric build of Sodium for ${{ matrix.target.minecraft }}: nothing to run"
            exit 0
          fi
          cp "$RUNNER_TEMP/extra/fabric-api.jar" mc/neoforge/${{ matrix.target.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-sodium-fabric/"
          status=0
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-sodium-fabric" "$RUNNER_TEMP/extra-sodium-fabric" || status=$?
          grep -A300 "== " "$RUNNER_TEMP/client-sodium-fabric/run/logs/fabric-bridge-report.txt" || true
          grep -n -m 80 -E "FABRICATED-TEST frapi|Sodium|Iris|/(ERROR|FATAL)\]" "$RUNNER_TEMP/client-sodium-fabric/run/logs/latest.log" || true
          mods="sodium iris"
          [ "${{ matrix.target.minecraft }}" = "1.21.1" ] && mods="sodium"
          failed=0
          ci/neoforge/gate-mods.sh "$RUNNER_TEMP/client-sodium-fabric" "$status" "the Fabric builds of Sodium and Iris" $mods || failed=1
          if grep -q "Fabric block models are drawn by the renderer net.caffeinemc.mods.sodium" "$RUNNER_TEMP/client-sodium-fabric/run/logs/latest.log"; then
            echo "PASS: Sodium's renderer draws Fabric's block models"
          else
            echo "::error::FAIL: Sodium's renderer doesn't draw Fabric's block models"
            failed=1
          fi
          exit "$failed"
      # The same Fabric builds with CI's shader pack (ci/neoforge/smoke-client.sh writes a minimal one): Iris's pipeline,
      # with its extended vertex format, over Sodium's Fabric renderer and the Fabric models it meshes. Not on 1.21.1,
      # where Iris's Fabric build doesn't load. Informational until it holds on two extended runs in a row (CI-1).
      - name: Client with the Fabric builds of Sodium and Iris and a shader pack (informational)
        if: ${{ matrix.part == 'mods' && env.EXTENDED == 'true' && !cancelled() && steps.build.outcome == 'success' && matrix.target.minecraft != '1.21.1' }}
        continue-on-error: true
        run: |
          if ! ls "$RUNNER_TEMP"/extra-sodium-fabric/iris*.jar >/dev/null 2>&1; then
            echo "Modrinth has no Fabric build of Iris for ${{ matrix.target.minecraft }}: nothing to run"
            exit 0
          fi
          status=0
          SMOKE_SHADERS=1 SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-shaders-fabric" "$RUNNER_TEMP/extra-sodium-fabric" || status=$?
          echo "smoke-client.sh exit status: $status"
          grep -n -m 80 -E "FABRICATED-TEST frapi|[Ss]haderpack|shader pack|Iris|/(ERROR|FATAL)\]" "$RUNNER_TEMP/client-shaders-fabric/run/logs/latest.log" || true
      # Fabric addons of Sodium (Sodium Extra, Reese's Sodium Options) next to Sodium for NeoForge, with Fabric API: their
      # mixins into Sodium are checked against Sodium for NeoForge's classes (R3), and they use Sodium's API from its
      # NeoForge build. The Fabric build of Sodium they depend on is skipped for the NeoForge one. Informational.
      - name: Client with Sodium for NeoForge and Fabric Sodium addons (informational, 26.x)
        if: ${{ matrix.part == 'mods' && env.EXTENDED == 'true' && !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.target.minecraft, '26.') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls "$RUNNER_TEMP"/extra-sodium/sodium*.jar >/dev/null 2>&1; then
            echo "Modrinth has no Sodium for NeoForge ${{ matrix.target.minecraft }} build: nothing to run"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/extra-sodium-addons"
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/extra-sodium-addons" fabric sodium-extra reeses-sodium-options || true
          cp "$RUNNER_TEMP"/extra-sodium/sodium*.jar "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-sodium-addons/"
          ls -1 "$RUNNER_TEMP/extra-sodium-addons"
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-sodium-addons" "$RUNNER_TEMP/extra-sodium-addons" || true
      # The Fabric-only Polyfrost stack (OneConfig, PolyPlus): no NeoForge build exists, so Fabricated is its only way
      # to NeoForge. Modrinth slugs and builds per version are UNVERIFIED; a missing one is reported and skipped.
      - name: Client with OneConfig and PolyPlus (informational)
        if: ${{ matrix.part == 'mods' && env.EXTENDED == 'true' && !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-polyfrost"
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/extra-polyfrost" fabric oneconfig polyplus | tee "$RUNNER_TEMP/summary-polyfrost.txt"
          if ! grep -qE "^(oneconfig|polyplus): [^n]" "$RUNNER_TEMP/summary-polyfrost.txt"; then exit 0; fi
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-polyfrost/"
          # Polydium asks once, in the first world, whether to switch to Vulkan, and the world test waits for no screen to be
          # open: its own marker says it has asked.
          mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/polydium" && touch "${XDG_CONFIG_HOME:-$HOME/.config}/polydium/vulkan-prompt"
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-polyfrost" "$RUNNER_TEMP/extra-polyfrost" || true
          # The counts and the disabled mods, not the long list of loaded ones.
          awk '/^== /{show = /^== (Summary|Disabled)/} show' "$RUNNER_TEMP/client-polyfrost/run/logs/fabric-bridge-report.txt" | head -80 | tee -a "$RUNNER_TEMP/summary-polyfrost.txt" || true
          # Which modules serve the native libraries of jars without classes (Skiko's).
          grep -F "has no classes" "$RUNNER_TEMP/client-polyfrost/run/logs/fabric-bridge-report.txt" | head -10 | tee -a "$RUNNER_TEMP/summary-polyfrost.txt" || true
      # The NeoForge builds of recipe viewers, tooltip mods and Simple Voice Chat (pinned per version), with the test
      # mod's plugins declared the Fabric way (as entrypoints, and WTHIT's plugin file): each must construct and call
      # its plugin.
      - name: Plugins for the NeoForge builds of other mods
        if: ${{ matrix.part == 'mods' && !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-viewers"
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/extra-viewers" neoforge ${{ matrix.target.plugin_hosts }} | tee viewers.txt
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-viewers" "$RUNNER_TEMP/extra-viewers" || true
          grep -A12 "== Plugins for other mods" "$RUNNER_TEMP/client-viewers/run/logs/fabric-bridge-report.txt" || true
          log="$RUNNER_TEMP/client-viewers/run/logs/latest.log"
          for host in ${{ matrix.target.plugin_hosts }}; do
            host="${host%@*}"
            for what in constructed called; do
              count=$(grep -c "FABRICATED-TEST $host plugin $what OK" "$log" 2>/dev/null || true)
              echo "$host plugin $what: ${count:-0} time(s)"
            done
          done | tee "$RUNNER_TEMP/summary-viewers.txt"
          grep -n -m 40 -E "/(ERROR|FATAL)\]" "$log" || true
          if grep -q ": 0 time(s)" "$RUNNER_TEMP/summary-viewers.txt"; then echo "FAIL: a mod did not construct or call the test mod's plugin"; exit 1; fi
      # Popular Fabric mods from Modrinth (ci/mod-corpus.txt, downloaded here in CI and checked against Modrinth's
      # SHA-512), loaded together with Fabric API: shows which load, which are disabled and why. Informational.
      - name: Fetch the mod corpus
        id: corpus
        if: ${{ matrix.part == 'corpus' && !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/corpus" | tee "$RUNNER_TEMP/corpus.txt"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/corpus/"
      - name: Server with the mod corpus (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        run: ci/neoforge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-corpus" "$RUNNER_TEMP/corpus" || true
      - name: Client with the mod corpus (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SMOKE_TIMEOUT=600 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-corpus" "$RUNNER_TEMP/corpus" || true
          grep -A400 "== " "$RUNNER_TEMP/client-corpus/run/logs/fabric-bridge-report.txt" || true
      # malilib (MiniHUD's and Tweakeroo's library) adds its picture-in-picture renderers through the GUI renderer's map
      # NeoForge replaced, which Fabricated restores (PIP-1); the compatibility plan loads it on NeoForge (task 5). A
      # gate: every smoke check passes and the four load.
      - name: Client with malilib, MiniHUD, Tweakeroo and Litematica
        if: ${{ matrix.part == 'mods' && env.EXTENDED == 'true' && !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-malilib"
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/extra-malilib" fabric malilib fabric minihud fabric tweakeroo fabric litematica | tee "$RUNNER_TEMP/summary-malilib.txt"
          if ! grep -qE "^malilib: [^n]" "$RUNNER_TEMP/summary-malilib.txt"; then
            echo "Modrinth has no Fabric build of malilib for ${{ matrix.target.minecraft }}: nothing to run"
            exit 0
          fi
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-malilib/"
          status=0
          SMOKE_TIMEOUT=420 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-malilib" "$RUNNER_TEMP/extra-malilib" || status=$?
          ci/neoforge/gate-mods.sh "$RUNNER_TEMP/client-malilib" "$status" "malilib and the mods needing it" malilib minihud tweakeroo litematica
      # Essential's Fabric build (its loader, which downloads Essential as the game starts; Fabricated itself never
      # downloads anything), which the compatibility plan loads on NeoForge (task 5), on its own, launched twice: the
      # first launch's loader downloads Essential, which Fabricated loads from the second (DOWNLOAD-1). A gate: both
      # launches pass every smoke check, and Essential loads in the second. Where its loader downloaded nothing (its
      # server, not Fabricated), the second launch is skipped with a warning.
      - name: Client with Essential's Fabric build
        if: ${{ matrix.part == 'mods' && env.EXTENDED == 'true' && !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-essential"
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/extra-essential" fabric essential | tee "$RUNNER_TEMP/summary-essential.txt" || true
          if ! grep -qE "^essential: [^n]" "$RUNNER_TEMP/summary-essential.txt"; then
            echo "Modrinth has no Fabric build of Essential for ${{ matrix.target.minecraft }}: nothing to run"
            exit 0
          fi
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-essential/"
          first_status=0
          SMOKE_TIMEOUT=420 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-essential-first" "$RUNNER_TEMP/extra-essential" || first_status=$?
          first="$RUNNER_TEMP/client-essential-first/run"
          echo "-- first launch: what Essential's loader did, and Fabricated's notice"
          grep -n -m 30 -i -E "essential|/(ERROR|FATAL)\]" "$first/logs/latest.log" | grep -v -E "^\S+\s+at " | cut -c1-400 || true
          grep -n -m 1 -A 24 "MixinExtras service has already" "$first/logs/latest.log" | cut -c1-300 || true
          # What it downloaded, which the second launch starts with, as a player's second launch would.
          mkdir -p "$RUNNER_TEMP/seed-essential"
          [ -d "$first/essential" ] && cp -r "$first/essential" "$RUNNER_TEMP/seed-essential/"
          for jar in "$RUNNER_TEMP/seed-essential/essential/"Essential*.jar; do
            [ -f "$jar" ] || continue
            echo "-- $(basename "$jar"): fabric.mod.json, nested jars, mixin configs"
            unzip -p "$jar" fabric.mod.json | head -c 6000 || true
            echo
            unzip -l "$jar" | grep -E "META-INF/jars/|mixins[^/]*\.json$|\.accesswidener$" | head -40 || true
          done
          failed=0
          ci/neoforge/gate-mods.sh "$RUNNER_TEMP/client-essential-first" "$first_status" "Essential's first launch" essential-container essential-loader || failed=1
          if ! ls "$RUNNER_TEMP/seed-essential/essential/"Essential*.jar >/dev/null 2>&1; then
            echo "::warning::Essential's loader downloaded nothing in the first launch (its server): no second launch to gate"
            exit "$failed"
          fi
          status=0
          SMOKE_SEED="$RUNNER_TEMP/seed-essential" SMOKE_TIMEOUT=420 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-essential" "$RUNNER_TEMP/extra-essential" || status=$?
          echo "-- second launch"
          log="$RUNNER_TEMP/client-essential/run/logs/latest.log"
          awk '/^== /{show = /^== (Summary|Disabled|Unsupported|Linkage)/} show' "$RUNNER_TEMP/client-essential/run/logs/fabric-bridge-report.txt" | head -60 | cut -c1-400 || true
          grep -n -m 60 -i -E "essential|/(ERROR|FATAL)\]" "$log" | cut -c1-400 || true
          # What its loader downloaded, and where (its own folder in the game directory).
          find "$RUNNER_TEMP/client-essential/run" -maxdepth 4 -ipath "*essential*" -type f | head -30 || true
          ci/neoforge/gate-mods.sh "$RUNNER_TEMP/client-essential" "$status" "Essential's second launch" essential-container essential-loader essential || failed=1
          exit "$failed"
      # Flashback, which the compatibility plan loads on NeoForge (task 5: its refusal rested on a registry freeze REG-8
      # holds), on its own. A gate: every smoke check passes and Flashback loads.
      - name: Client with Flashback
        if: ${{ matrix.part == 'mods' && env.EXTENDED == 'true' && !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-flashback"
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/extra-flashback" fabric flashback | tee "$RUNNER_TEMP/summary-flashback.txt" || true
          if ! grep -qE "^flashback: [^n]" "$RUNNER_TEMP/summary-flashback.txt"; then
            echo "Modrinth has no Fabric build of Flashback for ${{ matrix.target.minecraft }}: nothing to run"
            exit 0
          fi
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-flashback/"
          status=0
          SMOKE_TIMEOUT=420 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-flashback" "$RUNNER_TEMP/extra-flashback" || status=$?
          awk '/^== /{show = /^== (Summary|Disabled|Unsupported|Mixins left out)/} show' "$RUNNER_TEMP/client-flashback/run/logs/fabric-bridge-report.txt" | head -40 | cut -c1-400 || true
          grep -n -m 40 -i -E "flashback|/(ERROR|FATAL)\]" "$RUNNER_TEMP/client-flashback/run/logs/latest.log" | cut -c1-400 || true
          ci/neoforge/gate-mods.sh "$RUNNER_TEMP/client-flashback" "$status" "Flashback" flashback
      - name: Upload other mods' client logs and reports
        if: ${{ matrix.part == 'mods' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: client-mods-${{ matrix.target.minecraft }}
          path: |
            ${{ runner.temp }}/client-sodium/run/logs
            ${{ runner.temp }}/client-sodium/run/crash-reports
            ${{ runner.temp }}/client-sodium/client.out
            ${{ runner.temp }}/client-sodium/thread-dump.txt
            ${{ runner.temp }}/client-coexist/run/logs
            ${{ runner.temp }}/client-coexist/run/crash-reports
            ${{ runner.temp }}/client-coexist/client.out
            ${{ runner.temp }}/client-shaders/run/logs
            ${{ runner.temp }}/client-shaders/run/crash-reports
            ${{ runner.temp }}/client-shaders/client.out
            ${{ runner.temp }}/client-sodium-fabric/run/logs
            ${{ runner.temp }}/client-sodium-fabric/run/crash-reports
            ${{ runner.temp }}/client-sodium-fabric/client.out
            ${{ runner.temp }}/client-shaders-fabric/run/logs
            ${{ runner.temp }}/client-shaders-fabric/run/crash-reports
            ${{ runner.temp }}/client-shaders-fabric/client.out
            ${{ runner.temp }}/client-sodium-addons/run/logs
            ${{ runner.temp }}/client-sodium-addons/run/crash-reports
            ${{ runner.temp }}/client-sodium-addons/client.out
            ${{ runner.temp }}/client-polyfrost/run/logs
            ${{ runner.temp }}/client-polyfrost/run/crash-reports
            ${{ runner.temp }}/client-polyfrost/client.out
            ${{ runner.temp }}/client-viewers/run/logs
            ${{ runner.temp }}/client-viewers/run/crash-reports
            ${{ runner.temp }}/client-viewers/client.out
            ${{ runner.temp }}/client-malilib/run/logs
            ${{ runner.temp }}/client-malilib/run/crash-reports
            ${{ runner.temp }}/client-malilib/client.out
            ${{ runner.temp }}/client-essential/run/logs
            ${{ runner.temp }}/client-essential/run/crash-reports
            ${{ runner.temp }}/client-essential/client.out
            ${{ runner.temp }}/client-flashback/run/logs
            ${{ runner.temp }}/client-flashback/run/crash-reports
            ${{ runner.temp }}/client-flashback/client.out
          if-no-files-found: ignore
      # Fabric mods with deep hooks (ci/mod-corpus-advanced.txt), on their own: one that stops the game can't hide how
      # the main corpus did.
      - name: Fetch the advanced mod corpus
        id: advanced
        if: ${{ matrix.part == 'corpus' && !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/advanced" fabric $(sed -e '/^#/d' -e '/^$/d' ci/mod-corpus-advanced.txt) \
            | tee "$RUNNER_TEMP/summary-advanced.txt"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/advanced/"
          echo "::group::NeoForge biome and structure modifiers in the Fabric jars"
          python3 -I ci/neoforge-data.py "$RUNNER_TEMP"/advanced/*.jar | tee "$RUNNER_TEMP/summary-neoforge-data.txt" || true
          echo "::endgroup::"
      - name: Server with the advanced mod corpus (informational)
        if: ${{ !cancelled() && steps.advanced.outcome == 'success' }}
        continue-on-error: true
        run: ci/neoforge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-advanced" "$RUNNER_TEMP/advanced" || true
      - name: Client with the advanced mod corpus (informational)
        if: ${{ !cancelled() && steps.advanced.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: SMOKE_TIMEOUT=600 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-advanced" "$RUNNER_TEMP/advanced" || true
      - name: Upload mod corpus logs and reports
        if: ${{ matrix.part == 'corpus' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.target.minecraft }}
          path: |
            ${{ runner.temp }}/server-corpus/logs
            ${{ runner.temp }}/server-corpus/server.out
            ${{ runner.temp }}/client-corpus/run/logs
            ${{ runner.temp }}/client-corpus/run/crash-reports
            ${{ runner.temp }}/client-corpus/client.out
            ${{ runner.temp }}/server-advanced/logs
            ${{ runner.temp }}/server-advanced/server.out
            ${{ runner.temp }}/client-advanced/run/logs
            ${{ runner.temp }}/client-advanced/run/crash-reports
            ${{ runner.temp }}/client-advanced/client.out
          if-no-files-found: ignore
      # The job log keeps only its end, so the informational runs' results are repeated here, last.
      - name: Summary of the informational runs
        if: ${{ !cancelled() }}
        run: |
          # A log's errors as the game ran, with the stacks of the most frequent: a mod that loads may still fail when its code runs.
          digest() { python3 ci/log-digest.py "$1" || true; }
          [ -f "$RUNNER_TEMP/summary-energy.txt" ] && { echo "== summary-energy"; cut -c1-300 "$RUNNER_TEMP/summary-energy.txt"; }
          [ -f "$RUNNER_TEMP/summary-coexist.txt" ] && { echo "== summary-coexist (Forgified Fabric API, Kotlin)"; cut -c1-300 "$RUNNER_TEMP/summary-coexist.txt"; }
          # The gated client's failed checks, when it has any (the job log may no longer hold them).
          grep -q "^FAIL" "$RUNNER_TEMP/summary-client.txt" 2>/dev/null && { echo "== summary-client"; grep "^FAIL" "$RUNNER_TEMP/summary-client.txt" | head -40 | cut -c1-300; }
          for f in summary-newest summary-viewers; do
            [ -f "$RUNNER_TEMP/$f.txt" ] && { echo "== $f"; grep -E "^(Newest|PASS|FAIL|WARN)|plugin|not in this run" "$RUNNER_TEMP/$f.txt" | head -60; }
          done
          [ -f "$RUNNER_TEMP/summary-polyfrost.txt" ] && { echo "== summary-polyfrost"; head -60 "$RUNNER_TEMP/summary-polyfrost.txt" | cut -c1-300; }
          [ -f viewers.txt ] && { echo "== viewers fetched"; cat viewers.txt; }
          [ -f "$RUNNER_TEMP/summary-advanced.txt" ] && { echo "== advanced corpus fetched"; cut -c1-200 "$RUNNER_TEMP/summary-advanced.txt"; }
          [ -f "$RUNNER_TEMP/summary-neoforge-data.txt" ] && { echo "== NeoForge biome and structure modifiers in the advanced corpus's Fabric jars"; head -40 "$RUNNER_TEMP/summary-neoforge-data.txt"; }
          for run in client client-fapi client-coexist client-sodium client-shaders client-sodium-fabric client-shaders-fabric client-sodium-addons client-viewers client-polyfrost client-corpus client-malilib client-essential client-flashback client-advanced; do
            log="$RUNNER_TEMP/$run/run/logs/latest.log"
            if [ ! -f "$log" ]; then
              # The game never started (the launcher stopped first): what the launcher said last.
              [ -f "$RUNNER_TEMP/$run/client.out" ] && { echo "== $run (no game log; the launcher's last lines)"; tail -n 30 "$RUNNER_TEMP/$run/client.out" | cut -c1-300; }
              continue
            fi
            echo "== $run"
            # The smoke checks that failed (the step's own lines may be gone from the job's log by now).
            [ -f "$RUNNER_TEMP/$run/checks-failed.txt" ] && cut -c1-400 "$RUNNER_TEMP/$run/checks-failed.txt" | head -20
            grep -h -m 20 -E "FABRICATED-TEST frapi|Caused by|Exception in|crash report|Fabric API's own renderer|drawn by the renderer" "$log" || true
            # The test mod's own failed checks and its informational lines (far up the log by now).
            grep -h -m 12 -E "FABRICATED-TEST (.*FAILED|library modules|networking join event)" "$log" | cut -c1-400 || true
            # Whether Iris loaded the shader pack, and drew with it (Iris's own lines).
            if [ "$run" = client-shaders ] || [ "$run" = client-shaders-fabric ]; then
              grep -h -m 8 -i -E "shaderpack|shaders are disabled|shader rendering pipeline" "$log" | cut -c1-300 || true
            fi
            # NeoForge's loading warnings (the runs with extra mods don't show them on a screen).
            grep -h -m 1 -A 6 "Mods loaded with .* warning" "$log" | cut -c1-300 || true
            # Why pre-flight disabled mods, in full from Fabricated's report (the warnings above are cut short).
            report="$RUNNER_TEMP/$run/run/logs/fabric-bridge-report.txt"
            [ -f "$report" ] && awk '/^== Mixin pre-flight failures ==/ { show = 1; next } /^$/ { show = 0 } show' "$report" | head -24 | cut -c1-700
            # The corpus: every disabled mod with its reason (one line each), and code that reaches for Fabric Loader
            # internals Fabricated doesn't provide (deep hooks that would fail when they run).
            if { [ "$run" = client-corpus ] || [ "$run" = client-advanced ] || [ "$run" = client-malilib ] || [ "$run" = client-sodium-addons ]; } && [ -f "$report" ]; then
              echo "-- disabled mods:"
              awk '/^== Disabled Fabric mods/ { show = 1; next } /^$/ { show = 0 } show && /^  [^ ]/ { id = $1 } show && /^      / && !/^      Fix:/ && id { print "  " id ": " substr($0, 7); id = "" }' "$report" | cut -c1-260
              echo "-- Fabric Loader references Fabricated doesn't provide:"
              awk '/^== Linkage warnings/ { show = 1; next } /^$/ { show = 0 } show' "$report" | grep -E "missing [a-z]+ net\.fabricmc\.(loader|api)\." | head -30 | cut -c1-300
              echo "-- loaded without some of their mixins (LEAVE-1):"
              awk '/^== Mixins left out/ { show = 1; next } /^$/ { show = 0 } show' "$report" | cut -c1-260 | head -40
              digest "$log"
            fi
            # The addons run: which Fabric mods loaded (the step's own listing of the jars is far up the log).
            if [ "$run" = client-sodium-addons ] && [ -f "$report" ]; then
              echo "-- loaded Fabric mods, without Fabric API's modules:"
              awk '/^== Loaded Fabric mods/ { show = 1; next } /^(==|$)/ { show = 0 } show && /^  [^ ]/ && $1 !~ /^fabric/ { print "  " $1 " " $2 }' "$report" | head -20
            fi
            # Sodium's Fabric build says it contains a renderer, for which Indigo keeps its mixins off and registers no
            # renderer (the renderer line above says whose draws): what the report says of Indigo there (OVERLOAD-2).
            if [ "$run" = client-sodium-fabric ] && [ -f "$report" ]; then
              grep -E "^  fabric-renderer-indigo" "$report" | head -12 | cut -c1-400 || true
            fi
            # Fabric API's own modules: what pre-flight left out of them (their configs with a plugin).
            if [ "$run" = client-fapi ] && [ -f "$report" ]; then
              awk '/^== Mixin pre-flight warnings ==/ { show = 1; next } /^$/ { show = 0 } show' "$report" | grep -E "^  fabric" | head -30 | cut -c1-500
            fi
            # A crash's description and errors, with the first stack frames.
            for report in $(ls "$RUNNER_TEMP/$run/run/crash-reports"/*.txt 2>/dev/null | head -1); do
              echo "-- $(basename "$report")"
              sed -n '/^Description:/,/^A detailed walkthrough/p' "$report" | grep -v "^A detailed" \
                | awk 'BEGIN { limit = 8 } /^Caused by:/ { frames = 0; limit = 12 } /^[ \t]+at / { if (++frames > limit) next } { print }' | head -60
              # What it was drawing: the block (or fluid) and section a chunk build crashed on, as the renderer adds them.
              grep -E -A5 "^-- (Block being rendered|Block being tesselated|Fluid being tesselated|Chunk section|Section being built)" "$report" \
                | grep -v "^--$" | head -24 | cut -c1-300 || true
              # A mod loading crash names its causes below the walkthrough (its issues' exceptions).
              if grep -q "^net.neoforged.fml.ModLoadingException" "$report"; then
                sed -n '/^A detailed walkthrough/,$p' "$report" | grep -E -A4 "^Caused by:|^\s*Exception message:" | grep -v "^--$" | head -40 | cut -c1-300
              fi
            done
            # A mixin that failed as Mixin applied it, though pre-flight passed it: what Fabricated's report says of it
            # (its notes and repairs), and of the classes those name (other mods' repairs there).
            failed=$(cat "$RUNNER_TEMP/$run/run/crash-reports"/*.txt 2>/dev/null | grep -o -m 1 -E "(in |from |\[)[A-Za-z0-9_./-]+\.json:[A-Za-z0-9_.\$]+ from mod" | head -1 | sed -E 's/^(in |from |\[)[^:]+:(.+) from mod$/\2/' || true)
            bridge="$RUNNER_TEMP/$run/run/logs/fabric-bridge-report.txt"
            if [ -n "$failed" ] && [ -f "$bridge" ]; then
              echo "-- the report on $failed:"
              grep -F "$failed" "$bridge" | head -12 | cut -c1-600 || true
              for class in $(grep -F "$failed" "$bridge" | grep -o -E "net\.minecraft\.[A-Za-z0-9_.\$]+" | sort -u | head -3 || true); do
                echo "-- the report on $class (other mixins):"
                grep -F "$class" "$bridge" | grep -v -F "$failed" | head -12 | cut -c1-600 || true
              done
              # The handler's annotations in the mod's jar, and the target methods' code in the game's jar.
              for crash in $(ls "$RUNNER_TEMP/$run/run/crash-reports"/*.txt 2>/dev/null | head -1); do
                python3 -I ci/mixin-diag.py "$crash" "$RUNNER_TEMP/$run" || true
              done
            fi
            [ -f "$RUNNER_TEMP/$run/stop-reason.txt" ] && { echo "-- stopped by CI on:"; cut -c1-300 "$RUNNER_TEMP/$run/stop-reason.txt"; }
            # A client that didn't reach a world: its first errors (without the narrator's and the offline account's,
            # which every run has), the log's last lines, and where its render thread was near the timeout.
            if ! grep -q "Successfully finished." "$log"; then
              echo "-- no world reached; first errors:"
              # Each with its exception and that exception's first frames.
              awk '
                state == 2 && /^[ \t]+at / { if (frames++ < 3) print "      " substr($0, 1, 200); next }
                state == 1 && !/^[ \t]+at / && !/^\[/ { print "    " substr($0, 1, 300); state = 2; frames = 0; next }
                { state = 0 }
                /\/(ERROR|FATAL)\]/ && !/[Nn]arrator|flite|401|TargetDataLine/ { if (n == 6) exit; n++; print substr($0, 1, 300); state = 1 }
              ' "$log"
              # The innermost cause of the first exception that stopped the game, with its frames (a chunk build's, say,
              # whose crash report holds none when vanilla's trimming of it fails).
              awk '
                /Reported exception thrown|Chunk build failed|Unreported exception thrown|Exception in thread/ { armed = 1 }
                armed && /^Caused by:/ && !/401|flite|TargetDataLine/ { cause = $0; frames = ""; n = 0; inside = 1; next }
                inside && /^[ \t]+at / { if (n++ < 20) frames = frames "\n" substr($0, 1, 220); next }
                inside && /^[ \t]+\.\.\. [0-9]+ more/ { next }
                inside { inside = 0; if (cause != "" && !/^Caused by:/) { found = 1; exit } }
                END { if (cause != "") print "-- innermost cause:\n" substr(cause, 1, 300) frames }
              ' "$log" | head -24 || true
              # An exception that left the game's main thread goes to the console only.
              grep -h -m 2 -A 8 "^Exception in thread" "$RUNNER_TEMP/$run/client.out" 2>/dev/null | cut -c1-250 || true
              # Which thread ended the game, and from where (the test mod's shutdown hook), without the JDK's own frames.
              awk '/^FABRICATED-TEST game ended/ { show = 1; print; next } show && /^\tat / { if ($0 !~ /java\.base\//) print; next } { show = 0 }' \
                "$RUNNER_TEMP/$run/client.out" 2>/dev/null | head -14 | cut -c1-250 || true
              # What the client showed half a minute into its world, and whether chunks arrived (the test mod).
              grep -h -m 1 "FABRICATED-TEST world state" "$log" | cut -c1-400 || true
              grep -h -m 1 "FABRICATED-TEST server state" "$log" | cut -c1-500 || true
              # The player's way into the integrated server, and out.
              grep -h -E "joined the game|left the game|lost connection|Saving and pausing|Failed to handle packet" "$log" | head -8 | cut -c1-300 || true
              # Who asked the game to stop, if anything did (the test mod).
              grep -h -m 1 -A 12 "FABRICATED-TEST game stop requested" "$log" | grep -v "java\.base/" | cut -c1-250 || true
              echo "-- last lines of the log:"
              grep -v "Waiting for player to load" "$log" | tail -n 4 | cut -c1-300
            fi
            dump="$RUNNER_TEMP/$run/thread-dump.txt"
            if [ -f "$dump" ]; then
              # The game's main threads, with their state and the monitors they hold or wait for, or the start of the dump
              # when it has neither (jstack's own error, say).
              for thread in "Render thread" "Server thread"; do
                echo "-- $thread shortly before the timeout:"
                awk -v name="\"$thread\"" 'BEGIN { RS = "" } index($0, name) == 1' "$dump" \
                  | grep -E "^[[:space:]]+(at |- )|java\.lang\.Thread\.State" | head -20
              done
              grep -q -E '^"(Render|Server) thread"' "$dump" || head -n 5 "$dump"
              # The thread holding a monitor one of them waits for (CORPUS-48: Xaero's World Map's server world unload waits
              # inside its synchronized block, line 106), with its state and top frames.
              for lock in $(awk 'BEGIN { RS = "" } /^"(Render|Server) thread"/' "$dump" | grep -o -E 'waiting to lock <0x[0-9a-f]+>' \
                  | grep -o -E '0x[0-9a-f]+' | sort -u | head -3); do
                echo "-- the thread holding <$lock>:"
                awk -v lock="- locked <$lock>" 'BEGIN { RS = "" } index($0, lock) { print; exit }' "$dump" \
                  | grep -E '^"|^[[:space:]]+(at |- )|java\.lang\.Thread\.State' | head -24 | cut -c1-250
              done
            fi
          done
          # The corpora on a dedicated server: their errors as the game ran (the clients' above include their integrated
          # server's), and a server that didn't start: its crash and the log's last lines.
          for run in server-corpus server-advanced; do
            log="$RUNNER_TEMP/$run/logs/latest.log"
            [ -f "$log" ] || continue
            echo "== $run"
            # Every disabled mod with its reason (one line each), as for the corpus clients.
            report="$RUNNER_TEMP/$run/logs/fabric-bridge-report.txt"
            if [ -f "$report" ]; then
              echo "-- disabled mods:"
              awk '/^== Disabled Fabric mods/ { show = 1; next } /^$/ { show = 0 } show && /^  [^ ]/ { id = $1 } show && /^      / && !/^      Fix:/ && id { print "  " id ": " substr($0, 7); id = "" }' "$report" | cut -c1-260
              # Which mods' entrypoints failed, and which ran long (a mod whose content is missing shows whether it ran).
              echo "-- entrypoint failures:"
              awk '/^== Entrypoint failures/ { show = 1; next } /^$/ { show = 0 } show' "$report" | cut -c1-260 | head -20
              echo "-- slow entrypoints:"
              awk '/^== Slow entrypoints/ { show = 1; next } /^$/ { show = 0 } show' "$report" | head -25
            fi
            # Fabricated's own warnings and errors (a NeoForge internal it could not reach, a bridge that failed).
            echo "-- Fabricated's warnings and errors:"
            grep -h -E '/(WARN|ERROR)\] \[Fabricated' "$log" | head -15 | cut -c1-300 || true
            digest "$log"
            if ! grep -q -E 'Done \([0-9.]+s\)!' "$log"; then
              for report in $(ls "$RUNNER_TEMP/$run/crash-reports"/*.txt 2>/dev/null | head -1); do
                echo "-- $(basename "$report")"
                sed -n '/^Description:/,/^A detailed walkthrough/p' "$report" | grep -v "^A detailed" | head -40
                # A mod loading crash names its causes below that (its issues' exceptions), with their first frames.
                grep -E -A4 "^Caused by:|^\s*Exception message:" "$report" | grep -v "^--$" | head -40 | cut -c1-300
              done
              echo "-- server didn't start; last lines of the log:"
              tail -n 6 "$log" | cut -c1-300
            fi
          done
      # The bytecode task 5's open findings turn on, for reading (informational; last, so the job log's tail has it):
      # Polydium's mixin plugin and its font mixin (whose handler, typed with the mixin class, stops 1.21.1 and 1.21.11
      # as Mixin applies it); Architectury's keyboard hook into a lambda of KeyboardHandler.charTyped, which Mixin finds
      # no target for on 1.21.1 (the corpus); malilib's tooltip hooks; how the Sodium and Iris gate's clients leave their
      # world; Sodium's and Iris's Fabric builds' quad and access findings; Xaero's World Map's world unload (CORPUS-48).
      # Members only, and a class that is the same as one printed (a translation in several cache jars) once.
      - name: Bytecode for task 5's findings (informational)
        if: ${{ (matrix.part == 'mods' || matrix.part == 'corpus') && env.EXTENDED == 'true' && !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          dump() {
            local run=$1
            shift
            [ -d "$RUNNER_TEMP/$run" ] || return 0
            echo "== $run"
            python3 -I ci/javap-dump.py "$RUNNER_TEMP/$run" "$@" | cut -c1-320 || true
          }
          dump client-malilib 'game:net.minecraft.world.item.ItemStack#getTooltipLines'
          # The Sodium and Iris gate's client block entity check, which run 673's Sodium client on 26.2 reported neither way:
          # how each of its clients left its world and stopped.
          for run in client-sodium-fabric client-shaders-fabric; do
            log="$RUNNER_TEMP/$run/run/logs/latest.log"
            if [ -f "$log" ]; then
              echo "== $run: leaving its world"
              grep -h -E "client block entity events|Successfully finished|Stopping!|[Dd]isconnect|Saving and pausing|left the game" "$log" | tail -8 | cut -c1-300 || true
            fi
          done
          # CORPUS-56: R6's result (far up the log by now), with Continuity's state where it saw no connected texture, and
          # what pre-flight left out of Continuity; on 1.21.1, the wrapper method a wrapped model's throw is held in.
          log="$RUNNER_TEMP/client-continuity/run/logs/latest.log"
          if [ -f "$log" ]; then
            echo "== client-continuity: R6"
            grep -h -m 10 -E "FABRICATED-TEST (continuity|frapi broken part)" "$log" | cut -c1-2000 || true
            grep -h -m 8 -E "\[[Cc]ontinuity/|Continuity/\]|[Cc]ontinuity.*(WARN|ERROR)" "$log" | cut -c1-600 || true
            awk '/^== Mixin pre-flight failures ==/ { show = 1; next } /^$/ { show = 0 } show' "$RUNNER_TEMP/client-continuity/run/logs/fabric-bridge-report.txt" 2>/dev/null | grep -i -A2 continuity | head -20 | cut -c1-700 || true
            # Run 673 on 26.2: Continuity's transform was reset again, but the glass gave R6 no quads at all. A throw inside
            # Continuity's processing, held until its call returned, would do that: the block models that threw while drawn
            # (the test mod's broken ones among them), each with the stack of what threw, and the report's lines for them.
            echo "== client-continuity: block models that threw while drawn"
            grep -h -m 6 -A 14 -E "threw while drawn" "$log" | cut -c1-400 | head -100 || true
            sed -n '/^== Rendering ==/,/^$/p' "$RUNNER_TEMP/client-continuity/run/logs/fabric-bridge-report.txt" 2>/dev/null | cut -c1-700 | head -12 || true
          fi
          if [ "${{ matrix.target.minecraft }}" = "1.21.1" ]; then
            dump client-continuity 'mod:net.fabricmc.fabric.api.renderer.v1.model.ForwardingBakedModel#emitBlockQuads'
            # The client with Forgified Fabric API and Sodium: which Fabric API modules Forgified Fabric API provides there,
            # and what Fabricated's own left out for them, so the test mod's failed checks can be told apart (its modules or
            # Fabricated's); the step's own print is far up the log by now.
            report="$RUNNER_TEMP/client-coexist/run/logs/fabric-bridge-report.txt"
            if [ -f "$report" ]; then
              echo "== client-coexist: Fabric API providers"
              sed -n '/== Fabric API modules provided by other mods ==/,/^$/p;/== Fabric API providers ==/,/^$/p' "$report" | cut -c1-900 | head -80 || true
            fi
          fi
          # APPLY-2: the method the game's worker threads hand what they stop on to, as each version names it.
          dump server-corpus 'game:net.minecraft.Util#onThreadException' 'game:net.minecraft.util.Util#onThreadException'
          if [ "${{ matrix.target.minecraft }}" = "1.21.1" ]; then
            # CORPUS-61: Carpet's spawn redirect (the advanced corpus) and Friends & Foes' patrol hook (the corpus), at calls
            # NeoForge's coremod points at its spawn event's hook: what pre-flight moved, and any failure as Mixin applied them.
            for side in server-corpus server-advanced; do
              echo "== $side: CORPUS-61"
              report="$RUNNER_TEMP/$side/logs/fabric-bridge-report.txt"
              if [ -f "$report" ]; then grep -h -E "finalizeMobSpawn|code transformers" "$report" | cut -c1-700 | head -6 || true; fi
              log="$RUNNER_TEMP/$side/logs/latest.log"
              if [ -f "$log" ]; then
                grep -h -m 3 -o "Critical injection failure.*" "$log" | cut -c1-1500 || true
                grep -h -m 3 "failed as Mixin applied it" "$log" | cut -c1-700 || true
              fi
            done
          fi
          # CORPUS-48: what Xaero's World Map's server world unload runs at its line 106, where the corpus clients' server
          # thread stays (not parked: a loop) while mc-runtime-test's stop joins it from the render thread.
          dump client-corpus 'mod:xaero.map.file.worldsave.WorldDataHandler#onServerWorldUnload' 'mod:xaero.map.file.worldsave.WorldDataHandler#*'
          # LAMBDA-9: Litematica's schematic hooks into LevelRenderer.addMainPass's lambda, which NeoForge 26.2 gives one more
          # value: what pre-flight now reports of them, and addMainPass as NeoForge's and vanilla's code declare it.
          if [ "${{ matrix.target.minecraft }}" = "26.2" ]; then
            report="$RUNNER_TEMP/client-malilib/run/logs/fabric-bridge-report.txt"
            if [ -f "$report" ]; then grep -h "MixinLevelRenderer" "$report" | cut -c1-1500 | head -10 || true; fi
            if [ -d "$RUNNER_TEMP/client-malilib" ]; then
              # NeoForge's build has two: their descriptors and flags, and whether one calls the other.
              python3 -I ci/javap-dump.py "$RUNNER_TEMP/client-malilib" 'game:net.minecraft.client.renderer.LevelRenderer#addMainPass' \
                | grep -E "^-- | addMainPass\(|descriptor:|flags:|invoke[a-z]+ .*addMainPass|invokedynamic|stack=" | head -40 || true
              python3 -I ci/javap-dump.py "$RUNNER_TEMP/client-malilib" 'vanilla:net.minecraft.client.renderer.LevelRenderer#addMainPass' \
                | grep -E -A3 "^-- | addMainPass\(" | grep -v "^--$" || true
            fi
          fi
