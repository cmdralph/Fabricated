      - name: Fabric renderer API (1.21.1)
        if: ${{ matrix.part == 'client' && !cancelled() && steps.build.outcome == 'success' && matrix.target.minecraft == '1.21.1' }}
        run: |
          log="$RUNNER_TEMP/client-fapi/run/logs/latest.log"
