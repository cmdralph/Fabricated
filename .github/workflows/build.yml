name: Build and test

# A branch with a pull request is built once, as the pull request (merged with its base): a push event too would build
# every commit twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Minecraft-independent modules
        run: ./gradlew -Pfabricated.coreOnly=true build --stacktrace
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/build/reports/tests
            fabric-loader-api/build/reports/tests
          if-no-files-found: ignore

  minecraft:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    needs: core
    # NeoForge 26.3 is still in beta, so its job is best-effort and does not fail the workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.11"
            fabric_api: "0.141.6+1.21.11"
            neoforge: "21.11.45"
            # Modrinth version ids of the mods reading plugins (no WTHIT build for 26.3).
            plugin_hosts: "jei@Sb3olMoE rei@p0bsGl2I jade@LDFqgwEA wthit@9kLa6aJn simple-voice-chat@q4sBpZd2"
            java: 21
            experimental: false
          - minecraft: "26.1.2"
            fabric_api: "0.155.3+26.1.2"
            neoforge: "26.1.2.116"
            # Modrinth version ids of the mods reading plugins (no WTHIT build for 26.3).
            plugin_hosts: "jei@NiYfNYIM rei@isd1MxO2 jade@Pr1h4azo wthit@86roxNra simple-voice-chat@ux2lghIT"
            java: 25
            experimental: false
          - minecraft: "26.2"
            fabric_api: "0.161.0+26.2"
            neoforge: "26.2.0.90"
            # Modrinth version ids of the mods reading plugins (no WTHIT build for 26.3).
            plugin_hosts: "jei@JMEYi0NN rei@BoY0Dky0 jade@GBES6etT wthit@nYkvtEUa simple-voice-chat@xNwwyLuz"
            java: 25
            experimental: false
          - minecraft: "26.3"
            fabric_api: "0.164.0+26.3"
            neoforge: "26.3.0.69-beta"
            # Modrinth version ids of the mods reading plugins (no WTHIT build for 26.3).
            plugin_hosts: "jei@3EynCW85 rei@uwE0PJmc jade@dVB8U7Td simple-voice-chat@3rpCvvMZ"
            java: 25
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabricated and test mods
        id: build
        run: >
          ./gradlew :mc:${{ matrix.minecraft }}:fabricatedJar :mc:${{ matrix.minecraft }}:testmods --stacktrace
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Select Java ${{ matrix.java }} for the server
        run: echo "JAVA_HOME=$JAVA_HOME_${{ matrix.java }}_X64" >> "$GITHUB_ENV" && echo "$JAVA_HOME_${{ matrix.java }}_X64/bin" >> "$GITHUB_PATH"
      - name: Server smoke test (test mods only)
        run: ci/smoke-server.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/server"
      - name: Upload server logs and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/server/logs
            ${{ runner.temp }}/server/server.out
            ${{ runner.temp }}/server/.fabricated/cache/v1/index.json
          if-no-files-found: ignore
      # NeoForge's internals change between builds of one Minecraft version, and Fabricated accepts every build of it,
      # so the test mods also boot on the newest build (informational: it can break for reasons of its own).
      - name: Server smoke test on the newest NeoForge build (informational)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          pinned="${{ matrix.neoforge }}"
          newest=$(curl -fsSL --retry 4 https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | python3 -c '
          import re, sys
          builds = [v for v in re.findall(r"<version>([^<]+)</version>", sys.stdin.read()) if v.startswith(sys.argv[1])]
          print(builds[-1] if builds else "")' "${pinned%.*}.")
          echo "Newest NeoForge build for ${{ matrix.minecraft }}: ${newest:-none} (pinned: $pinned)" | tee "$RUNNER_TEMP/summary-newest.txt"
          if [ -z "$newest" ] || [ "$newest" = "$pinned" ]; then exit 0; fi
          set -o pipefail
          ci/smoke-server.sh "${{ matrix.minecraft }}" "$newest" "$RUNNER_TEMP/server-newest" | tee -a "$RUNNER_TEMP/summary-newest.txt"
      # Boot again with the official Fabric API jar (downloaded here in CI, never by Fabricated) and keep the
      # report, which lists every pass-through module and mixin pre-flight result. The server must start;
      # the other checks in this run are informational.
      - name: Server smoke test with Fabric API (server must start)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/extra/fabric-api.jar" \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${{ matrix.fabric_api }}/fabric-api-${{ matrix.fabric_api }}.jar"
          ci/smoke-server.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/server-fapi" "$RUNNER_TEMP/extra"
      - name: Upload Fabric API run logs and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-fabric-api-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/server-fapi/logs
            ${{ runner.temp }}/server-fapi/server.out
          if-no-files-found: ignore
      # Client: a real NeoForge client started headlessly (Xvfb), which joins a singleplayer world.
      # 26.3+ open their window with SDL3 over EGL, which needs Mesa's EGL library (not on the runner image).
      - name: Install Mesa EGL for the client
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Client smoke test (test mods, singleplayer world)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client"
      - name: Upload client logs and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/client/run/logs
            ${{ runner.temp }}/client/run/crash-reports
            ${{ runner.temp }}/client/client.out
            ${{ runner.temp }}/client/thread-dump.txt
          if-no-files-found: ignore
      # The same client with the official Fabric API jar: shows which client-side modules load and whether the game
      # still reaches a world. Informational until every client module is accounted for.
      - name: Client smoke test with Fabric API (informational)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # On 26.x the test mod for Fabric's renderer API joins this run (it needs the renderer API, which only the
        # Fabric API jar provides).
        run: |
          mkdir -p "$RUNNER_TEMP/extra-client"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-client/"
          cp mc/${{ matrix.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-client/" 2>/dev/null || true
          SMOKE_TIMEOUT=480 ci/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-fapi" "$RUNNER_TEMP/extra-client" || true
          grep -A200 "== " "$RUNNER_TEMP/client-fapi/run/logs/fabric-bridge-report.txt" || true
      # A Fabric model (its own emitQuads) must be drawn in the world: Fabricated sends it through Fabric's renderer when
      # its chunk section is meshed. This check is a gate, unlike the run above.
      - name: Fabric renderer API and model formats (26.x)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.') }}
        run: |
          log="$RUNNER_TEMP/client-fapi/run/logs/latest.log"
          failed=0
          check() {
            if grep -h "FABRICATED-TEST $1" "$log"; then
              echo "PASS: $2"
            else
              echo "::error::FAIL: $2 (no \"$1\" line)"
              failed=1
            fi
          }
          check "frapi terrain OK" "a Fabric block model was meshed into a chunk section"
          check "frapi nested terrain OK" "a Fabric model inside a vanilla multipart model was meshed"
          check "frapi moving block OK" "a falling Fabric block model was drawn as a moving block"
          check "frapi baked colors OK" "a NeoForge quad's baked colour reached Fabric's renderer (FRAPI-2)"
          check "frapi baked quad constructor hook OK" "a mixin at the end of BakedQuad's vanilla constructor ran for NeoForge's block quads (pre-flight repair)"
          check "frapi breaking OK" "a Fabric block model got the breaking overlay"
          check "frapi level-aware default OK" "a NeoForge model inside a Fabric model got the chunk section's level from Fabric's renderer"
          check "model deserializer OK" "a model file of a Fabric type was read by its Fabric deserializer"
          check "neoforge blockstate type OK" "a blockstate of NeoForge's composite type still loads with Fabric's model loading"
          if [ "$failed" = 1 ]; then
            grep -n -m 40 -E "frapi|FabricBlockRendering|RenderMixin|SectionCompiler|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      # Fabric's model loading API on 1.21.11, where it loads without the renderer API (CORPUS-6): a model file of a
      # Fabric type must be read by the test mod's Fabric deserializer. A gate.
      - name: Fabric model loading API (1.21.11)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.minecraft == '1.21.11' }}
        run: |
          log="$RUNNER_TEMP/client-fapi/run/logs/latest.log"
          if grep -h "FABRICATED-TEST model deserializer OK" "$log"; then
            echo "PASS: a model file of a Fabric type was read by its Fabric deserializer"
          else
            echo "::error::FAIL: a model file of a Fabric type was read by its Fabric deserializer (no \"model deserializer OK\" line)"
            grep -n -m 30 -E "model.loading|ModelManager|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      - name: Upload Fabric API client run logs and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-fabric-api-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/client-fapi/run/logs
            ${{ runner.temp }}/client-fapi/run/crash-reports
            ${{ runner.temp }}/client-fapi/client.out
            ${{ runner.temp }}/client-fapi/thread-dump.txt
          if-no-files-found: ignore
      # Sodium and Iris for NeoForge (downloaded here from Modrinth, never redistributed) with Fabric API and the test
      # mod for Fabric's renderer API: Sodium meshes the world through its own Fabric renderer, which must draw Fabric
      # models, and Fabric API's default renderer must stand down for it.
      - name: Client smoke test with Sodium and Iris for NeoForge (26.x)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-sodium"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-sodium" neoforge sodium iris
          cp "$RUNNER_TEMP/extra/fabric-api.jar" mc/${{ matrix.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-sodium/"
          SMOKE_TIMEOUT=480 ci/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-sodium" "$RUNNER_TEMP/extra-sodium" || true
          grep -A200 "== " "$RUNNER_TEMP/client-sodium/run/logs/fabric-bridge-report.txt" || true
      - name: Fabric models under Sodium (26.x)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.') }}
        env:
          MC: ${{ matrix.minecraft }}
        run: |
          if ! ls "$RUNNER_TEMP"/extra-sodium/sodium*.jar >/dev/null 2>&1; then
            echo "::warning::Modrinth has no Sodium for NeoForge $MC build: nothing to check"
            exit 0
          fi
          log="$RUNNER_TEMP/client-sodium/run/logs/latest.log"
          failed=0
          check() {
            if grep -h "$1" "$log"; then
              echo "PASS: $2"
            else
              echo "::error::FAIL: $2 (no \"$1\" line)"
              failed=1
            fi
          }
          check "Different rendering plugin detected; not applying Indigo" "Fabric API's default renderer stood down for Sodium's"
          check "FABRICATED-TEST frapi terrain OK .*LevelSlice" "Sodium meshed a Fabric block model through its Fabric renderer"
          check "FABRICATED-TEST frapi level-aware default OK" "a NeoForge model inside a Fabric model got Sodium's chunk section"
          check "FABRICATED-TEST frapi moving block OK" "a falling Fabric block model was drawn with Sodium's renderer"
          check "FABRICATED-TEST frapi breaking OK" "a Fabric block model got the breaking overlay with Sodium's renderer"
          if [ "$failed" = 1 ]; then
            grep -n -m 60 -E "frapi|Indigo|sodium|Sodium|iris|Iris|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      # The Fabric builds of Sodium and Iris, loaded on request (loadUnsupported) with Fabric API and the renderer API
      # test mod: informational, it records what breaks for the rendering-pipeline track (docs/roadmap.md).
      - name: Client with the Fabric builds of Sodium and Iris (informational, 26.x)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FABRICATED_MODS: '{"sodium": {"loadUnsupported": true}, "iris": {"loadUnsupported": true}}'
        run: |
          mkdir -p "$RUNNER_TEMP/extra-sodium-fabric"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-sodium-fabric" fabric sodium iris
          cp "$RUNNER_TEMP/extra/fabric-api.jar" mc/${{ matrix.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-sodium-fabric/"
          SMOKE_TIMEOUT=480 ci/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-sodium-fabric" "$RUNNER_TEMP/extra-sodium-fabric" || true
          grep -A300 "== " "$RUNNER_TEMP/client-sodium-fabric/run/logs/fabric-bridge-report.txt" || true
          grep -n -m 80 -E "FABRICATED-TEST frapi|Sodium|Iris|/(ERROR|FATAL)\]" "$RUNNER_TEMP/client-sodium-fabric/run/logs/latest.log" || true
      - name: Upload Sodium client run logs and report
        if: ${{ !cancelled() && startsWith(matrix.minecraft, '26.') }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-sodium-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/client-sodium/run/logs
            ${{ runner.temp }}/client-sodium/run/crash-reports
            ${{ runner.temp }}/client-sodium/client.out
            ${{ runner.temp }}/client-sodium/thread-dump.txt
            ${{ runner.temp }}/client-sodium-fabric/run/logs
            ${{ runner.temp }}/client-sodium-fabric/run/crash-reports
            ${{ runner.temp }}/client-sodium-fabric/client.out
          if-no-files-found: ignore
      # The Fabric-only Polyfrost stack (OneConfig, PolyPlus): no NeoForge build exists, so Fabricated is its only way
      # to NeoForge. Modrinth slugs and builds per version are UNVERIFIED; a missing one is reported and skipped.
      - name: Client with OneConfig and PolyPlus (informational)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-polyfrost"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-polyfrost" fabric oneconfig polyplus | tee "$RUNNER_TEMP/summary-polyfrost.txt"
          if ! grep -qE "^(oneconfig|polyplus): [^n]" "$RUNNER_TEMP/summary-polyfrost.txt"; then exit 0; fi
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-polyfrost/"
          # Polydium asks once, in the first world, whether to switch to Vulkan, and the world test waits for no screen to be
          # open: its own marker says it has asked.
          mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/polydium" && touch "${XDG_CONFIG_HOME:-$HOME/.config}/polydium/vulkan-prompt"
          SMOKE_TIMEOUT=480 ci/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-polyfrost" "$RUNNER_TEMP/extra-polyfrost" || true
          # The counts and the disabled mods, not the long list of loaded ones.
          awk '/^== /{show = /^== (Summary|Disabled)/} show' "$RUNNER_TEMP/client-polyfrost/run/logs/fabric-bridge-report.txt" | head -80 | tee -a "$RUNNER_TEMP/summary-polyfrost.txt" || true
          # Which modules serve the native libraries of jars without classes (Skiko's).
          grep -F "has no classes" "$RUNNER_TEMP/client-polyfrost/run/logs/fabric-bridge-report.txt" | head -10 | tee -a "$RUNNER_TEMP/summary-polyfrost.txt" || true
      - name: Upload Polyfrost client logs and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: client-polyfrost-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/client-polyfrost/run/logs
            ${{ runner.temp }}/client-polyfrost/run/crash-reports
            ${{ runner.temp }}/client-polyfrost/client.out
          if-no-files-found: ignore
      # The NeoForge builds of recipe viewers, tooltip mods and Simple Voice Chat (pinned per version), with the test
      # mod's plugins declared the Fabric way (as entrypoints, and WTHIT's plugin file): each must construct and call
      # its plugin.
      - name: Plugins for the NeoForge builds of other mods
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-viewers"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-viewers" neoforge ${{ matrix.plugin_hosts }} | tee viewers.txt
          SMOKE_TIMEOUT=480 ci/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-viewers" "$RUNNER_TEMP/extra-viewers" || true
          grep -A12 "== Plugins for other mods" "$RUNNER_TEMP/client-viewers/run/logs/fabric-bridge-report.txt" || true
          log="$RUNNER_TEMP/client-viewers/run/logs/latest.log"
          for host in ${{ matrix.plugin_hosts }}; do
            host="${host%@*}"
            for what in constructed called; do
              count=$(grep -c "FABRICATED-TEST $host plugin $what OK" "$log" 2>/dev/null || true)
              echo "$host plugin $what: ${count:-0} time(s)"
            done
          done | tee "$RUNNER_TEMP/summary-viewers.txt"
          grep -n -m 40 -E "/(ERROR|FATAL)\]" "$log" || true
          if grep -q ": 0 time(s)" "$RUNNER_TEMP/summary-viewers.txt"; then echo "FAIL: a mod did not construct or call the test mod's plugin"; exit 1; fi
      - name: Upload recipe viewer client logs and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: client-viewers-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/client-viewers/run/logs
            ${{ runner.temp }}/client-viewers/run/crash-reports
            ${{ runner.temp }}/client-viewers/client.out
          if-no-files-found: ignore
      # Popular Fabric mods from Modrinth (ci/mod-corpus.txt, downloaded here in CI and checked against Modrinth's
      # SHA-512), loaded together with Fabric API: shows which load, which are disabled and why. Informational.
      - name: Fetch the mod corpus
        id: corpus
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/corpus" | tee "$RUNNER_TEMP/corpus.txt"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/corpus/"
      - name: Server with the mod corpus (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        run: ci/smoke-server.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/server-corpus" "$RUNNER_TEMP/corpus" || true
      - name: Client with the mod corpus (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # CORPUS-2: Xaero's World Map stops the client on its first tick, so it runs alone below and the other mods
        # reach a world here.
        run: |
          mkdir -p "$RUNNER_TEMP/corpus-client"
          cp "$RUNNER_TEMP/corpus/"*.jar "$RUNNER_TEMP/corpus-client/"
          worldmap=$(sed -n 's/^xaeros-world-map: .* (\(.*\))$/\1/p' "$RUNNER_TEMP/corpus.txt")
          if [ -n "$worldmap" ]; then rm -f "$RUNNER_TEMP/corpus-client/$worldmap"; fi
          SMOKE_TIMEOUT=600 ci/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-corpus" "$RUNNER_TEMP/corpus-client" || true
          grep -A400 "== " "$RUNNER_TEMP/client-corpus/run/logs/fabric-bridge-report.txt" || true
      - name: Client with Xaero's World Map alone (informational, CORPUS-2)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-worldmap"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-worldmap" fabric xaeros-world-map
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-worldmap/"
          SMOKE_TIMEOUT=420 ci/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-worldmap" "$RUNNER_TEMP/extra-worldmap" || true
      - name: Upload mod corpus logs and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/server-corpus/logs
            ${{ runner.temp }}/server-corpus/server.out
            ${{ runner.temp }}/client-corpus/run/logs
            ${{ runner.temp }}/client-corpus/run/crash-reports
            ${{ runner.temp }}/client-corpus/client.out
          if-no-files-found: ignore
      # The job log keeps only its end, so the informational runs' results are repeated here, last.
      - name: Summary of the informational runs
        if: ${{ !cancelled() }}
        run: |
          for f in summary-newest summary-viewers; do
            [ -f "$RUNNER_TEMP/$f.txt" ] && { echo "== $f"; grep -E "^(Newest|PASS|FAIL|WARN)|plugin|not in this run" "$RUNNER_TEMP/$f.txt" | head -60; }
          done
          [ -f "$RUNNER_TEMP/summary-polyfrost.txt" ] && { echo "== summary-polyfrost"; head -60 "$RUNNER_TEMP/summary-polyfrost.txt"; }
          [ -f viewers.txt ] && { echo "== viewers fetched"; cat viewers.txt; }
          for run in client-sodium-fabric client-viewers client-polyfrost client-corpus client-worldmap; do
            log="$RUNNER_TEMP/$run/run/logs/latest.log"
            [ -f "$log" ] || continue
            echo "== $run"
            grep -h -m 20 -E "FABRICATED-TEST frapi|Caused by|Exception in|crash report" "$log" || true
            # A crash's description and errors, with the first stack frames.
            for report in $(ls "$RUNNER_TEMP/$run/run/crash-reports"/*.txt 2>/dev/null | head -1); do
              echo "-- $(basename "$report")"
              sed -n '/^Description:/,/^A detailed walkthrough/p' "$report" | grep -v "^A detailed" \
                | awk 'BEGIN { limit = 8 } /^Caused by:/ { frames = 0; limit = 4 } /^[ \t]+at / { if (++frames > limit) next } { print }' | head -40
            done
            [ -f "$RUNNER_TEMP/$run/stop-reason.txt" ] && { echo "-- stopped by CI on:"; cut -c1-300 "$RUNNER_TEMP/$run/stop-reason.txt"; }
            # A client that didn't reach a world: its first errors (without the narrator's and the offline account's,
            # which every run has), the log's last lines, and where its render thread was near the timeout.
            if ! grep -q "Successfully finished." "$log"; then
              echo "-- no world reached; first errors:"
              # Each with its exception and that exception's first frames.
              awk '
                state == 2 && /^[ \t]+at / { if (frames++ < 3) print "      " substr($0, 1, 200); next }
                state == 1 && !/^[ \t]+at / && !/^\[/ { print "    " substr($0, 1, 300); state = 2; frames = 0; next }
                { state = 0 }
                /\/(ERROR|FATAL)\]/ && !/[Nn]arrator|flite|401|TargetDataLine/ { if (n == 6) exit; n++; print substr($0, 1, 300); state = 1 }
              ' "$log"
              # An exception that left the game's main thread goes to the console only.
              grep -h -m 2 -A 8 "^Exception in thread" "$RUNNER_TEMP/$run/client.out" 2>/dev/null | cut -c1-250 || true
              # Which thread ended the game, and from where (the test mod's shutdown hook), without the JDK's own frames.
              awk '/^FABRICATED-TEST game ended/ { show = 1; print; next } show && /^\tat / { if ($0 !~ /java\.base\//) print; next } { show = 0 }' \
                "$RUNNER_TEMP/$run/client.out" 2>/dev/null | head -14 | cut -c1-250 || true
              echo "-- last lines of the log:"
              grep -v "Waiting for player to load" "$log" | tail -n 4 | cut -c1-300
            fi
            dump="$RUNNER_TEMP/$run/thread-dump.txt"
            if [ -f "$dump" ]; then
              # The game's main threads, or the start of the dump when it has neither (jstack's own error, say).
              for thread in "Render thread" "Server thread"; do
                echo "-- $thread shortly before the timeout:"
                awk -v name="\"$thread\"" 'BEGIN { RS = "" } index($0, name) == 1' "$dump" | grep -E "^[[:space:]]+at " | head -15
              done
              grep -q -E '^"(Render|Server) thread"' "$dump" || head -n 5 "$dump"
            fi
          done
      - name: Upload Fabricated jar
        uses: actions/upload-artifact@v4
        with:
          name: fabricated-mc${{ matrix.minecraft }}
          path: build/libs/fabricated-*+mc${{ matrix.minecraft }}.jar
