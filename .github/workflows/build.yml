name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Minecraft-independent modules
        run: ./gradlew -Pfabricated.coreOnly=true build --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/build/reports/tests
            fabric-loader-api/build/reports/tests
          if-no-files-found: ignore

  minecraft:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    needs: core
    # NeoForge 26.3 is still in beta, so its job is best-effort and does not fail the workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.11"
            fabric_api: "0.141.6+1.21.11"
            neoforge: "21.11.45"
            java: 21
            experimental: false
          - minecraft: "26.1.2"
            fabric_api: "0.155.3+26.1.2"
            neoforge: "26.1.2.116"
            java: 25
            experimental: false
          - minecraft: "26.2"
            fabric_api: "0.161.0+26.2"
            neoforge: "26.2.0.90"
            java: 25
            experimental: false
          - minecraft: "26.3"
            fabric_api: "0.164.0+26.3"
            neoforge: "26.3.0.69-beta"
            java: 25
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabricated and test mods
        id: build
        run: >
          ./gradlew :mc:${{ matrix.minecraft }}:fabricatedJar :mc:${{ matrix.minecraft }}:testmods --stacktrace
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Select Java ${{ matrix.java }} for the server
        run: echo "JAVA_HOME=$JAVA_HOME_${{ matrix.java }}_X64" >> "$GITHUB_ENV" && echo "$JAVA_HOME_${{ matrix.java }}_X64/bin" >> "$GITHUB_PATH"
      - name: Server smoke test (test mods only)
        run: ci/smoke-server.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/server"
      - name: Upload server logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/server/logs
            ${{ runner.temp }}/server/server.out
            ${{ runner.temp }}/server/.fabricated/cache/v1/index.json
          if-no-files-found: ignore
      # NeoForge's internals change between builds of one Minecraft version, and Fabricated accepts every build of it,
      # so the test mods also boot on the newest build (informational: it can break for reasons of its own).
      - name: Server smoke test on the newest NeoForge build (informational)
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          pinned="${{ matrix.neoforge }}"
          newest=$(curl -fsSL --retry 4 https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | python3 -c '
          import re, sys
          builds = [v for v in re.findall(r"<version>([^<]+)</version>", sys.stdin.read()) if v.startswith(sys.argv[1])]
          print(builds[-1] if builds else "")' "${pinned%.*}.")
          echo "Newest NeoForge build for ${{ matrix.minecraft }}: ${newest:-none} (pinned: $pinned)"
          if [ -z "$newest" ] || [ "$newest" = "$pinned" ]; then exit 0; fi
          ci/smoke-server.sh "${{ matrix.minecraft }}" "$newest" "$RUNNER_TEMP/server-newest"
      # Boot again with the official Fabric API jar (downloaded here in CI, never by Fabricated) and keep the
      # report, which lists every pass-through module and mixin pre-flight result. The server must start;
      # the other checks in this run are informational.
      - name: Server smoke test with Fabric API (server must start)
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/extra"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/extra/fabric-api.jar" \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${{ matrix.fabric_api }}/fabric-api-${{ matrix.fabric_api }}.jar"
          ci/smoke-server.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/server-fapi" "$RUNNER_TEMP/extra"
      - name: Upload Fabric API run logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-fabric-api-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/server-fapi/logs
            ${{ runner.temp }}/server-fapi/server.out
          if-no-files-found: ignore
      # Client: a real NeoForge client started headlessly (Xvfb), which joins a singleplayer world.
      # 26.3+ open their window with SDL3 over EGL, which needs Mesa's EGL library (not on the runner image).
      - name: Install Mesa EGL for the client
        if: always() && steps.build.outcome == 'success'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Client smoke test (test mods, singleplayer world)
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client"
      - name: Upload client logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/client/run/logs
            ${{ runner.temp }}/client/run/crash-reports
            ${{ runner.temp }}/client/client.out
            ${{ runner.temp }}/client/thread-dump.txt
          if-no-files-found: ignore
      # The same client with the official Fabric API jar: shows which client-side modules load and whether the game
      # still reaches a world. Informational until every client module is accounted for.
      - name: Client smoke test with Fabric API (informational)
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # On 26.x the test mod for Fabric's renderer API joins this run (it needs the renderer API, which only the
        # Fabric API jar provides).
        run: |
          mkdir -p "$RUNNER_TEMP/extra-client"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-client/"
          cp mc/${{ matrix.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-client/" 2>/dev/null || true
          SMOKE_TIMEOUT=480 ci/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-fapi" "$RUNNER_TEMP/extra-client" || true
          grep -A200 "== " "$RUNNER_TEMP/client-fapi/run/logs/fabric-bridge-report.txt" || true
      # A Fabric model (its own emitQuads) must be drawn in the world: Fabricated sends it through Fabric's renderer when
      # its chunk section is meshed. This check is a gate, unlike the run above.
      - name: Fabric renderer API and model formats (26.x)
        if: always() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.')
        run: |
          log="$RUNNER_TEMP/client-fapi/run/logs/latest.log"
          failed=0
          check() {
            if grep -h "FABRICATED-TEST $1" "$log"; then
              echo "PASS: $2"
            else
              echo "::error::FAIL: $2 (no \"$1\" line)"
              failed=1
            fi
          }
          check "frapi terrain OK" "a Fabric block model was meshed into a chunk section"
          check "frapi nested terrain OK" "a Fabric model inside a vanilla multipart model was meshed"
          check "frapi moving block OK" "a falling Fabric block model was drawn as a moving block"
          check "frapi breaking OK" "a Fabric block model got the breaking overlay"
          check "frapi level-aware default OK" "a NeoForge model inside a Fabric model got the chunk section's level from Fabric's renderer"
          check "model deserializer OK" "a model file of a Fabric type was read by its Fabric deserializer"
          check "neoforge blockstate type OK" "a blockstate of NeoForge's composite type still loads with Fabric's model loading"
          if [ "$failed" = 1 ]; then
            grep -n -m 40 -E "frapi|FabricBlockRendering|RenderMixin|SectionCompiler|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      - name: Upload Fabric API client run logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-fabric-api-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/client-fapi/run/logs
            ${{ runner.temp }}/client-fapi/run/crash-reports
            ${{ runner.temp }}/client-fapi/client.out
            ${{ runner.temp }}/client-fapi/thread-dump.txt
          if-no-files-found: ignore
      # Sodium and Iris for NeoForge (downloaded here from Modrinth, never redistributed) with Fabric API and the test
      # mod for Fabric's renderer API: Sodium meshes the world through its own Fabric renderer, which must draw Fabric
      # models, and Fabric API's default renderer must stand down for it.
      - name: Client smoke test with Sodium and Iris for NeoForge (26.x)
        if: always() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-sodium"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-sodium" neoforge sodium iris
          cp "$RUNNER_TEMP/extra/fabric-api.jar" mc/${{ matrix.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-sodium/"
          SMOKE_TIMEOUT=480 ci/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-sodium" "$RUNNER_TEMP/extra-sodium" || true
          grep -A200 "== " "$RUNNER_TEMP/client-sodium/run/logs/fabric-bridge-report.txt" || true
      - name: Fabric models under Sodium (26.x)
        if: always() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.')
        env:
          MC: ${{ matrix.minecraft }}
        run: |
          if ! ls "$RUNNER_TEMP"/extra-sodium/sodium*.jar >/dev/null 2>&1; then
            echo "::warning::Modrinth has no Sodium for NeoForge $MC build: nothing to check"
            exit 0
          fi
          log="$RUNNER_TEMP/client-sodium/run/logs/latest.log"
          failed=0
          check() {
            if grep -h "$1" "$log"; then
              echo "PASS: $2"
            else
              echo "::error::FAIL: $2 (no \"$1\" line)"
              failed=1
            fi
          }
          check "Different rendering plugin detected; not applying Indigo" "Fabric API's default renderer stood down for Sodium's"
          check "FABRICATED-TEST frapi terrain OK .*LevelSlice" "Sodium meshed a Fabric block model through its Fabric renderer"
          check "FABRICATED-TEST frapi level-aware default OK" "a NeoForge model inside a Fabric model got Sodium's chunk section"
          check "FABRICATED-TEST frapi moving block OK" "a falling Fabric block model was drawn with Sodium's renderer"
          check "FABRICATED-TEST frapi breaking OK" "a Fabric block model got the breaking overlay with Sodium's renderer"
          if [ "$failed" = 1 ]; then
            grep -n -m 60 -E "frapi|Indigo|sodium|Sodium|iris|Iris|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      # The Fabric builds of Sodium and Iris, loaded on request (loadUnsupported) with Fabric API and the renderer API
      # test mod: informational, it records what breaks for the rendering-pipeline track (docs/roadmap.md).
      - name: Client with the Fabric builds of Sodium and Iris (informational, 26.x)
        if: always() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FABRICATED_MODS: '{"sodium": {"loadUnsupported": true}, "iris": {"loadUnsupported": true}}'
        run: |
          mkdir -p "$RUNNER_TEMP/extra-sodium-fabric"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-sodium-fabric" fabric sodium iris
          cp "$RUNNER_TEMP/extra/fabric-api.jar" mc/${{ matrix.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-sodium-fabric/"
          SMOKE_TIMEOUT=480 ci/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-sodium-fabric" "$RUNNER_TEMP/extra-sodium-fabric" || true
          grep -A300 "== " "$RUNNER_TEMP/client-sodium-fabric/run/logs/fabric-bridge-report.txt" || true
          grep -n -m 80 -E "FABRICATED-TEST frapi|Sodium|Iris|/(ERROR|FATAL)\]" "$RUNNER_TEMP/client-sodium-fabric/run/logs/latest.log" || true
      - name: Upload Sodium client run logs and report
        if: always() && startsWith(matrix.minecraft, '26.')
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-sodium-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/client-sodium/run/logs
            ${{ runner.temp }}/client-sodium/run/crash-reports
            ${{ runner.temp }}/client-sodium/client.out
            ${{ runner.temp }}/client-sodium/thread-dump.txt
            ${{ runner.temp }}/client-sodium-fabric/run/logs
            ${{ runner.temp }}/client-sodium-fabric/run/crash-reports
            ${{ runner.temp }}/client-sodium-fabric/client.out
          if-no-files-found: ignore
      # Popular Fabric mods from Modrinth (ci/mod-corpus.txt, downloaded here in CI and checked against Modrinth's
      # SHA-512), loaded together with Fabric API: shows which load, which are disabled and why. Informational.
      - name: Fetch the mod corpus
        id: corpus
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/corpus"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/corpus/"
      - name: Server with the mod corpus (informational)
        if: always() && steps.corpus.outcome == 'success'
        continue-on-error: true
        run: ci/smoke-server.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/server-corpus" "$RUNNER_TEMP/corpus" || true
      - name: Client with the mod corpus (informational)
        if: always() && steps.corpus.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SMOKE_TIMEOUT=600 ci/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-corpus" "$RUNNER_TEMP/corpus" || true
          grep -A400 "== " "$RUNNER_TEMP/client-corpus/run/logs/fabric-bridge-report.txt" || true
      - name: Upload mod corpus logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/server-corpus/logs
            ${{ runner.temp }}/server-corpus/server.out
            ${{ runner.temp }}/client-corpus/run/logs
            ${{ runner.temp }}/client-corpus/run/crash-reports
            ${{ runner.temp }}/client-corpus/client.out
          if-no-files-found: ignore
      - name: Upload Fabricated jar
        uses: actions/upload-artifact@v4
        with:
          name: fabricated-mc${{ matrix.minecraft }}
          path: build/libs/fabricated-*+mc${{ matrix.minecraft }}.jar
