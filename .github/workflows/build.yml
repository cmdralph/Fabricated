            fi
          }
          check "frapi model plugin OK" "a Fabric model loading plugin replaced a block state's model after it was baked"
          check "frapi model plugin part OK" "a Fabric model loading plugin saw a model baked as a block state's part after it was baked (MODEL-4)"
          check "frapi terrain OK .*seam=Fabricated" "a Fabric block model was meshed into a chunk section, sent to Fabric's renderer by Fabricated's seam"
          check "frapi nested terrain OK .*seam=Fabricated" "a Fabric model inside a vanilla multipart model was meshed, through Fabricated's seam"
          check "frapi moving block OK" "a falling Fabric block model was drawn"
          check "frapi piston OK" "a Fabric block model a piston moved was drawn"
          check "frapi breaking OK" "a Fabric block model got the breaking overlay"
          # R3: a Fabric item model (no vanilla adapter) drawn by Indigo wherever the game draws items.
          check "frapi item screen OK" "a Fabric item model was drawn in the hotbar"
          check "frapi item hand OK" "a Fabric item model was drawn in the player's hand"
          check "frapi item dropped OK" "a Fabric item model was drawn as a dropped item"
          check "frapi item frame OK" "a Fabric item model was drawn in an item frame"
          check "frapi broken model fallback OK" "a Fabric model that threw in a chunk section was drawn by NeoForge's renderer from its quads (FRAPI rule 8)"
          check "frapi broken part fallback OK" "a multipart model whose Fabric part threw was drawn by NeoForge's renderer (FRAPI rule 8)"
          check "frapi wrapped model fallback OK" "a block whose Fabric model wraps one that threw was drawn by NeoForge's renderer that time, from its quads (FRAPI rule 8)"
          check "frapi wrapper kept OK" "a Fabric model wrapping one that threw kept Fabric's renderer: the throw was the wrapped model's (FRAPI rule 8, Continuity)"
          for model in BrokenModel BrokenPartModel; do
            count=$(grep -c "Fabric block models of class [^ ]*\$$model (.*) threw while drawn in" "$log" || true)
            if [ "$count" = 1 ]; then
              echo "PASS: the failure of $model was logged once"
            else
              echo "::error::FAIL: the failure of $model was logged $count times, not once"
              failed=1
            fi
          done
          # A throw inside a wrapper (Continuity's models wrap others) is the wrapped model's: logged once, naming the wrapper,
          # whose class is not marked broken.
          count=$(grep -c "A model wrapped by a Fabric block model of class [^ ]*\$WrapperCheckModel (.*) threw while drawn in" "$log" || true)
          if [ "$count" = 1 ]; then
            echo "PASS: the wrapped model's failure was logged once, naming its wrapper"
          else
            echo "::error::FAIL: the wrapped model's failure was logged $count times, not once"
            failed=1
          fi
          if grep -h "Fabric block models of class [^ ]*\$WrapperCheckModel (" "$log"; then
            echo "::error::FAIL: the wrapper's class was marked broken for a throw of the model it wraps"
            failed=1
          fi
          if grep -q "threw while drawn in" "$RUNNER_TEMP/client-fapi/run/logs/fabric-bridge-report.txt"; then
            echo "PASS: the report lists the failure"
          else
            echo "::error::FAIL: the report doesn't list the broken model's failure"
            failed=1
          fi
          if grep -h "FABRICATED-TEST frapi leaked transform FAILED" "$log"; then
            echo "::error::FAIL: a transform a broken model left pushed reached another block"
            failed=1
          fi
          if [ "$failed" = 1 ]; then
            grep -n -m 40 -E "model.loading|frapi|FabricBlockRendering|SectionCompiler|Indigo|indigo|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      # Fabric's model loading and renderer APIs on 1.21.11: a model file of a Fabric type must be read by the test
      # mod's Fabric deserializer, the baked extra models reach the model manager (CORPUS-6), and Fabric block models,
      # alone and inside a vanilla multipart model, are meshed into chunk sections. A gate.
      - name: Fabric model loading and renderer APIs (1.21.11)
        if: ${{ matrix.part == 'client' && !cancelled() && steps.build.outcome == 'success' && matrix.target.minecraft == '1.21.11' }}
        run: |
          log="$RUNNER_TEMP/client-fapi/run/logs/latest.log"
          failed=0
          check() {
            if grep -h "FABRICATED-TEST $1" "$log"; then
              echo "PASS: $2"
            else
              echo "::error::FAIL: $2 (no \"$1\" line)"
              failed=1
            fi
          }
          check "model deserializer OK" "a model file of a Fabric type was read by its Fabric deserializer"
          check "extra models handed to the model manager OK" "the baked extra models reached the model manager (upstream's hook can't apply)"
          check "frapi terrain OK .*seam=Fabricated" "a Fabric block model was meshed into a chunk section, sent to Fabric's renderer by Fabricated's seam"
          check "frapi nested terrain OK .*seam=Fabricated" "a Fabric model inside a vanilla multipart model was meshed, through Fabricated's seam"
          check "frapi level-aware default OK" "a NeoForge model inside a Fabric model got the chunk section's level from Fabric's renderer"
          check "frapi baked colors OK" "a NeoForge quad's baked colour reached Fabric's renderer"
          check "frapi NeoForge parts OK" "NeoForge's level-aware parts of a Fabric model are made from its quads, baked colour kept"
          check "frapi moving block OK" "a falling Fabric block model was drawn as a moving block (from those parts)"
          check "frapi breaking OK" "a Fabric block model got the breaking overlay"
          # R3: the quads a Fabric item model emits into its layer, drawn by Fabric's renderer (its render type getter asked).
          check "frapi item screen OK" "a Fabric item model's emitted quads were drawn in the hotbar"
          check "frapi item hand OK" "a Fabric item model's emitted quads were drawn in the player's hand"
          check "frapi item dropped OK" "a Fabric item model's emitted quads were drawn as a dropped item"
          check "frapi item frame OK" "a Fabric item model's emitted quads were drawn in an item frame"
          # FRAPI rule 8: a Fabric model that throws in a chunk section (alone, or as a multipart model's part) fails alone.
          # NeoForge's renderer draws it from its parts, Fabricated logs it once and lists it in the report, and the
          # transform it left pushed never reaches another block.
          check "frapi broken model fallback OK" "a Fabric model that threw in a chunk section was drawn by NeoForge's renderer from its parts (FRAPI rule 8)"
          check "frapi broken part fallback OK" "a multipart model whose Fabric part threw was drawn by NeoForge's renderer (FRAPI rule 8)"
          # The wrapper isn't marked, so NeoForge's renderer gets the parts made from its quads for that block (the wrapped
          # model, which throws once, no longer throws there): no fallback line of the wrapped model's own.
          check "frapi wrapper kept OK" "a Fabric model wrapping one that threw kept Fabric's renderer: the throw was the wrapped model's (FRAPI rule 8, Continuity)"
          for model in BrokenModel BrokenPartModel; do
            count=$(grep -c "Fabric block models of class [^ ]*\$$model (.*) threw while drawn in" "$log" || true)
            if [ "$count" = 1 ]; then
              echo "PASS: the failure of $model was logged once"
            else
              echo "::error::FAIL: the failure of $model was logged $count times, not once"
              failed=1
            fi
          done
          # A throw inside a wrapper (Continuity's models wrap others) is the wrapped model's: logged once, naming the wrapper,
          # whose class is not marked broken.
          count=$(grep -c "A model wrapped by a Fabric block model of class [^ ]*\$WrapperCheckModel (.*) threw while drawn in" "$log" || true)
          if [ "$count" = 1 ]; then
            echo "PASS: the wrapped model's failure was logged once, naming its wrapper"
          else
            echo "::error::FAIL: the wrapped model's failure was logged $count times, not once"
            failed=1
          fi
          if grep -h "Fabric block models of class [^ ]*\$WrapperCheckModel (" "$log"; then
            echo "::error::FAIL: the wrapper's class was marked broken for a throw of the model it wraps"
            failed=1
          fi
          if grep -q "threw while drawn in" "$RUNNER_TEMP/client-fapi/run/logs/fabric-bridge-report.txt"; then
            echo "PASS: the report lists the failure"
          else
            echo "::error::FAIL: the report doesn't list the broken model's failure"
            failed=1
          fi
          if grep -h "FABRICATED-TEST frapi leaked transform FAILED" "$log"; then
            echo "::error::FAIL: a transform a broken model left pushed reached another block"
            failed=1
          fi
          if [ "$failed" = 1 ]; then
            grep -n -m 30 -E "model.loading|ModelManager|frapi|FabricBlockRendering|SectionCompiler|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      # Sodium for NeoForge 1.21.11 meshes chunk sections itself and has no Fabric renderer, though its metadata says it has
      # one: Fabricated registers Indigo once the client initializers ran, and Sodium draws a Fabric block model from the
      # parts Fabricated makes from its quads. Informational until it has passed.
      - name: Client with Sodium for NeoForge (informational, 1.21.11)
        if: ${{ matrix.part == 'mods' && env.EXTENDED == 'true' && !cancelled() && steps.build.outcome == 'success' && matrix.target.minecraft == '1.21.11' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-sodium"
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/extra-sodium" neoforge sodium || true
          if ! ls "$RUNNER_TEMP"/extra-sodium/sodium*.jar >/dev/null 2>&1; then
            echo "Modrinth has no Sodium for NeoForge ${{ matrix.target.minecraft }} build: nothing to run"
            exit 0
          fi
          cp "$RUNNER_TEMP/extra/fabric-api.jar" mc/neoforge/${{ matrix.target.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-sodium/"
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-sodium" "$RUNNER_TEMP/extra-sodium" || true
          log="$RUNNER_TEMP/client-sodium/run/logs/latest.log"
          for check in "Fabric API's own renderer (Indigo) is used" "FABRICATED-TEST frapi NeoForge parts OK" "FABRICATED-TEST frapi terrain OK .*LevelSlice" \
              "FABRICATED-TEST frapi nested terrain OK .*LevelSlice" "FABRICATED-TEST frapi level-aware default OK"; do
            if grep -h -m 1 "$check" "$log"; then echo "PASS: $check"; else echo "::warning::Sodium 1.21.11: no \"$check\" line"; fi
          done
      # The pair whose shared package once stopped the game on 1.21.1 (PROVIDER-1): Forgified Fabric API's modules and
      # Sodium for NeoForge, with Fabric API's official jar for Fabricated's Fabric mods. Informational.
      - name: Client with Forgified Fabric API and Sodium for NeoForge (informational, 1.21.1)
        if: ${{ matrix.part == 'mods' && env.EXTENDED == 'true' && !cancelled() && steps.build.outcome == 'success' && matrix.target.minecraft == '1.21.1' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-coexist"
