name: Build and test

# A branch with a pull request is built once, as the pull request (merged with its base): a push event too would build
# every commit twice. Every branch holds every platform; this builds NeoForge's targets (mc/neoforge), for pushes and
# pull requests to main. The forge and forge-legacy branches build their platform through their own workflow, for pull
# requests to them only (owner decision D6). Changes to documentation alone build nothing (the game runs check code, not
# prose), nor do changes to another platform's folders alone.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'mc/forge/**'
      - 'mc/forge-legacy/**'
      - 'mc/platform-forge.gradle'
      - 'mc/platform-forge-legacy.gradle'
      - 'loader/forge/**'
      - 'loader/forge-legacy/**'
      - 'ci/forge/**'
      - 'ci/forge-legacy/**'
      - '.github/workflows/build-forge.yml'
      - '.github/workflows/build-forge-legacy.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/branch-readme.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'mc/forge/**'
      - 'mc/forge-legacy/**'
      - 'mc/platform-forge.gradle'
      - 'mc/platform-forge-legacy.gradle'
      - 'loader/forge/**'
      - 'loader/forge-legacy/**'
      - 'ci/forge/**'
      - 'ci/forge-legacy/**'
      - '.github/workflows/build-forge.yml'
      - '.github/workflows/build-forge-legacy.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/branch-readme.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Minecraft-independent modules
        run: ./gradlew -Pfabricated.coreOnly=true build --stacktrace
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/build/reports/tests
            fabric-loader-api/build/reports/tests
          if-no-files-found: ignore

  minecraft:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    # A job takes 20 to 30 minutes; a hung game run is stopped at its own timeout, and this bounds anything else.
    timeout-minutes: 75
    needs: core
    # A version whose NeoForge line is still in beta is marked experimental: its job is best-effort and does not fail
    # the workflow. None is now (NeoForge tagged 26.3.0-stable).
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.11"
            fabric_api: "0.141.6+1.21.11"
            neoforge: "21.11.45"
            # Modrinth version ids of the mods reading plugins (no WTHIT build for 26.3).
            plugin_hosts: "jei@Sb3olMoE rei@p0bsGl2I jade@LDFqgwEA wthit@9kLa6aJn simple-voice-chat@q4sBpZd2"
            java: 21
            experimental: false
          - minecraft: "26.1.2"
            fabric_api: "0.155.3+26.1.2"
            neoforge: "26.1.2.116"
            # Modrinth version ids of the mods reading plugins (no WTHIT build for 26.3).
            plugin_hosts: "jei@NiYfNYIM rei@isd1MxO2 jade@Pr1h4azo wthit@86roxNra simple-voice-chat@ux2lghIT"
            java: 25
            experimental: false
          - minecraft: "26.2"
            fabric_api: "0.161.0+26.2"
            neoforge: "26.2.0.90"
            # Modrinth version ids of the mods reading plugins (no WTHIT build for 26.3).
            plugin_hosts: "jei@JMEYi0NN rei@BoY0Dky0 jade@GBES6etT wthit@nYkvtEUa simple-voice-chat@xNwwyLuz"
            java: 25
            experimental: false
          - minecraft: "26.3"
            fabric_api: "0.164.0+26.3"
            neoforge: "26.3.0.95"
            # Modrinth version ids of the mods reading plugins (no WTHIT build for 26.3).
            plugin_hosts: "jei@3EynCW85 rei@uwE0PJmc jade@dVB8U7Td simple-voice-chat@3rpCvvMZ"
            java: 25
            experimental: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabricated and test mods
        id: build
        run: >
          ./gradlew :mc:neoforge-${{ matrix.minecraft }}:fabricatedJar :mc:neoforge-${{ matrix.minecraft }}:testmods --stacktrace
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Select Java ${{ matrix.java }} for the server
        run: echo "JAVA_HOME=$JAVA_HOME_${{ matrix.java }}_X64" >> "$GITHUB_ENV" && echo "$JAVA_HOME_${{ matrix.java }}_X64/bin" >> "$GITHUB_PATH"
      - name: Server smoke test (test mods only)
        run: ci/neoforge/smoke-server.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/server"
      - name: Upload server logs and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/server/logs
            ${{ runner.temp }}/server/server.out
            ${{ runner.temp }}/server/.fabricated/cache/v1/index.json
          if-no-files-found: ignore
      # NeoForge's internals change between builds of one Minecraft version, and Fabricated accepts every build of it,
      # so the test mods also boot on the newest build (informational: it can break for reasons of its own).
      - name: Server smoke test on the newest NeoForge build (informational)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          pinned="${{ matrix.neoforge }}"
          newest=$(curl -fsSL --retry 4 https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | python3 -c '
          import re, sys
          builds = [v for v in re.findall(r"<version>([^<]+)</version>", sys.stdin.read()) if v.startswith(sys.argv[1])]
          print(builds[-1] if builds else "")' "${pinned%.*}.")
          echo "Newest NeoForge build for ${{ matrix.minecraft }}: ${newest:-none} (pinned: $pinned)" | tee "$RUNNER_TEMP/summary-newest.txt"
          if [ -z "$newest" ] || [ "$newest" = "$pinned" ]; then exit 0; fi
          set -o pipefail
          ci/neoforge/smoke-server.sh "${{ matrix.minecraft }}" "$newest" "$RUNNER_TEMP/server-newest" | tee -a "$RUNNER_TEMP/summary-newest.txt"
      # Boot again with the official Fabric API jar (downloaded here in CI, never by Fabricated) and keep the
      # report, which lists every pass-through module and mixin pre-flight result. The server must start;
      # the other checks in this run are informational.
      - name: Server smoke test with Fabric API (server must start)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/extra/fabric-api.jar" \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${{ matrix.fabric_api }}/fabric-api-${{ matrix.fabric_api }}.jar"
          # Team Reborn's energy library (Fabric tech mods' energy API), for the energy bridge's check below.
          mkdir -p "$RUNNER_TEMP/energy"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/energy" fabric team-reborn-energy || true
          # Without a build of its own, the one a Fabric tech mod ships inside its jar.
          if ! ls "$RUNNER_TEMP"/energy/*.jar >/dev/null 2>&1; then
            python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/energy-hosts" fabric techreborn modern-industrialization || true
            python3 ci/nested-jar.py team_reborn_energy "$RUNNER_TEMP/energy" "$RUNNER_TEMP"/energy-hosts/*.jar > "$RUNNER_TEMP/energy-source.txt" || true
          fi
          cp "$RUNNER_TEMP"/energy/*.jar "$RUNNER_TEMP/extra/" 2>/dev/null || true
          ci/neoforge/smoke-server.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/server-fapi" "$RUNNER_TEMP/extra"
      - name: Energy bridge with Team Reborn's library
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # Also recorded for the summary step at the end of the log.
          if ! ls "$RUNNER_TEMP"/energy/*.jar >/dev/null 2>&1; then
            echo "Energy: no Team Reborn Energy build for ${{ matrix.minecraft }} on Modrinth, of its own or in Tech Reborn or Modern Industrialization, nothing checked" | tee "$RUNNER_TEMP/summary-energy.txt"
            exit 0
          fi
          { cat "$RUNNER_TEMP/energy-source.txt" 2>/dev/null || ls "$RUNNER_TEMP"/energy/; } | tee "$RUNNER_TEMP/summary-energy.txt"
          if grep -h "FABRICATED-TEST energy OK" "$RUNNER_TEMP/server-fapi/server.out" | tee -a "$RUNNER_TEMP/summary-energy.txt"; then
            echo "PASS: energy moves both ways between Team Reborn's API and NeoForge's capability"
          else
            grep -h -E "FABRICATED-TEST energy|team_reborn_energy" "$RUNNER_TEMP/server-fapi/server.out" | head -8 | tee -a "$RUNNER_TEMP/summary-energy.txt" || true
            echo "::error::FAIL: the energy bridge check did not pass"
            exit 1
          fi
      - name: Upload Fabric API run logs and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-fabric-api-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/server-fapi/logs
            ${{ runner.temp }}/server-fapi/server.out
          if-no-files-found: ignore
      # Client: a real NeoForge client started headlessly (Xvfb), which joins a singleplayer world.
      # 26.3+ open their window with SDL3 over EGL, which needs Mesa's EGL library (not on the runner image).
      - name: Install Mesa EGL for the client
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Client smoke test (test mods, singleplayer world)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ci/neoforge/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client" | tee "$RUNNER_TEMP/summary-client.txt"
      - name: Upload client logs and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/client/run/logs
            ${{ runner.temp }}/client/run/crash-reports
            ${{ runner.temp }}/client/client.out
            ${{ runner.temp }}/client/thread-dump.txt
          if-no-files-found: ignore
      # The same client with the official Fabric API jar: shows which client-side modules load and whether the game
      # still reaches a world. Informational until every client module is accounted for.
      - name: Client smoke test with Fabric API (informational)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # On 26.x the test mod for Fabric's renderer API joins this run (it needs the renderer API, which only the
        # Fabric API jar provides).
        run: |
          mkdir -p "$RUNNER_TEMP/extra-client"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-client/"
          cp mc/neoforge/${{ matrix.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-client/" 2>/dev/null || true
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-fapi" "$RUNNER_TEMP/extra-client" || true
          grep -A200 "== " "$RUNNER_TEMP/client-fapi/run/logs/fabric-bridge-report.txt" || true
      # A Fabric model (its own emitQuads) must be drawn in the world: Fabricated sends it through Fabric's renderer when
      # its chunk section is meshed. This check is a gate, unlike the run above.
      - name: Fabric renderer API and model formats (26.x)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.') }}
        run: |
          log="$RUNNER_TEMP/client-fapi/run/logs/latest.log"
          failed=0
          check() {
            if grep -h "FABRICATED-TEST $1" "$log"; then
              echo "PASS: $2"
            else
              echo "::error::FAIL: $2 (no \"$1\" line)"
              failed=1
            fi
          }
          check "frapi terrain OK" "a Fabric block model was meshed into a chunk section"
          check "frapi nested terrain OK" "a Fabric model inside a vanilla multipart model was meshed"
          check "frapi moving block OK" "a falling Fabric block model was drawn as a moving block"
          # 26.1.2 draws no outline around moving blocks.
          if [ "${{ matrix.minecraft }}" != "26.1.2" ]; then
            check "frapi moving block outline OK" "a glowing falling Fabric block model's outline was drawn by Fabric's renderer (M2b)"
          fi
          check "frapi baked colors OK" "a NeoForge quad's baked colour reached Fabric's renderer (FRAPI-2)"
          check "frapi baked quad constructor hook OK" "a mixin at the end of BakedQuad's vanilla constructor ran for NeoForge's block quads (pre-flight repair)"
          check "frapi breaking OK" "a Fabric block model got the breaking overlay"
          check "frapi level-aware default OK" "a NeoForge model inside a Fabric model got the chunk section's level from Fabric's renderer"
          check "model deserializer OK" "a model file of a Fabric type was read by its Fabric deserializer"
          check "neoforge blockstate type OK" "a blockstate of NeoForge's composite type still loads with Fabric's model loading"
          if [ "$failed" = 1 ]; then
            grep -n -m 40 -E "frapi|FabricBlockRendering|RenderMixin|SectionCompiler|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      # Fabric API's client modules most client mods use, passed through from the Fabric API jar: the test mod's key
      # mapping must be in the game's options, its HUD elements drawn (one attached after chat, from NeoForge's HUD
      # layer, one added last), a screen's init and draw events fired (the draw event from NeoForge's screen render
      # events) and its client commands registered on joining the world. A gate.
      - name: Fabric API client modules (26.x)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.') }}
        run: |
          log="$RUNNER_TEMP/client-fapi/run/logs/latest.log"
          failed=0
          check() {
            if grep -h "FABRICATED-TEST $1" "$log"; then
              echo "PASS: $2"
            else
              echo "::error::FAIL: $2 (no \"$1\" line)"
              failed=1
            fi
          }
          check "key mapping OK" "a Fabric key mapping is in the game's options"
          check "hud element OK" "a Fabric HUD element added last was drawn (upstream's subtitle overlay mixin)"
          check "hud element after chat OK" "a Fabric HUD element attached after chat was drawn (from NeoForge's chat layer)"
          check "screen init event OK" "a screen's initialization fired Fabric's event"
          check "screen draw event OK" "a screen's drawing fired Fabric's event"
          check "client commands OK" "Fabric's client commands were registered on joining the world"
          check "client stopping OK" "Fabric's CLIENT_STOPPING fired as the game stopped"
          if [ "$failed" = 1 ]; then
            grep -n -m 40 -E "testmod_frapi|HudBridge|ScreenRenderBridge|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      # Fabric's model loading and renderer APIs on 1.21.11: a model file of a Fabric type must be read by the test
      # mod's Fabric deserializer, the baked extra models reach the model manager (CORPUS-6), and Fabric block models,
      # alone and inside a vanilla multipart model, are meshed into chunk sections. A gate.
      - name: Fabric model loading and renderer APIs (1.21.11)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.minecraft == '1.21.11' }}
        run: |
          log="$RUNNER_TEMP/client-fapi/run/logs/latest.log"
          failed=0
          check() {
            if grep -h "FABRICATED-TEST $1" "$log"; then
              echo "PASS: $2"
            else
              echo "::error::FAIL: $2 (no \"$1\" line)"
              failed=1
            fi
          }
          check "model deserializer OK" "a model file of a Fabric type was read by its Fabric deserializer"
          check "extra models handed to the model manager OK" "the baked extra models reached the model manager (upstream's hook can't apply)"
          check "frapi terrain OK" "a Fabric block model was meshed into a chunk section"
          check "frapi nested terrain OK" "a Fabric model inside a vanilla multipart model was meshed"
          check "frapi level-aware default OK" "a NeoForge model inside a Fabric model got the chunk section's level from Fabric's renderer"
          check "frapi baked colors OK" "a NeoForge quad's baked colour reached Fabric's renderer"
          check "frapi NeoForge parts OK" "NeoForge's level-aware parts of a Fabric model are made from its quads, baked colour kept"
          check "frapi moving block OK" "a falling Fabric block model was drawn as a moving block (from those parts)"
          check "frapi breaking OK" "a Fabric block model got the breaking overlay"
          if [ "$failed" = 1 ]; then
            grep -n -m 30 -E "model.loading|ModelManager|frapi|FabricBlockRendering|SectionCompiler|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      # Sodium for NeoForge 1.21.11 meshes chunk sections itself and has no Fabric renderer, though its metadata says it has
      # one: Fabricated registers Indigo once the client initializers ran, and Sodium draws a Fabric block model from the
      # parts Fabricated makes from its quads. Informational until it has passed.
      - name: Client with Sodium for NeoForge (informational, 1.21.11)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.minecraft == '1.21.11' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-sodium"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-sodium" neoforge sodium || true
          if ! ls "$RUNNER_TEMP"/extra-sodium/sodium*.jar >/dev/null 2>&1; then
            echo "Modrinth has no Sodium for NeoForge ${{ matrix.minecraft }} build: nothing to run"
            exit 0
          fi
          cp "$RUNNER_TEMP/extra/fabric-api.jar" mc/neoforge/${{ matrix.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-sodium/"
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-sodium" "$RUNNER_TEMP/extra-sodium" || true
          log="$RUNNER_TEMP/client-sodium/run/logs/latest.log"
          for check in "Fabric API's own renderer (Indigo) is used" "FABRICATED-TEST frapi NeoForge parts OK" "FABRICATED-TEST frapi terrain OK .*LevelSlice" \
              "FABRICATED-TEST frapi nested terrain OK .*LevelSlice" "FABRICATED-TEST frapi level-aware default OK"; do
            if grep -h -m 1 "$check" "$log"; then echo "PASS: $check"; else echo "::warning::Sodium 1.21.11: no \"$check\" line"; fi
          done
      - name: Upload Fabric API client run logs and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-fabric-api-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/client-fapi/run/logs
            ${{ runner.temp }}/client-fapi/run/crash-reports
            ${{ runner.temp }}/client-fapi/client.out
            ${{ runner.temp }}/client-fapi/thread-dump.txt
          if-no-files-found: ignore
      # Sodium and Iris for NeoForge (downloaded here from Modrinth, never redistributed) with Fabric API and the test
      # mod for Fabric's renderer API: Sodium meshes the world through its own Fabric renderer, which must draw Fabric
      # models, and Fabric API's default renderer must stand down for it.
      - name: Client smoke test with Sodium and Iris for NeoForge (26.x)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-sodium"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-sodium" neoforge sodium iris
          cp "$RUNNER_TEMP/extra/fabric-api.jar" mc/neoforge/${{ matrix.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-sodium/"
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-sodium" "$RUNNER_TEMP/extra-sodium" || true
          grep -A200 "== " "$RUNNER_TEMP/client-sodium/run/logs/fabric-bridge-report.txt" || true
      - name: Fabric models under Sodium (26.x)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.') }}
        env:
          MC: ${{ matrix.minecraft }}
        run: |
          if ! ls "$RUNNER_TEMP"/extra-sodium/sodium*.jar >/dev/null 2>&1; then
            echo "::warning::Modrinth has no Sodium for NeoForge $MC build: nothing to check"
            exit 0
          fi
          log="$RUNNER_TEMP/client-sodium/run/logs/latest.log"
          failed=0
          check() {
            if grep -h "$1" "$log"; then
              echo "PASS: $2"
            else
              echo "::error::FAIL: $2 (no \"$1\" line)"
              failed=1
            fi
          }
          check "Different rendering plugin detected; not applying Indigo" "Fabric API's default renderer stood down for Sodium's"
          check "FABRICATED-TEST frapi terrain OK .*LevelSlice" "Sodium meshed a Fabric block model through its Fabric renderer"
          check "FABRICATED-TEST frapi level-aware default OK" "a NeoForge model inside a Fabric model got Sodium's chunk section"
          check "FABRICATED-TEST frapi moving block OK" "a falling Fabric block model was drawn with Sodium's renderer"
          check "FABRICATED-TEST frapi breaking OK" "a Fabric block model got the breaking overlay with Sodium's renderer"
          if [ "$failed" = 1 ]; then
            grep -n -m 60 -E "frapi|Indigo|sodium|Sodium|iris|Iris|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      # The same mods with a shader pack (ci/neoforge/smoke-client.sh writes a minimal one): Iris's pipeline, with its extended
      # vertex format, under the Fabric models Sodium's Fabric renderer meshes. Informational until it has passed.
      - name: Client with Sodium, Iris and a shader pack (informational, 26.x)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.') }}
        continue-on-error: true
        run: |
          if ! ls "$RUNNER_TEMP"/extra-sodium/iris*.jar >/dev/null 2>&1; then
            echo "Modrinth has no Iris for NeoForge ${{ matrix.minecraft }} build: nothing to run"
            exit 0
          fi
          SMOKE_SHADERS=1 SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-shaders" "$RUNNER_TEMP/extra-sodium" || true
          grep -n -m 80 -E "FABRICATED-TEST frapi|[Ss]haderpack|shader pack|Iris|/(ERROR|FATAL)\]" "$RUNNER_TEMP/client-shaders/run/logs/latest.log" || true
      # The Fabric builds of Sodium and Iris, loaded on request (loadUnsupported) with Fabric API and the renderer API
      # test mod: informational, it records what breaks for the rendering-pipeline track (docs/roadmap.md).
      - name: Client with the Fabric builds of Sodium and Iris (informational, 26.x)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FABRICATED_MODS: '{"sodium": {"loadUnsupported": true}, "iris": {"loadUnsupported": true}}'
        run: |
          mkdir -p "$RUNNER_TEMP/extra-sodium-fabric"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-sodium-fabric" fabric sodium iris
          cp "$RUNNER_TEMP/extra/fabric-api.jar" mc/neoforge/${{ matrix.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-sodium-fabric/"
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-sodium-fabric" "$RUNNER_TEMP/extra-sodium-fabric" || true
          grep -A300 "== " "$RUNNER_TEMP/client-sodium-fabric/run/logs/fabric-bridge-report.txt" || true
          grep -n -m 80 -E "FABRICATED-TEST frapi|Sodium|Iris|/(ERROR|FATAL)\]" "$RUNNER_TEMP/client-sodium-fabric/run/logs/latest.log" || true
      # Fabric addons of Sodium (Sodium Extra, Reese's Sodium Options) next to Sodium for NeoForge, with Fabric API: their
      # mixins into Sodium are checked against Sodium for NeoForge's classes (R3), and they use Sodium's API from its
      # NeoForge build. The Fabric build of Sodium they depend on is skipped for the NeoForge one. Informational.
      - name: Client with Sodium for NeoForge and Fabric Sodium addons (informational, 26.x)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.minecraft, '26.') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls "$RUNNER_TEMP"/extra-sodium/sodium*.jar >/dev/null 2>&1; then
            echo "Modrinth has no Sodium for NeoForge ${{ matrix.minecraft }} build: nothing to run"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/extra-sodium-addons"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-sodium-addons" fabric sodium-extra reeses-sodium-options || true
          cp "$RUNNER_TEMP"/extra-sodium/sodium*.jar "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-sodium-addons/"
          ls -1 "$RUNNER_TEMP/extra-sodium-addons"
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-sodium-addons" "$RUNNER_TEMP/extra-sodium-addons" || true
      - name: Upload Sodium client run logs and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-sodium-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/client-sodium/run/logs
            ${{ runner.temp }}/client-sodium/run/crash-reports
            ${{ runner.temp }}/client-sodium/client.out
            ${{ runner.temp }}/client-sodium/thread-dump.txt
            ${{ runner.temp }}/client-sodium-fabric/run/logs
            ${{ runner.temp }}/client-sodium-fabric/run/crash-reports
            ${{ runner.temp }}/client-sodium-fabric/client.out
            ${{ runner.temp }}/client-sodium-addons/run/logs
            ${{ runner.temp }}/client-sodium-addons/run/crash-reports
            ${{ runner.temp }}/client-sodium-addons/client.out
            ${{ runner.temp }}/client-shaders/run/logs
            ${{ runner.temp }}/client-shaders/run/crash-reports
            ${{ runner.temp }}/client-shaders/client.out
          if-no-files-found: ignore
      # The Fabric-only Polyfrost stack (OneConfig, PolyPlus): no NeoForge build exists, so Fabricated is its only way
      # to NeoForge. Modrinth slugs and builds per version are UNVERIFIED; a missing one is reported and skipped.
      - name: Client with OneConfig and PolyPlus (informational)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-polyfrost"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-polyfrost" fabric oneconfig polyplus | tee "$RUNNER_TEMP/summary-polyfrost.txt"
          if ! grep -qE "^(oneconfig|polyplus): [^n]" "$RUNNER_TEMP/summary-polyfrost.txt"; then exit 0; fi
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-polyfrost/"
          # Polydium asks once, in the first world, whether to switch to Vulkan, and the world test waits for no screen to be
          # open: its own marker says it has asked.
          mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/polydium" && touch "${XDG_CONFIG_HOME:-$HOME/.config}/polydium/vulkan-prompt"
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-polyfrost" "$RUNNER_TEMP/extra-polyfrost" || true
          # The counts and the disabled mods, not the long list of loaded ones.
          awk '/^== /{show = /^== (Summary|Disabled)/} show' "$RUNNER_TEMP/client-polyfrost/run/logs/fabric-bridge-report.txt" | head -80 | tee -a "$RUNNER_TEMP/summary-polyfrost.txt" || true
          # Which modules serve the native libraries of jars without classes (Skiko's).
          grep -F "has no classes" "$RUNNER_TEMP/client-polyfrost/run/logs/fabric-bridge-report.txt" | head -10 | tee -a "$RUNNER_TEMP/summary-polyfrost.txt" || true
      - name: Upload Polyfrost client logs and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: client-polyfrost-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/client-polyfrost/run/logs
            ${{ runner.temp }}/client-polyfrost/run/crash-reports
            ${{ runner.temp }}/client-polyfrost/client.out
          if-no-files-found: ignore
      # The NeoForge builds of recipe viewers, tooltip mods and Simple Voice Chat (pinned per version), with the test
      # mod's plugins declared the Fabric way (as entrypoints, and WTHIT's plugin file): each must construct and call
      # its plugin.
      - name: Plugins for the NeoForge builds of other mods
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-viewers"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-viewers" neoforge ${{ matrix.plugin_hosts }} | tee viewers.txt
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-viewers" "$RUNNER_TEMP/extra-viewers" || true
          grep -A12 "== Plugins for other mods" "$RUNNER_TEMP/client-viewers/run/logs/fabric-bridge-report.txt" || true
          log="$RUNNER_TEMP/client-viewers/run/logs/latest.log"
          for host in ${{ matrix.plugin_hosts }}; do
            host="${host%@*}"
            for what in constructed called; do
              count=$(grep -c "FABRICATED-TEST $host plugin $what OK" "$log" 2>/dev/null || true)
              echo "$host plugin $what: ${count:-0} time(s)"
            done
          done | tee "$RUNNER_TEMP/summary-viewers.txt"
          grep -n -m 40 -E "/(ERROR|FATAL)\]" "$log" || true
          if grep -q ": 0 time(s)" "$RUNNER_TEMP/summary-viewers.txt"; then echo "FAIL: a mod did not construct or call the test mod's plugin"; exit 1; fi
      - name: Upload recipe viewer client logs and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: client-viewers-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/client-viewers/run/logs
            ${{ runner.temp }}/client-viewers/run/crash-reports
            ${{ runner.temp }}/client-viewers/client.out
          if-no-files-found: ignore
      # Popular Fabric mods from Modrinth (ci/mod-corpus.txt, downloaded here in CI and checked against Modrinth's
      # SHA-512), loaded together with Fabric API: shows which load, which are disabled and why. Informational.
      - name: Fetch the mod corpus
        id: corpus
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/corpus" | tee "$RUNNER_TEMP/corpus.txt"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/corpus/"
      - name: Server with the mod corpus (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        run: ci/neoforge/smoke-server.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/server-corpus" "$RUNNER_TEMP/corpus" || true
      - name: Client with the mod corpus (informational)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # CORPUS-2: Xaero's World Map stops the client on its first tick, so it runs alone below and the other mods
        # reach a world here.
        run: |
          mkdir -p "$RUNNER_TEMP/corpus-client"
          cp "$RUNNER_TEMP/corpus/"*.jar "$RUNNER_TEMP/corpus-client/"
          worldmap=$(sed -n 's/^xaeros-world-map: .* (\(.*\))$/\1/p' "$RUNNER_TEMP/corpus.txt")
          if [ -n "$worldmap" ]; then rm -f "$RUNNER_TEMP/corpus-client/$worldmap"; fi
          SMOKE_TIMEOUT=600 ci/neoforge/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-corpus" "$RUNNER_TEMP/corpus-client" || true
          grep -A400 "== " "$RUNNER_TEMP/client-corpus/run/logs/fabric-bridge-report.txt" || true
      - name: Client with Xaero's World Map alone (informational, CORPUS-2)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra-worldmap"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-worldmap" fabric xaeros-world-map
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-worldmap/"
          SMOKE_TIMEOUT=420 ci/neoforge/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-worldmap" "$RUNNER_TEMP/extra-worldmap" || true
      # malilib (MiniHUD's and Tweakeroo's library) adds its picture-in-picture renderers through the GUI renderer's map
      # NeoForge replaced, which Fabricated restores (PIP-1). On its own, with the compatibility plan's refusal lifted,
      # until it is verified.
      - name: Client with malilib, MiniHUD and Tweakeroo (informational, PIP-1)
        if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FABRICATED_MODS: '{"malilib": {"loadUnsupported": true}}'
        run: |
          mkdir -p "$RUNNER_TEMP/extra-malilib"
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/extra-malilib" fabric malilib fabric minihud fabric tweakeroo
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-malilib/"
          SMOKE_TIMEOUT=420 ci/neoforge/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-malilib" "$RUNNER_TEMP/extra-malilib" || true
      # Fabric mods with deep hooks (ci/mod-corpus-advanced.txt), on their own: one that stops the game can't hide how
      # the main corpus did.
      - name: Fetch the advanced mod corpus
        id: advanced
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python3 ci/fetch-corpus.py "${{ matrix.minecraft }}" "$RUNNER_TEMP/advanced" fabric $(sed -e '/^#/d' -e '/^$/d' ci/mod-corpus-advanced.txt) \
            | tee "$RUNNER_TEMP/summary-advanced.txt"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/advanced/"
          echo "::group::NeoForge biome and structure modifiers in the Fabric jars"
          python3 -I ci/neoforge-data.py "$RUNNER_TEMP"/advanced/*.jar | tee "$RUNNER_TEMP/summary-neoforge-data.txt" || true
          echo "::endgroup::"
      - name: Server with the advanced mod corpus (informational)
        if: ${{ !cancelled() && steps.advanced.outcome == 'success' }}
        continue-on-error: true
        run: ci/neoforge/smoke-server.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/server-advanced" "$RUNNER_TEMP/advanced" || true
      # CORPUS-32: what vanilla's BuiltInRegistries.freeze does, to a frozen registry too, and what Wover runs there.
      - name: Classes behind CORPUS-32 (informational, 26.3)
        if: ${{ !cancelled() && steps.advanced.outcome == 'success' && matrix.minecraft == '26.3' }}
        continue-on-error: true
        run: |
          game=$(find "$RUNNER_TEMP/server-advanced/libraries" -name 'minecraft-server-patched-*.jar' | head -n 1)
          echo "::group::BuiltInRegistries and MappedRegistry in $(basename "$game")"
          javap -p -c -classpath "$game" net.minecraft.core.registries.BuiltInRegistries \
            | awk '/ (bootStrap|freeze|createContents|bindBootstrappedTagsToEmpty)\(/,/^$/' || true
          javap -p -c -classpath "$game" net.minecraft.core.MappedRegistry \
            | awk '/ (bindAllTagsToEmpty|validateWrite|freeze)\(/,/^$/' || true
          echo "::endgroup::"
          for jar in "$RUNNER_TEMP"/advanced/wover*.jar; do
            for cls in $(unzip -Z1 "$jar" | grep -E '(BuiltInRegistriesFreezeMixin|DefinitionEventsImpl|CreativeTabManagerImpl)[^/]*\.class$'); do
              echo "::group::$(basename "$jar") $cls"
              javap -p -c -v -classpath "$jar" "$(echo "${cls%.class}" | tr / .)" | grep -vE '^ +#[0-9]+ = ' | head -n 250 || true
              echo "::endgroup::"
            done
          done
      - name: Client with the advanced mod corpus (informational)
        if: ${{ !cancelled() && steps.advanced.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: SMOKE_TIMEOUT=600 ci/neoforge/smoke-client.sh "${{ matrix.minecraft }}" "${{ matrix.neoforge }}" "$RUNNER_TEMP/client-advanced" "$RUNNER_TEMP/advanced" || true
      - name: Upload mod corpus logs and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.minecraft }}
          path: |
            ${{ runner.temp }}/server-corpus/logs
            ${{ runner.temp }}/server-corpus/server.out
            ${{ runner.temp }}/client-corpus/run/logs
            ${{ runner.temp }}/client-corpus/run/crash-reports
            ${{ runner.temp }}/client-corpus/client.out
            ${{ runner.temp }}/server-advanced/logs
            ${{ runner.temp }}/server-advanced/server.out
            ${{ runner.temp }}/client-advanced/run/logs
            ${{ runner.temp }}/client-advanced/run/crash-reports
            ${{ runner.temp }}/client-advanced/client.out
          if-no-files-found: ignore
      # The job log keeps only its end, so the informational runs' results are repeated here, last.
      - name: Summary of the informational runs
        if: ${{ !cancelled() }}
        run: |
          # A log's errors as the game ran, with the stacks of the most frequent: a mod that loads may still fail when its code runs.
          digest() { python3 ci/log-digest.py "$1" || true; }
          [ -f "$RUNNER_TEMP/summary-energy.txt" ] && { echo "== summary-energy"; cut -c1-300 "$RUNNER_TEMP/summary-energy.txt"; }
          # The gated client's failed checks, when it has any (the job log may no longer hold them).
          grep -q "^FAIL" "$RUNNER_TEMP/summary-client.txt" 2>/dev/null && { echo "== summary-client"; grep "^FAIL" "$RUNNER_TEMP/summary-client.txt" | head -40 | cut -c1-300; }
          for f in summary-newest summary-viewers; do
            [ -f "$RUNNER_TEMP/$f.txt" ] && { echo "== $f"; grep -E "^(Newest|PASS|FAIL|WARN)|plugin|not in this run" "$RUNNER_TEMP/$f.txt" | head -60; }
          done
          [ -f "$RUNNER_TEMP/summary-polyfrost.txt" ] && { echo "== summary-polyfrost"; head -60 "$RUNNER_TEMP/summary-polyfrost.txt" | cut -c1-300; }
          [ -f viewers.txt ] && { echo "== viewers fetched"; cat viewers.txt; }
          [ -f "$RUNNER_TEMP/summary-advanced.txt" ] && { echo "== advanced corpus fetched"; cut -c1-200 "$RUNNER_TEMP/summary-advanced.txt"; }
          [ -f "$RUNNER_TEMP/summary-neoforge-data.txt" ] && { echo "== NeoForge biome and structure modifiers in the advanced corpus's Fabric jars"; head -40 "$RUNNER_TEMP/summary-neoforge-data.txt"; }
          for run in client client-fapi client-sodium client-shaders client-sodium-fabric client-sodium-addons client-viewers client-polyfrost client-corpus client-worldmap client-malilib client-advanced; do
            log="$RUNNER_TEMP/$run/run/logs/latest.log"
            if [ ! -f "$log" ]; then
              # The game never started (the launcher stopped first): what the launcher said last.
              [ -f "$RUNNER_TEMP/$run/client.out" ] && { echo "== $run (no game log; the launcher's last lines)"; tail -n 30 "$RUNNER_TEMP/$run/client.out" | cut -c1-300; }
              continue
            fi
            echo "== $run"
            grep -h -m 20 -E "FABRICATED-TEST frapi|Caused by|Exception in|crash report|Fabric API's own renderer" "$log" || true
            # The test mod's own failed checks and its informational lines (far up the log by now).
            grep -h -m 12 -E "FABRICATED-TEST (.*FAILED|library modules|networking join event)" "$log" | cut -c1-400 || true
            # Whether Iris loaded the shader pack, and drew with it (Iris's own lines).
            if [ "$run" = client-shaders ]; then
              grep -h -m 8 -i -E "shaderpack|shaders are disabled|shader rendering pipeline" "$log" | cut -c1-300 || true
            fi
            # NeoForge's loading warnings (the runs with extra mods don't show them on a screen).
            grep -h -m 1 -A 6 "Mods loaded with .* warning" "$log" | cut -c1-300 || true
            # Why pre-flight disabled mods, in full from Fabricated's report (the warnings above are cut short).
            report="$RUNNER_TEMP/$run/run/logs/fabric-bridge-report.txt"
            [ -f "$report" ] && awk '/^== Mixin pre-flight failures ==/ { show = 1; next } /^$/ { show = 0 } show' "$report" | head -24 | cut -c1-700
            # The corpus: every disabled mod with its reason (one line each), and code that reaches for Fabric Loader
            # internals Fabricated doesn't provide (deep hooks that would fail when they run).
            if { [ "$run" = client-corpus ] || [ "$run" = client-advanced ] || [ "$run" = client-malilib ] || [ "$run" = client-sodium-addons ]; } && [ -f "$report" ]; then
              echo "-- disabled mods:"
              awk '/^== Disabled Fabric mods/ { show = 1; next } /^$/ { show = 0 } show && /^  [^ ]/ { id = $1 } show && /^      / && !/^      Fix:/ && id { print "  " id ": " substr($0, 7); id = "" }' "$report" | cut -c1-260
              echo "-- Fabric Loader references Fabricated doesn't provide:"
              awk '/^== Linkage warnings/ { show = 1; next } /^$/ { show = 0 } show' "$report" | grep -E "missing [a-z]+ net\.fabricmc\.(loader|api)\." | head -30 | cut -c1-300
              echo "-- loaded without some of their mixins (LEAVE-1):"
              awk '/^== Mixins left out/ { show = 1; next } /^$/ { show = 0 } show' "$report" | cut -c1-260 | head -40
              digest "$log"
            fi
            # The addons run: which Fabric mods loaded (the step's own listing of the jars is far up the log).
            if [ "$run" = client-sodium-addons ] && [ -f "$report" ]; then
              echo "-- loaded Fabric mods, without Fabric API's modules:"
              awk '/^== Loaded Fabric mods/ { show = 1; next } /^(==|$)/ { show = 0 } show && /^  [^ ]/ && $1 !~ /^fabric/ { print "  " $1 " " $2 }' "$report" | head -20
            fi
            # Fabric API's own modules: what pre-flight left out of them (their configs with a plugin).
            if [ "$run" = client-fapi ] && [ -f "$report" ]; then
              awk '/^== Mixin pre-flight warnings ==/ { show = 1; next } /^$/ { show = 0 } show' "$report" | grep -E "^  fabric" | head -30 | cut -c1-500
            fi
            # A crash's description and errors, with the first stack frames.
            for report in $(ls "$RUNNER_TEMP/$run/run/crash-reports"/*.txt 2>/dev/null | head -1); do
              echo "-- $(basename "$report")"
              sed -n '/^Description:/,/^A detailed walkthrough/p' "$report" | grep -v "^A detailed" \
                | awk 'BEGIN { limit = 8 } /^Caused by:/ { frames = 0; limit = 12 } /^[ \t]+at / { if (++frames > limit) next } { print }' | head -60
              # A mod loading crash names its causes below the walkthrough (its issues' exceptions).
              if grep -q "^net.neoforged.fml.ModLoadingException" "$report"; then
                sed -n '/^A detailed walkthrough/,$p' "$report" | grep -E -A4 "^Caused by:|^\s*Exception message:" | grep -v "^--$" | head -40 | cut -c1-300
              fi
            done
            # A mixin that failed as Mixin applied it, though pre-flight passed it: what Fabricated's report says of it
            # (its notes and repairs), and of the classes those name (other mods' repairs there).
            failed=$(cat "$RUNNER_TEMP/$run/run/crash-reports"/*.txt 2>/dev/null | grep -o -m 1 -E "in [A-Za-z0-9_./-]+\.json:[A-Za-z0-9_.\$]+ from mod" | head -1 | sed -E 's/^in [^:]+:(.+) from mod$/\1/' || true)
            bridge="$RUNNER_TEMP/$run/run/logs/fabric-bridge-report.txt"
            if [ -n "$failed" ] && [ -f "$bridge" ]; then
              echo "-- the report on $failed:"
              grep -F "$failed" "$bridge" | head -12 | cut -c1-600 || true
              for class in $(grep -F "$failed" "$bridge" | grep -o -E "net\.minecraft\.[A-Za-z0-9_.\$]+" | sort -u | head -3 || true); do
                echo "-- the report on $class (other mixins):"
                grep -F "$class" "$bridge" | grep -v -F "$failed" | head -12 | cut -c1-600 || true
              done
              # The handler's annotations in the mod's jar, and the target methods' code in the game's jar.
              for crash in $(ls "$RUNNER_TEMP/$run/run/crash-reports"/*.txt 2>/dev/null | head -1); do
                python3 -I ci/mixin-diag.py "$crash" "$RUNNER_TEMP/$run" || true
              done
            fi
            [ -f "$RUNNER_TEMP/$run/stop-reason.txt" ] && { echo "-- stopped by CI on:"; cut -c1-300 "$RUNNER_TEMP/$run/stop-reason.txt"; }
            # A client that didn't reach a world: its first errors (without the narrator's and the offline account's,
            # which every run has), the log's last lines, and where its render thread was near the timeout.
            if ! grep -q "Successfully finished." "$log"; then
              echo "-- no world reached; first errors:"
              # Each with its exception and that exception's first frames.
              awk '
                state == 2 && /^[ \t]+at / { if (frames++ < 3) print "      " substr($0, 1, 200); next }
                state == 1 && !/^[ \t]+at / && !/^\[/ { print "    " substr($0, 1, 300); state = 2; frames = 0; next }
                { state = 0 }
                /\/(ERROR|FATAL)\]/ && !/[Nn]arrator|flite|401|TargetDataLine/ { if (n == 6) exit; n++; print substr($0, 1, 300); state = 1 }
              ' "$log"
              # An exception that left the game's main thread goes to the console only.
              grep -h -m 2 -A 8 "^Exception in thread" "$RUNNER_TEMP/$run/client.out" 2>/dev/null | cut -c1-250 || true
              # Which thread ended the game, and from where (the test mod's shutdown hook), without the JDK's own frames.
              awk '/^FABRICATED-TEST game ended/ { show = 1; print; next } show && /^\tat / { if ($0 !~ /java\.base\//) print; next } { show = 0 }' \
                "$RUNNER_TEMP/$run/client.out" 2>/dev/null | head -14 | cut -c1-250 || true
              # What the client showed half a minute into its world, and whether chunks arrived (the test mod).
              grep -h -m 1 "FABRICATED-TEST world state" "$log" | cut -c1-400 || true
              grep -h -m 1 "FABRICATED-TEST server state" "$log" | cut -c1-500 || true
              # The player's way into the integrated server, and out.
              grep -h -E "joined the game|left the game|lost connection|Saving and pausing|Failed to handle packet" "$log" | head -8 | cut -c1-300 || true
              # Who asked the game to stop, if anything did (the test mod).
              grep -h -m 1 -A 12 "FABRICATED-TEST game stop requested" "$log" | grep -v "java\.base/" | cut -c1-250 || true
              echo "-- last lines of the log:"
              grep -v "Waiting for player to load" "$log" | tail -n 4 | cut -c1-300
            fi
            dump="$RUNNER_TEMP/$run/thread-dump.txt"
            if [ -f "$dump" ]; then
              # The game's main threads, or the start of the dump when it has neither (jstack's own error, say).
              for thread in "Render thread" "Server thread"; do
                echo "-- $thread shortly before the timeout:"
                awk -v name="\"$thread\"" 'BEGIN { RS = "" } index($0, name) == 1' "$dump" | grep -E "^[[:space:]]+at " | head -15
              done
              grep -q -E '^"(Render|Server) thread"' "$dump" || head -n 5 "$dump"
            fi
          done
          # The corpora on a dedicated server: their errors as the game ran (the clients' above include their integrated
          # server's), and a server that didn't start: its crash and the log's last lines.
          for run in server-corpus server-advanced; do
            log="$RUNNER_TEMP/$run/logs/latest.log"
            [ -f "$log" ] || continue
            echo "== $run"
            # Every disabled mod with its reason (one line each), as for the corpus clients.
            report="$RUNNER_TEMP/$run/logs/fabric-bridge-report.txt"
            if [ -f "$report" ]; then
              echo "-- disabled mods:"
              awk '/^== Disabled Fabric mods/ { show = 1; next } /^$/ { show = 0 } show && /^  [^ ]/ { id = $1 } show && /^      / && !/^      Fix:/ && id { print "  " id ": " substr($0, 7); id = "" }' "$report" | cut -c1-260
              # Which mods' entrypoints failed, and which ran long (a mod whose content is missing shows whether it ran).
              echo "-- entrypoint failures:"
              awk '/^== Entrypoint failures/ { show = 1; next } /^$/ { show = 0 } show' "$report" | cut -c1-260 | head -20
              echo "-- slow entrypoints:"
              awk '/^== Slow entrypoints/ { show = 1; next } /^$/ { show = 0 } show' "$report" | head -25
            fi
            # Fabricated's own warnings and errors (a NeoForge internal it could not reach, a bridge that failed).
            echo "-- Fabricated's warnings and errors:"
            grep -h -E '/(WARN|ERROR)\] \[Fabricated' "$log" | head -15 | cut -c1-300 || true
            digest "$log"
            if ! grep -q -E 'Done \([0-9.]+s\)!' "$log"; then
              for report in $(ls "$RUNNER_TEMP/$run/crash-reports"/*.txt 2>/dev/null | head -1); do
                echo "-- $(basename "$report")"
                sed -n '/^Description:/,/^A detailed walkthrough/p' "$report" | grep -v "^A detailed" | head -40
                # A mod loading crash names its causes below that (its issues' exceptions), with their first frames.
                grep -E -A4 "^Caused by:|^\s*Exception message:" "$report" | grep -v "^--$" | head -40 | cut -c1-300
              done
              echo "-- server didn't start; last lines of the log:"
              tail -n 6 "$log" | cut -c1-300
            fi
          done
      - name: Upload Fabricated jar
        uses: actions/upload-artifact@v4
        with:
          name: fabricated-mc${{ matrix.minecraft }}
          path: build/libs/fabricated-*+mc${{ matrix.minecraft }}.jar
