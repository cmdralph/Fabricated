            fi
          }
          check "key mapping OK" "a Fabric key mapping is in the game's options"
          check "hud element OK" "a Fabric HUD element added last was drawn (upstream's subtitle overlay mixin)"
          check "hud element after chat OK" "a Fabric HUD element attached after chat was drawn (from NeoForge's chat layer)"
          check "hud conditions OK" "Fabric HUD elements attached to vanilla ones were drawn only where vanilla draws those: not with the GUI hidden, nor after the health bar or the experience level where vanilla hides them (HUD-3)"
          check "screen init event OK" "a screen's initialization fired Fabric's event"
          check "screen draw event OK" "a screen's drawing fired Fabric's event"
          check "client commands OK" "Fabric's client commands were registered on joining the world"
          check "client stopping OK" "Fabric's CLIENT_STOPPING fired as the game stopped"
          if [ "$failed" = 1 ]; then
            grep -n -m 40 -E "testmod_frapi|HudBridge|ScreenRenderBridge|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      # Fabric API's client modules on 1.21.1, passed through from the Fabric API jar: color providers the test mod
      # registers for its block and item must be the game's colors, and what Fabric's lookups return (they read
      # NeoForge's maps), and its HUD callback must be called. Fabricated's own key binding module (KEYMAP-2): the test
      # mod's key binding must be in the game's options and get the key saved for it. A gate.
      - name: Fabric API client modules (1.21.1)
        if: ${{ matrix.part == 'client' && !cancelled() && steps.build.outcome == 'success' && matrix.target.minecraft == '1.21.1' }}
        run: |
          log="$RUNNER_TEMP/client-fapi/run/logs/latest.log"
          failed=0
          check() {
            if grep -h "FABRICATED-TEST $1" "$log"; then
              echo "PASS: $2"
            else
