name: Build and test

# The full matrix for NeoForge's targets (mc/neoforge), for pull requests to main, release tags (v*) and by hand. The
# plan job picks the versions from what changed (ci/changed-targets.py --full: a version's own folder runs that version,
# anything shared every version; a tag or a run by hand runs them all). Each version is built once, and its jar and test
# mods are tested in parallel parts: "server" (dedicated servers), "client" (clients with the test mods and Fabric API)
# and "mods" (clients with other mods' NeoForge builds). With "extended", or on a release tag, the informational runs
# join: the newest NeoForge build in "server", other mods' Fabric builds in "mods", and the mod corpora in a "corpus"
# part. Each push to a working branch gets the quick check instead (check.yml), which stands down while the branch has a
# pull request. Forge's targets are on their own branches, forge and forge-legacy, with their own workflows. A push to
# main is a merge whose pull request already passed this, so it only builds what it changed: that keeps main's Gradle
# caches, which pull requests read, current. Changes to documentation alone build nothing.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/check.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/check.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      extended:
        description: Also the informational runs (newest NeoForge build, other mods' Fabric builds, the mod corpora)
        type: boolean
        default: false

env:
  EXTENDED: ${{ github.ref_type == 'tag' || inputs.extended == true }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Pick the versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The versions: those a pull request's changes touch, or a push's (a merge into main). A release tag, a run by
          # hand, or a push whose previous commit can't be fetched runs every version.
          mode=--all
          : > "$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt" && mode=--full
          elif [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ] && [ -n "$BEFORE" ] \
              && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git fetch -q --depth=1 origin "$BEFORE"; then
            git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/changed.txt" && mode=--full
          fi
          targets=$(python3 -I ci/changed-targets.py "$mode" . < "$RUNNER_TEMP/changed.txt")
          # The parts each version's tests run in. A push to main (a merge) only builds.
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ]; then
            parts='[]'
          elif [ "$EXTENDED" = true ]; then
            parts='["server", "client", "mods", "corpus"]'
          else
            parts='["server", "client", "mods"]'
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          echo "Versions: $(python3 -c 'import json, sys; print(" ".join(t["minecraft"] for t in json.loads(sys.argv[1])) or "none")' "$targets"); parts: $parts" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  core:
    name: Core and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # docs/MIXINS.md lists every mixin: one added without its row fails here.
      - name: Every mixin has its row in docs/MIXINS.md
        run: python3 -I scripts/check-mixin-inventory.py
      - name: Build and test Minecraft-independent modules
        run: ./gradlew -Pfabricated.coreOnly=true build --stacktrace
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/build/reports/tests
            fabric-loader-api/build/reports/tests
          if-no-files-found: ignore

  # Each version once: the jar and the test mods every part of its tests runs, and the jar for download.
  build:
    name: Build ${{ matrix.target.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    if: ${{ needs.plan.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabricated and test mods
        run: >
          ./gradlew :mc:neoforge-${{ matrix.target.minecraft }}:fabricatedJar :mc:neoforge-${{ matrix.target.minecraft }}:testmods
          --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Upload Fabricated jar
        uses: actions/upload-artifact@v4
        with:
          name: fabricated-mc${{ matrix.target.minecraft }}
          path: build/libs/fabricated-[0-9]*+mc${{ matrix.target.minecraft }}.jar
          if-no-files-found: error
      # Where the smoke scripts look for them (the paths are kept from the repository's root).
      - name: Upload the jar and the test mods for the tests
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target.minecraft }}
          path: |
            build/libs/fabricated-[0-9]*+mc${{ matrix.target.minecraft }}.jar
            mc/neoforge/${{ matrix.target.minecraft }}/build/testmods/*.jar
          if-no-files-found: error
          retention-days: 1

  test:
    name: Minecraft ${{ matrix.target.minecraft }} ${{ matrix.part }}
    runs-on: ubuntu-latest
    # A part takes 3 to 10 minutes; a hung game run is stopped at its own timeout, and this bounds anything else.
    timeout-minutes: 60
    needs: [plan, build]
    # Every version whose build passed: one version's failed build doesn't stop the others' tests.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.targets != '[]' && needs.plan.outputs.parts != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - name: Fabricated and the test mods from the build
        id: build
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.target.minecraft }}
      - name: Select Java ${{ matrix.target.java }} for the game
        run: echo "JAVA_HOME=$JAVA_HOME_${{ matrix.target.java }}_X64" >> "$GITHUB_ENV" && echo "$JAVA_HOME_${{ matrix.target.java }}_X64/bin" >> "$GITHUB_PATH"
      # The official Fabric API jar (downloaded here in CI, never by Fabricated), for the runs with it.
      - name: Get Fabric API ${{ matrix.target.fabric_api }}
        run: |
          mkdir -p "$RUNNER_TEMP/extra"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/extra/fabric-api.jar" \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${{ matrix.target.fabric_api }}/fabric-api-${{ matrix.target.fabric_api }}.jar"
      - name: Server smoke test (test mods only)
        if: ${{ matrix.part == 'server' }}
        run: ci/neoforge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server"
      - name: Upload server logs and report
        if: ${{ matrix.part == 'server' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target.minecraft }}
          path: |
            ${{ runner.temp }}/server/logs
            ${{ runner.temp }}/server/server.out
            ${{ runner.temp }}/server/.fabricated/cache/v1/index.json
          if-no-files-found: ignore
      # NeoForge's internals change between builds of one Minecraft version, and Fabricated accepts every build of it,
      # so the test mods also boot on the newest build (informational: it can break for reasons of its own).
      - name: Server smoke test on the newest NeoForge build (informational)
        if: ${{ matrix.part == 'server' && env.EXTENDED == 'true' && !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          pinned="${{ matrix.target.loader }}"
          newest=$(curl -fsSL --retry 4 https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | python3 -c '
          import re, sys
          builds = [v for v in re.findall(r"<version>([^<]+)</version>", sys.stdin.read()) if v.startswith(sys.argv[1])]
          print(builds[-1] if builds else "")' "${pinned%.*}.")
          echo "Newest NeoForge build for ${{ matrix.target.minecraft }}: ${newest:-none} (pinned: $pinned)" | tee "$RUNNER_TEMP/summary-newest.txt"
          if [ -z "$newest" ] || [ "$newest" = "$pinned" ]; then exit 0; fi
          set -o pipefail
          ci/neoforge/smoke-server.sh "${{ matrix.target.minecraft }}" "$newest" "$RUNNER_TEMP/server-newest" | tee -a "$RUNNER_TEMP/summary-newest.txt"
      # Boot again with the official Fabric API jar and keep the report, which lists every pass-through module and mixin pre-flight result. The server must start,
      # and on 1.21.1 a JSON data loader honour Fabric's load conditions; the other checks in this run are informational.
      - name: Server smoke test with Fabric API (server must start)
        if: ${{ matrix.part == 'server' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # Team Reborn's energy library (Fabric tech mods' energy API), for the energy bridge's check below.
          mkdir -p "$RUNNER_TEMP/energy"
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/energy" fabric team-reborn-energy || true
          # Without a build of its own, the one a Fabric tech mod ships inside its jar.
          if ! ls "$RUNNER_TEMP"/energy/*.jar >/dev/null 2>&1; then
            python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/energy-hosts" fabric techreborn modern-industrialization || true
            python3 ci/nested-jar.py team_reborn_energy "$RUNNER_TEMP/energy" "$RUNNER_TEMP"/energy-hosts/*.jar > "$RUNNER_TEMP/energy-source.txt" || true
          fi
          cp "$RUNNER_TEMP"/energy/*.jar "$RUNNER_TEMP/extra/" 2>/dev/null || true
          ci/neoforge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-fapi" "$RUNNER_TEMP/extra"
          # Fabric's load conditions in a data loader of vanilla's JSON kind, which NeoForge 21.1 leaves as vanilla's: the
          # test mod's file whose conditions fail must not be read (CORPUS-49). A gate.
          if [ "${{ matrix.target.minecraft }}" = 1.21.1 ] && ! grep -q "FABRICATED-TEST json loader conditions OK" "$RUNNER_TEMP/server-fapi/server.out"; then
            grep -h "FABRICATED-TEST json loader conditions" "$RUNNER_TEMP/server-fapi/server.out" || true
            echo "::error::FAIL: a JSON data loader read a file whose fabric:load_conditions fail (CORPUS-49)"
            exit 1
          fi
          # Fabric's custom ingredients in the codec recipes use, which NeoForge 21.1 builds without upstream's hook
          # (DEPRECATED-2). A gate.
          if [ "${{ matrix.target.minecraft }}" = 1.21.1 ] && ! grep -q "FABRICATED-TEST recipe custom ingredient OK" "$RUNNER_TEMP/server-fapi/server.out"; then
            grep -h "FABRICATED-TEST recipe custom ingredient" "$RUNNER_TEMP/server-fapi/server.out" || true
            echo "::error::FAIL: a recipe's Fabric custom ingredient doesn't parse (DEPRECATED-2)"
            exit 1
          fi
      - name: Energy bridge with Team Reborn's library
        if: ${{ matrix.part == 'server' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # Also recorded for the summary step at the end of the log.
          if ! ls "$RUNNER_TEMP"/energy/*.jar >/dev/null 2>&1; then
            echo "Energy: no Team Reborn Energy build for ${{ matrix.target.minecraft }} on Modrinth, of its own or in Tech Reborn or Modern Industrialization, nothing checked" | tee "$RUNNER_TEMP/summary-energy.txt"
            exit 0
          fi
          { cat "$RUNNER_TEMP/energy-source.txt" 2>/dev/null || ls "$RUNNER_TEMP"/energy/; } | tee "$RUNNER_TEMP/summary-energy.txt"
          if grep -h "FABRICATED-TEST energy OK" "$RUNNER_TEMP/server-fapi/server.out" | tee -a "$RUNNER_TEMP/summary-energy.txt"; then
            echo "PASS: energy moves both ways between Team Reborn's API and NeoForge's capability"
          else
            grep -h -E "FABRICATED-TEST energy|team_reborn_energy" "$RUNNER_TEMP/server-fapi/server.out" | head -8 | tee -a "$RUNNER_TEMP/summary-energy.txt" || true
            echo "::error::FAIL: the energy bridge check did not pass"
            exit 1
          fi
      - name: Upload Fabric API run logs and report
        if: ${{ matrix.part == 'server' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-fabric-api-${{ matrix.target.minecraft }}
          path: |
            ${{ runner.temp }}/server-fapi/logs
            ${{ runner.temp }}/server-fapi/server.out
          if-no-files-found: ignore
      # Mods that share the game with Fabricated, as stand-ins built from Fabricated's own jar (ci/neoforge/standins.py):
      # a Fabric API module another NeoForge mod provides, straight and nested, with a copy of Fabric Loader's API as
      # Forgified Fabric Loader ships it (PROVIDER-1, PROVIDER-2), and two versions of a nested library. Every check
      # gates, and a second launch must take every translation from the cache.
      - name: Server with stand-ins for coexisting mods
        if: ${{ matrix.part == 'server' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/standins"
          python3 -I ci/neoforge/standins.py build/libs/fabricated-[0-9]*+mc${{ matrix.target.minecraft }}.jar "$RUNNER_TEMP/standins"
          ci/neoforge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-standins" "$RUNNER_TEMP/standins"
      # Sinytra Connector (a stand-in with its mod id) or a second Fabricated jar in the mods folder: the launch must
      # stop with Fabricated's error naming them, as two loaders of Fabric mods can't share them (DUP-1).
      - name: Server refusing Sinytra Connector and a second Fabricated jar
        if: ${{ matrix.part == 'server' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/refuse-connector/src/META-INF" "$RUNNER_TEMP/refuse-twice"
          printf 'modLoader = "lowcodefml"\nloaderVersion = "[1,)"\nlicense = "GPL-3.0-only"\n[[mods]]\nmodId = "connector"\nversion = "1.0.0"\n' \
              > "$RUNNER_TEMP/refuse-connector/src/META-INF/neoforge.mods.toml"
          jar --create --file "$RUNNER_TEMP/refuse-connector/connector-standin.jar" -C "$RUNNER_TEMP/refuse-connector/src" META-INF/neoforge.mods.toml
          cp build/libs/fabricated-[0-9]*+mc${{ matrix.target.minecraft }}.jar "$RUNNER_TEMP/refuse-twice/fabricated-0.0.1+mc${{ matrix.target.minecraft }}.jar"
          SMOKE_TESTMODS=none SMOKE_TIMEOUT=300 SMOKE_EXPECT_REFUSAL="Sinytra Connector (connector-standin.jar)" \
              ci/neoforge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-refuse-connector" "$RUNNER_TEMP/refuse-connector"
          SMOKE_TESTMODS=none SMOKE_TIMEOUT=300 SMOKE_EXPECT_REFUSAL="2 Fabricated jars (fabricated-0.0.1+mc${{ matrix.target.minecraft }}.jar" \
              ci/neoforge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-refuse-twice" "$RUNNER_TEMP/refuse-twice"
      # The safety net for a Fabric mod's mixin that fails as Mixin applies it, which pre-flight passed (APPLY-1): with
      # pre-flight's findings ignored for the impossible-mixin test mod, each of its two mixins stops a launch and is
      # recorded (one through Mixin's error handlers, one an injector's critical failure past them), the next launch
      # leaves it out and says so, and the third starts.
      - name: Server leaving out a mixin that failed as Mixin applied it in the last launch
        if: ${{ matrix.part == 'server' && !cancelled() && steps.build.outcome == 'success' }}
        run: ci/neoforge/smoke-apply-failure.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-apply-failure"
      # The real ones, newest builds from Modrinth (downloaded here in CI): Forgified Fabric API (its module jars nested,
      # with Forgified Fabric Loader) where it has a build for the version, Kotlin for Forge with Fabric Language
      # Kotlin, which bundle different Kotlin versions. The server must start, as no package two mods share may stop
      # it; the test mods' other checks are evidence, as the modules are then Forgified Fabric API's. With its resource
      # loader, the test mod's built-in pack must be registered: its pack.mcmeta keeps a NeoForge build's sections,
      # which its container must show left out, as NeoForge reads it (PROVIDER-3).
      - name: Server with Forgified Fabric API and both Kotlin languages (server must start)
        if: ${{ matrix.part == 'server' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/coexist"
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/coexist" neoforge forgified-fabric-api kotlin-for-forge || true
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/coexist" fabric fabric-language-kotlin || true
          ls "$RUNNER_TEMP/coexist" | tee "$RUNNER_TEMP/summary-coexist.txt"
          ci/neoforge/smoke-server.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/server-coexist" "$RUNNER_TEMP/coexist"
          report="$RUNNER_TEMP/server-coexist/logs/fabric-bridge-report.txt"
          sed -n '/== Fabric API modules provided by other mods ==/,/^$/p;/== Fabric Loader API ==/,/^$/p' "$report" | tee -a "$RUNNER_TEMP/summary-coexist.txt" || true
          if sed -n '/== Fabric API modules provided by other mods ==/,/^$/p' "$report" | grep -q "fabric-resource-loader"; then
            if grep -m 1 "FABRICATED-TEST builtin pack registered" "$RUNNER_TEMP/server-coexist/server.out"; then
              echo "PASS: Forgified Fabric API's resource loader took the test mod's built-in pack (PROVIDER-3)" | tee -a "$RUNNER_TEMP/summary-coexist.txt"
            else
              echo "::error::Forgified Fabric API's resource loader: the test mod's built-in pack was not registered (PROVIDER-3)"; exit 1
            fi
          fi
          if sed -n '/== Fabric API modules provided by other mods ==/,/^$/p' "$report" | grep -q "fabric-registry-sync-v0"; then
            if grep -m 1 "FABRICATED-TEST registry sync: custom registry OK" "$RUNNER_TEMP/server-coexist/server.out"; then
              echo "PASS: a Fabric initializer made a registry with Forgified Fabric API's registry sync (PROVIDER-6)" | tee -a "$RUNNER_TEMP/summary-coexist.txt"
            else
              echo "::error::Forgified Fabric API's registry sync: the test mod's initializer didn't make its registry (PROVIDER-6)"; exit 1
            fi
          fi
      - name: Upload coexisting mods' run logs and reports
        if: ${{ matrix.part == 'server' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-coexist-${{ matrix.target.minecraft }}
          path: |
            ${{ runner.temp }}/server-standins/logs
            ${{ runner.temp }}/server-standins/server.out
            ${{ runner.temp }}/server-standins/server-warm.out
            ${{ runner.temp }}/server-coexist/logs
            ${{ runner.temp }}/server-coexist/server.out
            ${{ runner.temp }}/server-apply-failure/logs
            ${{ runner.temp }}/server-apply-failure/server-*.out
            ${{ runner.temp }}/server-apply-failure/.fabricated/mixin-failures.json
          if-no-files-found: ignore
      # Client: a real NeoForge client started headlessly (Xvfb), which joins a singleplayer world.
      # 26.3+ open their window with SDL3 over EGL, which needs Mesa's EGL library (not on the runner image).
      - name: Install Mesa EGL for the client
        if: ${{ matrix.part != 'server' && !cancelled() && steps.build.outcome == 'success' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Client smoke test (test mods, singleplayer world)
        if: ${{ matrix.part == 'client' && !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client" | tee "$RUNNER_TEMP/summary-client.txt"
      # The same client joining a world beside Fabric libraries that bundle a library the platform already provides:
      # the test mods' shade jar (part of Gson, which the launcher's libraries have) and Fabric Language Kotlin (Kotlin,
      # which Kotlin for Forge has), downloaded from Modrinth where they have builds for the version. Each package must
      # be the platform's alone (the Fabric jars' copies left out), and vanilla must still read Gson's internal parser
      # (GSON-1).
      - name: Client with libraries the platform already provides (Gson, Kotlin; joins a world)
        if: ${{ matrix.part == 'client' && !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/provided"
          cp mc/neoforge/${{ matrix.target.minecraft }}/build/testmods/fabricated-testmod-shade.jar "$RUNNER_TEMP/provided/"
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/provided" neoforge kotlin-for-forge || true
          python3 ci/fetch-corpus.py "${{ matrix.target.minecraft }}" "$RUNNER_TEMP/provided" fabric fabric-language-kotlin || true
          ls "$RUNNER_TEMP/provided"
          ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-provided" "$RUNNER_TEMP/provided" | tee "$RUNNER_TEMP/summary-provided.txt"
          report="$RUNNER_TEMP/client-provided/run/logs/fabric-bridge-report.txt"
          need() {
            if grep -qF -- "$1" "$report"; then echo "PASS: $2"; else echo "::error::FAIL: $2 (no \"$1\" in the report)"; exit 1; fi
          }
          need "fabricated-testmod-shade bundles package com.google.gson.internal, which the platform already provides" "the shade jar's copy of Gson's package is left out for the platform's"
          if ls "$RUNNER_TEMP/provided" | grep -qi '^kotlinforforge' && ls "$RUNNER_TEMP/provided" | grep -qi '^fabric-language-kotlin'; then
            need "kotlin-stdlib bundles package kotlin, which the platform already provides" "Fabric Language Kotlin's copy of Kotlin's packages is left out for Kotlin for Forge's"
          else
            echo "NOTE: Kotlin for Forge or Fabric Language Kotlin has no build for ${{ matrix.target.minecraft }}; only Gson is checked"
          fi
      - name: Upload client logs and report
        if: ${{ matrix.part == 'client' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-${{ matrix.target.minecraft }}
          path: |
            ${{ runner.temp }}/client/run/logs
            ${{ runner.temp }}/client/run/crash-reports
            ${{ runner.temp }}/client/client.out
            ${{ runner.temp }}/client/thread-dump.txt
            ${{ runner.temp }}/client-provided/run/logs
            ${{ runner.temp }}/client-provided/run/crash-reports
            ${{ runner.temp }}/client-provided/client.out
          if-no-files-found: ignore
      # The same client with the official Fabric API jar: shows which client-side modules load and whether the game
      # still reaches a world. Informational until every client module is accounted for.
      - name: Client smoke test with Fabric API (informational)
        if: ${{ matrix.part == 'client' && !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # Where the version has one, the test mod for Fabric API's client modules joins this run (it needs modules only
        # the Fabric API jar provides: the renderer API, or on 1.21.1 fabric-rendering-v1).
        run: |
          mkdir -p "$RUNNER_TEMP/extra-client"
          cp "$RUNNER_TEMP/extra/fabric-api.jar" "$RUNNER_TEMP/extra-client/"
          cp mc/neoforge/${{ matrix.target.minecraft }}/build/testmods/fabricated-testmod-frapi.jar "$RUNNER_TEMP/extra-client/" 2>/dev/null || true
          SMOKE_TIMEOUT=480 ci/neoforge/smoke-client.sh "${{ matrix.target.minecraft }}" "${{ matrix.target.loader }}" "$RUNNER_TEMP/client-fapi" "$RUNNER_TEMP/extra-client" || true
          grep -A200 "== " "$RUNNER_TEMP/client-fapi/run/logs/fabric-bridge-report.txt" || true
      # A Fabric model (its own emitQuads) must be drawn in the world: Fabricated sends it through Fabric's renderer when
      # its chunk section is meshed. This check is a gate, unlike the run above.
      - name: Fabric renderer API and model formats (26.x)
        if: ${{ matrix.part == 'client' && !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.target.minecraft, '26.') }}
        run: |
          log="$RUNNER_TEMP/client-fapi/run/logs/latest.log"
          failed=0
          check() {
            if grep -h "FABRICATED-TEST $1" "$log"; then
              echo "PASS: $2"
            else
              echo "::error::FAIL: $2 (no \"$1\" line)"
              failed=1
            fi
          }
          check "frapi terrain OK .*seam=Fabricated" "a Fabric block model was meshed into a chunk section, sent to Fabric's renderer by Fabricated's seam"
          check "frapi nested terrain OK .*seam=Fabricated" "a Fabric model inside a vanilla multipart model was meshed, through Fabricated's seam"
          check "frapi moving block OK" "a falling Fabric block model was drawn as a moving block"
          # 26.1.2 draws no outline around moving blocks.
          if [ "${{ matrix.target.minecraft }}" != "26.1.2" ]; then
            check "frapi moving block outline OK" "a glowing falling Fabric block model's outline was drawn by Fabric's renderer (M2b)"
          fi
          check "frapi baked colors OK" "a NeoForge quad's baked colour reached Fabric's renderer (FRAPI-2)"
          check "frapi baked quad constructor hook OK" "a mixin at the end of BakedQuad's vanilla constructor ran for NeoForge's block quads (pre-flight repair)"
          check "frapi breaking OK" "a Fabric block model got the breaking overlay"
          # R4: a block drawn as an entity, through Fabricated's seam (upstream's, which takes every block, is left out).
          check "frapi entity block OK" "a Fabric block model carried by a minecart was drawn as the minecart's block"
          check "frapi level-aware default OK" "a NeoForge model inside a Fabric model got the chunk section's level from Fabric's renderer"
          # R3: a Fabric item model's quads (emitted into its layer; 26.x's API gives no call as they are drawn).
          check "frapi item screen OK" "a Fabric item model emitted its quads for the hotbar"
          check "frapi item hand OK" "a Fabric item model emitted its quads for the player's hand"
          check "frapi item dropped OK" "a Fabric item model emitted its quads for a dropped item"
          check "frapi item frame OK" "a Fabric item model emitted its quads for an item frame"
          check "model deserializer OK" "a model file of a Fabric type was read by its Fabric deserializer"
          check "neoforge blockstate type OK" "a blockstate of NeoForge's composite type still loads with Fabric's model loading"
          # FRAPI rule 8: a Fabric model that throws in a chunk section (alone, or as a multipart model's part) or when drawn
          # as an entity fails alone. NeoForge's renderer draws it from its parts, Fabricated logs it once and lists it in
          # the report, and the transform it left pushed never reaches another block.
          check "frapi broken model fallback OK" "a Fabric model that threw in a chunk section was drawn by NeoForge's renderer from its parts (FRAPI rule 8)"
          check "frapi broken part fallback OK" "a multipart model whose Fabric part threw was drawn by NeoForge's renderer (FRAPI rule 8)"
          check "frapi broken entity model fallback OK" "a Fabric model that threw when drawn as an entity's block was drawn by NeoForge from its parts (FRAPI rule 8)"
          check "frapi wrapped model fallback OK" "a block whose Fabric model wraps one that threw was drawn by NeoForge's renderer that time, from its parts (FRAPI rule 8)"
          check "frapi wrapper kept OK" "a Fabric model wrapping one that threw kept Fabric's renderer: the throw was the wrapped model's (FRAPI rule 8, Continuity)"
          for model in BrokenModel BrokenPartModel BrokenEntityModel; do
            count=$(grep -c "Fabric block models of class [^ ]*\$$model (.*) threw while drawn in" "$log" || true)
            if [ "$count" = 1 ]; then
              echo "PASS: the failure of $model was logged once"
            else
              echo "::error::FAIL: the failure of $model was logged $count times, not once"
              failed=1
            fi
          done
          # A throw inside a wrapper (Continuity's models wrap others) is the wrapped model's: logged once, naming the wrapper,
          # whose class is not marked broken.
          count=$(grep -c "A model wrapped by a Fabric block model of class [^ ]*\$WrapperCheckModel (.*) threw while drawn in" "$log" || true)
          if [ "$count" = 1 ]; then
            echo "PASS: the wrapped model's failure was logged once, naming its wrapper"
          else
            echo "::error::FAIL: the wrapped model's failure was logged $count times, not once"
            failed=1
          fi
          if grep -h "Fabric block models of class [^ ]*\$WrapperCheckModel (" "$log"; then
            echo "::error::FAIL: the wrapper's class was marked broken for a throw of the model it wraps"
            failed=1
          fi
          if grep -q "threw while drawn in" "$RUNNER_TEMP/client-fapi/run/logs/fabric-bridge-report.txt"; then
            echo "PASS: the report lists the failure"
          else
            echo "::error::FAIL: the report doesn't list the broken model's failure"
            failed=1
          fi
          if grep -h "FABRICATED-TEST frapi leaked transform FAILED" "$log"; then
            echo "::error::FAIL: a transform a broken model left pushed reached another block"
            failed=1
          fi
          if [ "$failed" = 1 ]; then
            grep -n -m 40 -E "frapi|FabricBlockRendering|RenderMixin|SectionCompiler|/(ERROR|FATAL)\]" "$log" || true
            exit 1
          fi
      # Fabric API's client modules most client mods use, passed through from the Fabric API jar: the test mod's key
      # mapping must be in the game's options, its HUD elements drawn (one attached after chat, from NeoForge's HUD
      # layer, one added last), a screen's init and draw events fired (the draw event from NeoForge's screen render
      # events) and its client commands registered on joining the world. A gate.
      - name: Fabric API client modules (26.x)
        if: ${{ matrix.part == 'client' && !cancelled() && steps.build.outcome == 'success' && startsWith(matrix.target.minecraft, '26.') }}
        run: |
          log="$RUNNER_TEMP/client-fapi/run/logs/latest.log"
          failed=0
          check() {
