name: Branch README

# The forge and forge-legacy branches each show a README of their own, though every branch holds the same tree: GitHub
# shows .github/README.md before the root README.md, which is main's. Their source is docs/readme/<branch>.md, which
# every branch holds; on a push that changes it, this copies the branch's own to the branch's .github/README.md.
# claude/dev never holds .github/README.md, so its merges into the branches never touch the copies.
on:
  push:
    branches: [forge, forge-legacy]
    paths: ['docs/readme/**', '.github/workflows/branch-readme.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readme:
    name: Copy the branch's README
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Copy docs/readme/<branch>.md to .github/README.md
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            forge|forge-legacy) ;;
            *) echo "::error::$BRANCH has no README of its own (main's is the root README.md)"; exit 1 ;;
          esac
          source="docs/readme/$BRANCH.md"
          {
            echo "<!-- Copied from $source by .github/workflows/branch-readme.yml: edit that file, on claude/dev. -->"
            echo
            cat "$source"
          } > "$RUNNER_TEMP/README.md"
          if cmp -s "$RUNNER_TEMP/README.md" .github/README.md; then
            echo "The branch's README is up to date."
            exit 0
          fi
          cp "$RUNNER_TEMP/README.md" .github/README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/README.md
          git commit -m "docs(readme): $BRANCH's README from $source"
          git push origin "HEAD:$BRANCH"
