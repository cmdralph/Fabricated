name: Release

# Releases exactly the jars the full matrix tested. CI (ci.yml) runs, extended, on each platform branch's pinned
# commit (main for NeoForge, forge and forge-legacy for Forge); the jars those runs built, one per platform and
# Minecraft version the branch holds (mc/<platform>/<version>), become a GitHub release with their checksums and are
# uploaded to CurseForge (ci/curseforge.py). By hand, "dry-run" (the default) prints what would be published, "draft"
# makes a draft GitHub release, and "publish" a published one, its tag created by GitHub at main's pinned commit, and
# uploads to CurseForge. Pushing a tag v* publishes it, from the tagged commit and the Forge branches' heads. The tag
# is v<fabricated_version>; the notes are docs/releases/<tag>.md at main's commit, then the jars' commits and checksums.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, v<fabricated_version> (v0.6.0-beta.2)
        required: true
      mode:
        description: dry-run (print what would be published), draft (a draft GitHub release) or publish (GitHub and CurseForge)
        type: choice
        options: [dry-run, draft, publish]
        default: dry-run
      main_ref:
        description: Branch or full commit SHA of main, for NeoForge's jars (the release's commit)
        default: main
      forge_ref:
        description: Branch or full commit SHA of forge, for Forge's jars
        default: forge
      forge_legacy_ref:
        description: Branch or full commit SHA of forge-legacy, for legacy Forge's jars
        default: forge-legacy

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pin:
    name: Pin the commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pin.outputs.tag }}
      version: ${{ steps.pin.outputs.version }}
      mode: ${{ steps.pin.outputs.mode }}
      commits: ${{ steps.pin.outputs.commits }}
      targets: ${{ steps.pin.outputs.targets }}
    steps:
      - name: Check the tag, pin each branch's commit and list its jars
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag || github.ref_name }}
          MODE: ${{ inputs.mode || 'publish' }}
          MAIN_REF: ${{ inputs.main_ref || 'main' }}
          FORGE_REF: ${{ inputs.forge_ref || 'forge' }}
          FORGE_LEGACY_REF: ${{ inputs.forge_legacy_ref || 'forge-legacy' }}
          CURSEFORGE_SET: ${{ secrets.CURSEFORGE_PROJECT_ID != '' && secrets.CURSEFORGE_TOKEN != '' }}
        run: |
          set -euo pipefail
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" "${@:2}"; }
          fail() { echo "::error::$1"; exit 1; }
          # The same pre-release suffixes ci/curseforge.py gives a release type, so a tag it would refuse stops here,
          # before the matrix.
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]*(alpha|beta|rc|pre)[0-9A-Za-z.]*)?)$ ]] ||
            fail "'$TAG' is not v<major>.<minor>.<patch>, with an optional pre-release suffix naming alpha, beta, rc or pre"
          version=${BASH_REMATCH[1]}
          if [ "$MODE" != dry-run ] && [ "$EVENT" != push ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || fail "A release is made only by main's copy of this workflow"
            ! api "git/ref/tags/$TAG" > /dev/null 2>&1 || fail "The tag $TAG exists already"
          fi
          [ "$MODE" != publish ] || [ "$CURSEFORGE_SET" = true ] ||
            fail "Publishing uploads to CurseForge: set the secrets CURSEFORGE_PROJECT_ID and CURSEFORGE_TOKEN"
          # A full SHA is taken as given; anything else is a branch, resolved once so every job tests and releases the
          # same commit.
          ref() { if [[ $1 =~ ^[0-9a-f]{40}$ ]]; then echo "$1"; else echo "heads/$1"; fi; }
          main=$(ref "$MAIN_REF")
          [ "$EVENT" != push ] || main=tags/$TAG
          commits='{}' targets=
          echo "## $TAG ($MODE)" >> "$GITHUB_STEP_SUMMARY"
          for row in "main $main neoforge" "forge $(ref "$FORGE_REF") forge" \
              "forge-legacy $(ref "$FORGE_LEGACY_REF") forge-legacy"; do
            read -r branch ref platform <<< "$row"
            commit=$(api "commits/$ref" --jq .sha) || fail "$ref names no commit"
            built=$(api "contents/gradle.properties?ref=$commit" -H 'Accept: application/vnd.github.raw' \
              | sed -n 's/^fabricated_version=//p' | tr -d '[:space:]')
            [ "$built" = "$version" ] || fail "$branch at ${commit:0:10} builds ${built:-no version}; the tag names $version"
            if [ "$MODE" != dry-run ]; then
              status=$(api "compare/$commit...$branch" --jq .status)
              [[ $status = identical || $status = ahead ]] || fail "${commit:0:10} is not on $branch"
            fi
            versions=$(api "contents/mc/$platform?ref=$commit" --jq '.[] | select(.type == "dir") | .name' \
              | grep -E '^[0-9]+(\.[0-9]+)+$' | xargs) || fail "$branch at ${commit:0:10} holds no mc/$platform/<version>"
            for minecraft in $versions; do targets+=" $platform/$minecraft"; done
            commits=$(jq -c --arg branch "$branch" --arg commit "$commit" '.[$branch] = $commit' <<< "$commits")
            echo "- \`$branch\` at \`${commit:0:10}\`: $platform $versions" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$MODE" != dry-run ]; then
            api "contents/docs/releases/$TAG.md?ref=$(jq -r .main <<< "$commits")" > /dev/null 2>&1 ||
              fail "docs/releases/$TAG.md is missing at main's commit"
          fi
          { echo "tag=$TAG"; echo "version=$version"; echo "mode=$MODE"; echo "commits=$commits"
            echo "targets=${targets# }"; } >> "$GITHUB_OUTPUT"

  test:
    name: Full matrix, ${{ matrix.branch }}
    needs: pin
    strategy:
      # Every branch's matrix runs to the end even when another's fails, so a rerun repeats only what failed.
      fail-fast: false
      matrix:
        branch: [main, forge, forge-legacy]
    # This commit's ci.yml tests the branch's commit; it is given no secrets.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ fromJSON(needs.pin.outputs.commits)[matrix.branch] }}
      extended: true

  release:
    name: GitHub release
    needs: [pin, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.pin.outputs.tag }}
      VERSION: ${{ needs.pin.outputs.version }}
      MODE: ${{ needs.pin.outputs.mode }}
      MAIN_COMMIT: ${{ fromJSON(needs.pin.outputs.commits).main }}
      FORGE_COMMIT: ${{ fromJSON(needs.pin.outputs.commits).forge }}
      FORGE_LEGACY_COMMIT: ${{ fromJSON(needs.pin.outputs.commits)['forge-legacy'] }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(needs.pin.outputs.commits).main }}
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: jar-*
          path: artifacts
      - name: Check the jars, write the checksums and the notes
        env:
          TARGETS: ${{ needs.pin.outputs.targets }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # One jar per platform and version each branch holds, named for the release's version, and nothing else.
          mkdir dist
          declare -A built
          for target in $TARGETS; do
            platform=${target%/*} minecraft=${target#*/}
            jar=fabricated-${platform%-legacy}-$VERSION+mc$minecraft.jar
            artifact=jar-$platform-$minecraft
            held=$(ls -A "artifacts/$artifact" 2> /dev/null || true)
            [ "$held" = "$jar" ] || fail "$artifact should hold $jar alone; it holds: $(tr '\n' ' ' <<< "${held:-nothing}")"
            [ ! -e "dist/$jar" ] || fail "Two branches build $jar"
            mv "artifacts/$artifact/$jar" dist/
            rmdir "artifacts/$artifact"
            built[$platform]+="${built[$platform]:+,} \`$jar\`"
          done
          left=$(ls -A artifacts)
          [ -z "$left" ] || fail "Artifacts no jar of the release names: ${left//$'\n'/ }"
          (cd dist && sha256sum -- *.jar > SHA256SUMS.txt)
          [ -f "docs/releases/$TAG.md" ] || echo "::warning::docs/releases/$TAG.md is missing at ${MAIN_COMMIT:0:10}"
          commit() { echo "[\`${1:0:10}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$1)"; }
          run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          {
            if [ -f "docs/releases/$TAG.md" ]; then cat "docs/releases/$TAG.md"; echo; fi
            echo "## Builds"
            echo
            echo "Tested by the full matrix and built by [the release workflow]($run):"
            echo
            echo "- NeoForge, from \`main\` at $(commit "$MAIN_COMMIT"):${built[neoforge]-}"
            echo "- Forge, from \`forge\` at $(commit "$FORGE_COMMIT"):${built[forge]-}"
            echo "- Legacy Forge, from \`forge-legacy\` at $(commit "$FORGE_LEGACY_COMMIT"):${built[forge-legacy]-}"
            echo
            echo "SHA-256 (also in \`SHA256SUMS.txt\`):"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: |
            dist/
            notes.md
          if-no-files-found: error
      - name: ${{ needs.pin.outputs.mode == 'dry-run' && 'Show the release' || 'Create the release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" "${@:2}"; }
          fail() { echo "::error::$1"; exit 1; }
          args=(--repo "$GITHUB_REPOSITORY" --target "$MAIN_COMMIT" --title "Fabricated $TAG" --notes-file notes.md)
          kind=release
          case "$TAG" in *-*) kind=pre-release args+=(--prerelease) ;; esac
          if [ "$MODE" = dry-run ]; then
            echo "Dry run: publishing would make the GitHub $kind $TAG, its tag at ${MAIN_COMMIT:0:10}, holding:"
            ls dist
            exit 0
          fi
          [ "$MODE" = publish ] || args+=(--draft)
          # A release the tag has already, a draft or one published from it (its tag's push started this run), stays
          # the release when it holds the jars this run tested.
          id=$(api releases --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ -z "$id" ]; then
            gh release create "$TAG" "${args[@]}" dist/*.jar dist/SHA256SUMS.txt
            exit 0
          fi
          [ "$(wc -w <<< "$id")" = 1 ] || fail "$TAG has more than one release: ${id//$'\n'/ }"
          sums=$(api "releases/$id/assets" --jq '.[] | select(.name == "SHA256SUMS.txt") | .id')
          if [ -z "$sums" ] || ! api "releases/assets/$sums" -H 'Accept: application/octet-stream' | cmp -s - dist/SHA256SUMS.txt
          then
            fail "The release $TAG holds other jars than this run tested: delete it to release these"
          fi
          [ "$MODE" != publish ] || api "releases/$id" -X PATCH -F draft=false -f target_commitish="$MAIN_COMMIT" > /dev/null
          echo "The release $TAG holds these jars already"

  curseforge:
    name: CurseForge
    needs: [pin, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The script from this workflow's commit, the jars and the notes from the release job.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: ci
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release
      - name: ${{ needs.pin.outputs.mode == 'publish' && 'Upload the jars' || 'Show what would be uploaded' }}
        env:
          MODE: ${{ needs.pin.outputs.mode }}
          # A secret, not a variable: a step's environment is listed in its log, and only secrets are masked there.
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail
          (cd release/dist && sha256sum --check --strict --quiet SHA256SUMS.txt)
          args=(release/notes.md release/dist/*.jar)
          [ "$MODE" = publish ] || args=(--dry-run "${args[@]}")
          python3 -I ci/curseforge.py "${args[@]}"
