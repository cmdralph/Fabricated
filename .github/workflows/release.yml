name: Release

# Builds a release's jars from one pinned commit, by hand only: every branch holds every platform, so NeoForge's four
# jars, Forge's four and Forge 1.20.1's come from the same tree, each with the build its platform's CI uses, from an
# empty Gradle cache. Mode "build" (the default) only builds the jars and lists their checksums, for review before
# anything is published; "draft" also creates a draft release, and "publish" a published one. GitHub creates the tag at
# the pinned commit when the release is published; no tag is pushed from a working copy. The notes are
# docs/releases/<tag>.md at that commit, followed by the commit the jars were built from and their SHA-256 checksums.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, v<fabricated_version> with an optional pre-release suffix (v0.4.0-alpha)
        required: true
      mode:
        description: build (jars and checksums only), draft or publish
        type: choice
        options: [build, draft, publish]
        default: build
      ref:
        description: Branch or full commit SHA to build every jar from
        default: main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  refs:
    name: Pin the commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pin.outputs.version }}
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - name: Check the tag and resolve the ref
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          MODE: ${{ inputs.mode }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not v<major>.<minor>.<patch>, with an optional -suffix"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          # A full SHA is taken as given; anything else is a branch, resolved once so every job builds the same commit.
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          else
            commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$REF" --jq .object.sha)
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$MODE" != build ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A release is created only by main's copy of this workflow"
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
              echo "::error::The tag $TAG already exists"
              exit 1
            fi
            if ! gh api "repos/$GITHUB_REPOSITORY/contents/docs/releases/$TAG.md?ref=$commit" > /dev/null 2>&1; then
              echo "::error::docs/releases/$TAG.md is missing at $commit"
              exit 1
            fi
          fi

  build:
    name: ${{ matrix.platform }} ${{ matrix.minecraft }}
    needs: refs
    runs-on: ubuntu-latest
    # The Gradle cache is off, so ForgeGradle's Mavenizer and NeoForge's setup run in full.
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: NeoForge, minecraft: "1.21.11", java: 25, jar: fabricated, tasks: "-Pfabricated.platforms=neoforge :mc:neoforge-1.21.11:fabricatedJar" }
          - { platform: NeoForge, minecraft: "26.1.2", java: 25, jar: fabricated, tasks: "-Pfabricated.platforms=neoforge :mc:neoforge-26.1.2:fabricatedJar" }
          - { platform: NeoForge, minecraft: "26.2", java: 25, jar: fabricated, tasks: "-Pfabricated.platforms=neoforge :mc:neoforge-26.2:fabricatedJar" }
          - { platform: NeoForge, minecraft: "26.3", java: 25, jar: fabricated, tasks: "-Pfabricated.platforms=neoforge :mc:neoforge-26.3:fabricatedJar" }
          - { platform: Forge, minecraft: "1.21.11", java: 25, jar: fabricated-forge, tasks: "-Pfabricated.platforms=forge --configure-on-demand :mc:forge-1.21.11:fabricatedJar :mc:forge-1.21.11:checkForgeJar" }
          - { platform: Forge, minecraft: "26.1.2", java: 25, jar: fabricated-forge, tasks: "-Pfabricated.platforms=forge --configure-on-demand :mc:forge-26.1.2:fabricatedJar :mc:forge-26.1.2:checkForgeJar" }
          - { platform: Forge, minecraft: "26.2", java: 25, jar: fabricated-forge, tasks: "-Pfabricated.platforms=forge --configure-on-demand :mc:forge-26.2:fabricatedJar :mc:forge-26.2:checkForgeJar" }
          - { platform: Forge, minecraft: "26.3", java: 25, jar: fabricated-forge, tasks: "-Pfabricated.platforms=forge --configure-on-demand :mc:forge-26.3:fabricatedJar :mc:forge-26.3:checkForgeJar" }
          - { platform: Forge, minecraft: "1.20.1", java: 17, jar: fabricated-forge, tasks: "-Pfabricated.platforms=forge-legacy --configure-on-demand :mc:forge-legacy-1.20.1:fabricatedJar :mc:forge-legacy-1.20.1:checkForgeJar" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refs.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle runs on 21, the last listed; the other is the toolchain the version builds or runs Mavenizer with.
          java-version: |
            ${{ matrix.java }}
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Check the version
        env:
          EXPECTED: ${{ needs.refs.outputs.version }}
        run: |
          version=$(sed -n 's/^fabricated_version=//p' gradle.properties)
          if [ "$version" != "$EXPECTED" ]; then
            echo "::error::$(git rev-parse --short HEAD) builds $version; the tag names $EXPECTED"
            exit 1
          fi
      - name: Build the jar
        run: ./gradlew ${{ matrix.tasks }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.jar }}-${{ matrix.minecraft }}
          path: build/libs/${{ matrix.jar }}-${{ needs.refs.outputs.version }}+mc${{ matrix.minecraft }}.jar
          if-no-files-found: error

  release:
    name: Checksums and release
    needs: [refs, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refs.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
          merge-multiple: true
      - name: Check the jars, write the checksums and the notes
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.refs.outputs.version }}
          REF: ${{ inputs.ref }}
          COMMIT: ${{ needs.refs.outputs.commit }}
        run: |
          set -euo pipefail
          jars=()
          for minecraft in 1.21.11 26.1.2 26.2 26.3; do jars+=("fabricated-$VERSION+mc$minecraft.jar"); done
          for minecraft in 1.21.11 26.1.2 26.2 26.3 1.20.1; do jars+=("fabricated-forge-$VERSION+mc$minecraft.jar"); done
          for jar in "${jars[@]}"; do
            [ -f "dist/$jar" ] || { echo "::error::$jar was not built"; exit 1; }
          done
          if [ "$(ls dist | wc -l)" -ne "${#jars[@]}" ]; then
            echo "::error::dist holds more than the release's jars: $(ls dist | tr '\n' ' ')"
            exit 1
          fi
          (cd dist && sha256sum "${jars[@]}" > SHA256SUMS.txt)
          commit() { echo "[\`${1:0:10}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$1)"; }
          {
            if [ -f "docs/releases/$TAG.md" ]; then cat "docs/releases/$TAG.md"; echo; fi
            echo "## Builds"
            echo
            echo "Built by [the release workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from \`$REF\` at $(commit "$COMMIT"):"
            echo
            echo "- \`fabricated-$VERSION+mc{1.21.11,26.1.2,26.2,26.3}.jar\`: NeoForge."
            echo "- \`fabricated-forge-$VERSION+mc{1.21.11,26.1.2,26.2,26.3}.jar\`: Forge 61, 64, 65 and 66."
            echo "- \`fabricated-forge-$VERSION+mc1.20.1.jar\`: Forge 47."
            echo
            echo "SHA-256 (also in \`SHA256SUMS.txt\`):"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/
            notes.md
          if-no-files-found: error
      - name: Create the release
        if: ${{ inputs.mode != 'build' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          MODE: ${{ inputs.mode }}
          TARGET: ${{ needs.refs.outputs.commit }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "Fabricated $TAG" --notes-file notes.md)
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          [ "$MODE" = publish ] || args+=(--draft)
          gh release create "$TAG" "${args[@]}" dist/*.jar dist/SHA256SUMS.txt
