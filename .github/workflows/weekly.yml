name: Weekly

# Once a week, CI's full matrix with the extended runs on the head of main, forge and forge-legacy, as a run by hand
# makes it (ci.yml's workflow_dispatch: every version, the extended runs): every loader and Minecraft version builds,
# boots a dedicated server and starts a client headlessly with the test mods, and runs the newest loader build and
# the mod corpora. It finds what changed around the code while nothing was pushed: a new loader build, a Fabric mod's
# new release, a download host that moved. Each branch's run is its own, in its own Actions run; this only starts them.
# The schedule runs from the default branch only, so this file is main's alone.

on:
  schedule:
    # Mondays, 04:23 UTC.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Start CI on every branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run ci.yml, extended, on main, forge and forge-legacy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          failed=0
          for branch in main forge forge-legacy; do
            if gh workflow run ci.yml --ref "$branch" -f extended=true; then
              echo "- \`$branch\`: started" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::ci.yml could not be started on $branch"
              failed=1
            fi
          done
          exit "$failed"
