// NeoForge's part of the build for a Minecraft version project (mc/mc.gradle applies this for platform=neoforge):
// ModDevGradle's settings, the in-game mod's neoforge.mods.toml, and how a source set gets the game to compile against.

neoForge {
    version = project.neoforge_version
    // The in-game mod's access transformer (shipped in game-mod.jar and applied by NeoForge at runtime).
    accessTransformers {
        from(rootProject.file('mc/common/src/main/resources/META-INF/accesstransformer.cfg'))
        from(file('src/main/resources/META-INF/accesstransformer-version.cfg'))
    }
    // Compile-time view of the interfaces Fabricated's mixins add at runtime (Fabric API's injected
    // interfaces), so the vendored Fabric API sources compile as they do with Loom: the shared files plus the version's own.
    interfaceInjectionData {
        sharedSources.collect { rootProject.file("mc/$it/interfaces.json") }.findAll { it.exists() }.each { from(it) }
        if (file('interfaces.json').exists()) from(file('interfaces.json'))
    }
}

ext.gameDependencies = { SourceSet sourceSet -> neoForge.addModdingDependenciesTo(sourceSet) }

// Mixin configs only this version ships (from its own src/main/resources), declared in the in-game mod's mods.toml.
def versionMixins = (project.findProperty('version_mixin_configs') ?: '').split(',')*.trim().findAll { it }
        .collect { "[[mixins]]\nconfig=\"${it}\"\n" }.join('\n')
expandProps.version_mixins = versionMixins
expandProps.neoforge_version_range = project.neoforge_version_range

tasks.named('processResources', ProcessResources) {
    filesMatching('META-INF/neoforge.mods.toml') { expand(expandProps) }
}
