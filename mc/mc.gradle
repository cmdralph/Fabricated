// Shared build logic for every Minecraft version project (mc/<platform>/<version>/build.gradle applies this). What is
// specific to the mod loader the target runs on is in mc/platform-<platform>.gradle, which this applies once the source
// sets exist, and the loader classes in loader/<platform> (next to the shared ones in loader/common, and in
// loader/forge-shared for both Forge platforms). The platform is the folder the version's folder is in: neoforge, forge
// or forge-legacy.
//
// Each version project produces build/libs/fabricated-<loader>-<version>+mc<minecraft>.jar in the root project, the
// loader neoforge, or forge for both Forge platforms:
//   - the "loader" source set (the loader's discovery services) plus :core and :fabric-loader-api, which run
//     in the loader's early-services class loader, and
//   - META-INF/fabricated/game-mod.jar, Fabricated's in-game mod (main source set: common code,
//     version-specific code and the native Fabric API modules).
// It also builds the Fabric test mods used by the CI smoke test (build/testmods).

import java.security.MessageDigest

def mcVersion = project.minecraft_version as String
def javaVersion = (project.java_version as String).toInteger()
def releaseName = "${rootProject.fabricated_version}+mc${mcVersion}"
version = releaseName

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaVersion
    // Vendored Fabric API sources use deprecated Minecraft APIs we must not change.
    options.compilerArgs.removeAll(['-Werror'])
    options.compilerArgs.add('-Xlint:-deprecation,-removal,-unchecked,-rawtypes')
}

repositories {
    mavenCentral()
    // Fabric API's module jars, which the projects compile against (below), only ever from Fabric's maven. Declared before
    // the platform's own repositories: an exclusive repository restricts every other one, and a platform plugin may have
    // used its repositories once its script ran (ForgeGradle prepares the game while it configures), after which
    // Gradle can't restrict them.
    exclusiveContent {
        forRepository { maven { name = 'Fabric'; url = 'https://maven.fabricmc.net' } }
        filter { includeGroup 'net.fabricmc.fabric-api' }
    }
}

// Source shared between one platform's versions, in mc/<platform>/<name>, as the version's `shared_sources`
// property lists them. NeoForge's: every version (common), 1.21.1 and 1.21.11 (common121), 1.21.11 and later
// (common12111), 26.x (common26: unobfuscated, with one Fabric API surface), 26.1.2 and 26.2 (common26early: 26.3
// changed the APIs that code uses), and 26.2 and 26.3 (common26late). Forge's are named alike. An entry with a slash is a path from the repository root, for a folder two
// platforms share: mc/forge-shared holds the code Forge 61 to 66 and Forge 47 both compile as it is.
def platform = projectDir.parentFile.name
if (!(platform in ['neoforge', 'forge', 'forge-legacy'])) {
    throw new GradleException("${projectDir} is not in a platform's folder: mc/neoforge, mc/forge or mc/forge-legacy")
}
ext.sharedSources = (project.shared_sources as String).split(',')*.trim().findAll { it }
        .collect { it.contains('/') ? it : "mc/${platform}/${it}" }

// Classes the shared sources name that this version's game names otherwise, as `renamed_classes` lists them (old=new,
// comma-separated): Minecraft 1.21.1's ResourceLocation, which 1.21.11 renamed Identifier. Such a version compiles a copy
// of the shared Java sources with each name replaced, as a whole word (imports, descriptors in strings and comments
// alike), so the sources stay the later versions' own; the compiler checks the rest of what they call. The test sources
// every platform shares (mc/shared) are copied alike.
def renamedClasses = (project.findProperty('renamed_classes') ?: '').split(',')*.trim().findAll { it }.collectEntries {
    def pair = it.split('=')*.trim()
    if (pair.size() != 2 || pair.any { !(it ==~ /[A-Za-z_][A-Za-z0-9_]*/) }) throw new GradleException("renamed_classes: '${it}' isn't old=new")
    [(pair[0]): pair[1]]
}
def renamedJava = { String sourceSet, List<File> dirs ->
    if (renamedClasses.isEmpty()) return dirs
    tasks.register("renamedShared${sourceSet.capitalize()}Java", Sync) {
        from(dirs)
        into(layout.buildDirectory.dir("generated/renamed/${sourceSet}"))
        inputs.property('renamedClasses', renamedClasses)
        filter { String line -> renamedClasses.inject(line) { l, e -> l.replaceAll("\\b${e.key}\\b", e.value) } }
    }
}
def sharedJava = { String sourceSet -> renamedJava(sourceSet, sharedSources.collect { rootProject.file("$it/src/$sourceSet/java") }) }

// The Fabric test mods' sources every platform's project for a Minecraft version builds, in mc/shared/<group>, as the
// version's `testmod_sources` property lists the groups. A group is named by the versions it serves: every version from
// 1.21.1 (1.21.1+), 1.21.1 and 1.21.11 (1.21.x), 1.21.11 and later (1.21.11+), 26.x, 26.1.2 and 26.2 (26.1-26.2), 26.2 and
// later (26.2+), or one version (1.21.1, 1.21.11, 26.1.2, 26.3). They are Fabric mods' code. What a check asks of the
// platform, and the checks of the platform's own hooks, are the platform's half of the test mods: in its shared folders
// and the version's own (src/testmod, src/testmodfrapi), with TestPlatform and FrapiPlatform, which every platform's half
// has, so the shared checks compile against each platform's.
def testSources = (project.findProperty('testmod_sources') ?: '').split(',')*.trim().findAll { it }.collect { "mc/shared/${it}" } + sharedSources
def testJava = { String sourceSet -> renamedJava(sourceSet, testSources.collect { rootProject.file("$it/src/$sourceSet/java") }) }

// NeoForge's loader classes come in two variants, as the version's `loader_variant` property names it: those of FML 10
// and later, on FML's own jar contents and class processors (loader/neoforge/src/fml, the default), and those of NeoForge
// 21.1's FML 4, which runs on ModLauncher (loader/neoforge/src/modlauncher). The rest of loader/neoforge is both's.
def loaderVariant = project.findProperty('loader_variant') ?: (platform == 'neoforge' ? 'fml' : null)

sourceSets {
    loader {
        java.srcDir rootProject.file('loader/common/src/main/java')
        java.srcDir rootProject.file("loader/${platform}/src/main/java")
        if (platform != 'neoforge') java.srcDir rootProject.file('loader/forge-shared/src/main/java')
        resources.srcDir rootProject.file("loader/${platform}/src/main/resources")
        if (loaderVariant) {
            java.srcDir rootProject.file("loader/${platform}/src/${loaderVariant}/java")
            resources.srcDir rootProject.file("loader/${platform}/src/${loaderVariant}/resources")
        }
        resources.srcDir 'src/fabricated/resources'
    }
    main {
        java.srcDirs = ['src/main/java', 'src/fabricapi/java']
        java.srcDir sharedJava('main')
        // The in-game mod's sources every platform shares, in mc/shared: Mod Menu's API, whose screens each platform's
        // mod list shows, and the /fabricated command, which each platform registers.
        java.srcDir renamedJava('everyPlatformMain', [rootProject.file('mc/shared/src/main/java')])
        resources.srcDirs = ['src/main/resources'] + sharedSources.collect { rootProject.file("$it/src/main/resources") }
    }
    testmod {
        java.srcDir testJava('testmod')
        testSources.each { resources.srcDir rootProject.file("$it/src/testmod/resources") }
    }
    // Test sources every platform shares, in mc/shared: the broken test mods,
    testmodbroken {
        java.srcDir renamedJava('testmodbroken', [rootProject.file('mc/shared/src/testmodbroken/java')])
    }
    // stand-ins for other mods' plugin interfaces, which the test mod compiles against (never packaged), with the Mod Menu
    // API the in-game mod provides (not the in-game mod's own classes there),
    testmodstubs {
        java.srcDir renamedJava('testmodstubs', [rootProject.file('mc/shared/src/testmodstubs/java'), rootProject.file('mc/shared/src/main/java')])
        java.exclude 'io/github/cmdralph/fabricated/**'
    }
    // and stand-ins for the APIs of Fabric libraries Fabricated bridges when a mod brings them (Team Reborn's energy
    // API), never packaged: the bridge loads only when the library is present.
    integrationstubs {
        java.srcDir renamedJava('integrationstubs', [rootProject.file('mc/shared/src/integrationstubs/java')])
    }
}

configurations {
    // Library jars merged into the Fabricated jar (core and the Fabric Loader API layer).
    bundled {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        }
    }
}

dependencies {
    loaderImplementation project(':core')
    bundled project(':core')

    // The in-game mod reaches the loader classes through NeoForge's parent class loader at runtime.
    compileOnly sourceSets.loader.output
    compileOnly project(':core')
    compileOnly sourceSets.integrationstubs.output

    // A Fabric mod's view: Fabric Loader's API, Fabricated's, Fabric API (below) and the game; not the in-game mod.
    testmodCompileOnly project(':fabric-loader-api')
    testmodCompileOnly project(':api')
    testmodCompileOnly sourceSets.testmodstubs.output
    testmodCompileOnly sourceSets.integrationstubs.output
    testmodbrokenCompileOnly project(':fabric-loader-api')
}

// Placeholders the resources expand (the platform adds those of its own descriptor).
ext.expandProps = [
        version                : releaseName,
        minecraft_version      : mcVersion,
        minecraft_version_range: project.minecraft_version_range,
        aw_header              : project.aw_header,
        // The resource loader module the test mod uses: v1, or v0 where Fabric API has no v1 yet (1.21.1).
        resource_loader_module : project.findProperty('testmod_resource_loader') ?: 'fabric-resource-loader-v1',
        // The formats in the test mod's built-in pack.mcmeta: a range from 1.21.9, a single pack_format before.
        pack_formats           : project.findProperty('testmod_pack_formats') ?: '"min_format": 82, "max_format": 2048',
        // The same for its built-in resource pack: resource packs take their own formats (a range from 65, 1.21.9's).
        resource_pack_formats  : project.findProperty('testmod_resource_pack_formats') ?: '"min_format": 65, "max_format": 2048',
]

// What a platform's half of a test mod adds to the shared descriptor for the checks of the platform's own hooks: parts of
// a fabric.mod.json (entrypoints by key, mixin configs, nested jars), whose lists are appended to the descriptor's, in
// testmodDescriptor.<source set>, and lines the test mod's access widener ends with, in testmodAccessWidener. The platform
// script adds them.
ext.testmodDescriptor = [testmod: [], testmodfrapi: []]
ext.testmodAccessWidener = []
def joined
joined = { base, part -> base instanceof Map ? part.inject(base) { all, key, value -> all[key] = all.containsKey(key) ? joined(all[key], value) : value; all } : base + part }
def addPlatformHalf = { String sourceSet ->
    tasks.named("process${sourceSet.capitalize()}Resources", ProcessResources) {
        def parts = testmodDescriptor[sourceSet]
        def lines = sourceSet == 'testmod' ? testmodAccessWidener : []
        inputs.property('platformHalf', providers.provider { groovy.json.JsonOutput.toJson([parts, lines]) })
        doLast {
            if (parts) {
                def file = new File(destinationDir, 'fabric.mod.json')
                def descriptor = parts.inject(new groovy.json.JsonSlurper().parse(file)) { all, part -> joined(all, part) }
                file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(descriptor)) + '\n'
            }
            if (lines) new File(destinationDir, 'fabricated-testmod.accesswidener') << lines.collect { it + '\n' }.join()
        }
    }
}

// The platform: its build plugin's settings, its mod descriptor, and gameDependencies(sourceSet), which gives a source
// set the game and the loader to compile against.
apply from: rootProject.file("mc/platform-${platform}.gradle")
[sourceSets.loader, sourceSets.testmod, sourceSets.testmodbroken, sourceSets.testmodstubs].each { gameDependencies(it) }

tasks.named('processResources', ProcessResources) {
    inputs.properties(expandProps)
    // A mixin config owns its whole package, subpackages included: Mixin refuses to load any other class there, so
    // one config's package inside another's makes the inner config's classes unloadable at runtime.
    doLast {
        def packages = [:]
        destinationDir.listFiles().findAll { it.name.endsWith('.mixins.json') }.each { f ->
            def pkg = new groovy.json.JsonSlurper().parse(f).package
            if (pkg) packages[f.name] = pkg
        }
        packages.each { a, pa ->
            packages.each { b, pb ->
                if (a != b && (pb == pa || pb.startsWith(pa + '.'))) {
                    throw new GradleException("Mixin config ${a} (package ${pa}) contains the package of ${b} (${pb})")
                }
            }
        }
    }
}

tasks.named('processTestmodResources', ProcessResources) {
    inputs.properties(expandProps)
    filesMatching(['fabric.mod.json', '*.accesswidener', 'resourcepacks/*/pack.mcmeta']) { expand(expandProps) }
}
addPlatformHalf('testmod')

// --- Generated build facts ---------------------------------------------------------------------------
// What a cached translation depends on besides the mod: Fabricated's own classes and data. Their contents are digested
// in a fixed order (not the jars, whose entries carry timestamps), so rebuilding the same sources keeps players' caches,
// and any change to them translates the mods again without a hand-bumped schema.
def buildContents = files(sourceSets.loader.output, configurations.bundled, sourceSets.main.output)
def contentDigest = { FileCollection roots ->
    def digest = MessageDigest.getInstance('SHA-256')
    roots.files.findAll { it.exists() }.each { root ->
        def contents = new TreeMap<String, byte[]>()
        (root.isDirectory() ? fileTree(root) : zipTree(root)).visit { FileVisitDetails entry ->
            if (!entry.directory) contents[entry.relativePath.pathString] = entry.open().withCloseable { it.readAllBytes() }
        }
        contents.each { path, bytes ->
            digest.update(path.getBytes('UTF-8'))
            digest.update((byte) 0)
            digest.update(bytes)
        }
    }
    digest.digest().encodeHex().toString()
}
def versionProperties = tasks.register('fabricatedVersionProperties', WriteProperties) {
    destinationFile = layout.buildDirectory.file('generated/fabricated/version.properties')
    inputs.files(buildContents)
    property 'fabricated.version', releaseName
    property 'fabricated.build', providers.provider { contentDigest(buildContents) }
    property 'minecraft.version', mcVersion
    property 'namespace', project.namespace
    property 'mixin.fallback', project.mixin_fallback
    property 'mixin.lowest', project.mixin_lowest
    // Names the in-game mod's copy in the translation cache, so that a launch finding it there reads none of the jar (PERF-2).
    def gameModFile = tasks.named('gameModJar', Jar).flatMap { it.archiveFile }
    inputs.files(gameModFile)
    property 'gamemod.sha256', providers.provider {
        MessageDigest.getInstance('SHA-256').digest(gameModFile.get().asFile.bytes).encodeHex().toString()
    }
}

// --- Intermediary (obfuscated Minecraft versions only) ------------------------------------------------
def intermediaryFile = layout.buildDirectory.file('intermediary/intermediary.tiny')
def downloadIntermediary = tasks.register('downloadIntermediary') {
    def commit = project.findProperty('intermediary_commit')
    def expected = project.findProperty('intermediary_sha256')
    enabled = commit != null
    inputs.property('commit', commit ?: 'none')
    inputs.property('sha256', expected ?: 'none')
    outputs.file(intermediaryFile)
    doLast {
        def target = intermediaryFile.get().asFile
        target.parentFile.mkdirs()
        // Build-time download (Fabricated itself never touches the network), pinned to a commit and hash.
        def url = new URI("https://raw.githubusercontent.com/FabricMC/intermediary/${commit}/mappings/${mcVersion}.tiny").toURL()
        def bytes = url.openStream().withCloseable { it.readAllBytes() }
        def actual = MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
        if (actual != expected) {
            throw new GradleException("Intermediary checksum mismatch for ${mcVersion}: expected ${expected}, got ${actual}")
        }
        target.bytes = bytes
    }
}

// --- Which Fabric API module each part of the in-game mod serves (core's NativeModules) --------------------
// When another mod provides a module (Forgified Fabric API, Sodium's bundled modules), Fabricated's part of it stands
// down: so every Fabric API package of the in-game mod must be in the version's native-modules.json, and every mixin of
// a config in Fabricated's own packages in mixin-modules.json.
def checkNativeModules = tasks.register('checkNativeModules') {
    def index = file('src/fabricated/resources/META-INF/fabricated/native-modules.json')
    def classDirs = sourceSets.main.output.classesDirs
    def resourcesDir = sourceSets.main.output.resourcesDir
    dependsOn tasks.named('classes')
    inputs.files(classDirs)
    inputs.file(index).optional()
    onlyIf { index.exists() }
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def indexed = slurper.parse(index).modules.values().flatten() as Set
        def missing = new TreeSet()
        classDirs.each { dir ->
            if (!dir.isDirectory()) return
            dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                def path = dir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                if (path.startsWith('net/fabricmc/fabric/') && path.endsWith('.class')) {
                    def pkg = path.substring(0, path.lastIndexOf('/'))
                    if (!indexed.contains(pkg)) missing << "package ${pkg} (re-run scripts/native-module-index.py)"
                }
            }
        }
        def modulesFile = new File(resourcesDir, 'META-INF/fabricated/mixin-modules.json')
        def mapping = modulesFile.exists() ? slurper.parse(modulesFile) : [configs: [:], mixins: [:]]
        resourcesDir.eachFileMatch(~/.*\.mixins\.json/) { configFile ->
            def config = slurper.parse(configFile)
            if (mapping.configs.containsKey(configFile.name) || (config.package ?: '').startsWith('net.fabricmc.fabric.')) return
            ((config.mixins ?: []) + (config.client ?: []) + (config.server ?: [])).each { mixin ->
                if (!mapping.mixins.containsKey(mixin)) missing << "mixin ${configFile.name}:${mixin} (add it to mixin-modules.json)"
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Parts of the in-game mod no Fabric API module is assigned to:\n  " + missing.join('\n  '))
        }
    }
}

// --- The in-game mod ----------------------------------------------------------------------------------
def gameModJar = tasks.register('gameModJar', Jar) {
    dependsOn checkNativeModules
    archiveFileName = 'game-mod.jar'
    destinationDirectory = layout.buildDirectory.dir('gamemod')
    from sourceSets.main.output
    from(rootProject.file('LICENSE'))
    from(rootProject.file('NOTICE'))
    manifest.attributes(
            'Implementation-Title': 'Fabricated (in-game mod)',
            'Implementation-Version': releaseName)
}

// --- The Fabricated jar players install -----------------------------------------------------------------
def fabricatedJar = tasks.register('fabricatedJar', Jar) {
    group = 'build'
    description = 'Builds the Fabricated jar for Minecraft ' + mcVersion
    archiveBaseName = platform == 'neoforge' ? 'fabricated-neoforge' : 'fabricated-forge'
    archiveVersion = releaseName
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.FAIL

    from sourceSets.loader.output
    // The closure defers resolution; dependsOn makes Gradle build :core and :fabric-loader-api jars first.
    dependsOn configurations.bundled
    from({ configurations.bundled.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(gameModJar) { into 'META-INF/fabricated' }
    from(versionProperties) { into 'META-INF/fabricated' }
    if (project.findProperty('intermediary_commit') != null) {
        from(downloadIntermediary) { into 'META-INF/fabricated' }
    }
    from(rootProject.file('LICENSE'))
    from(rootProject.file('NOTICE'))
    manifest.attributes(
            'FMLModType': 'LIBRARY',
            'Automatic-Module-Name': 'io.github.cmdralph.fabricated',
            'Implementation-Title': 'Fabricated',
            'Implementation-Version': releaseName,
            'Implementation-Vendor': 'Fabricated contributors')
}

tasks.named('assemble') { dependsOn fabricatedJar }

// --- CI test mods -----------------------------------------------------------------------------------------
def testmodsDir = layout.buildDirectory.dir('testmods')
def testmodJar = tasks.register('testmodJar', Jar) {
    archiveFileName = 'fabricated-testmod.jar'
    destinationDirectory = testmodsDir
    from sourceSets.testmod.output
}

// Forge: a Fabric mod the test mod nests twice over, as a jar built for Fabric and NeoForge at once nests its libraries
// (LambDynamicLights): in META-INF/jars, listed by fabric.mod.json and by a NeoForge jar-in-jar list. Forge's jar-in-jar
// locator must leave it to Fabricated, which translates it (JIJ-1); the nested mod checks it loaded once.
if (platform != 'neoforge') {
    sourceSets {
        testmodnested {
            java.srcDir rootProject.file('mc/forge-shared/src/testmodnested/java')
            resources.srcDir rootProject.file('mc/forge-shared/src/testmodnested/resources')
            compileClasspath = sourceSets.testmod.compileClasspath
        }
    }
    def nestedTestmodJar = tasks.register('nestedTestmodJar', Jar) {
        archiveFileName = 'fabricated-forge-nested.jar'
        destinationDirectory = layout.buildDirectory.dir('testmodnested')
        from sourceSets.testmodnested.output
    }
    testmodJar.configure {
        from(nestedTestmodJar) { into 'META-INF/jars' }
        from(rootProject.file('mc/forge-shared/src/testmodnested/jarjar')) { into 'META-INF/jarjar' }
    }
}

def brokenMods = [
        'throws'  : ['io/github/cmdralph/fabricated/testmod/broken/ThrowingMod.class'],
        'missing' : [],
        'badmixin': ['io/github/cmdralph/fabricated/testmod/broken/mixin/ImpossibleMixin.class',
                     'io/github/cmdralph/fabricated/testmod/broken/mixin/UnmatchedCallMixin.class'],
        'shade'   : ['com/google/gson/internal/FabricatedShadedCopy.class'],
]
def brokenJars = brokenMods.collect { name, classes ->
    tasks.register("testmod${name.capitalize()}Jar", Jar) {
        archiveFileName = "fabricated-testmod-${name}.jar"
        destinationDirectory = testmodsDir
        inputs.properties(expandProps)
        if (!classes.isEmpty()) {
            from(sourceSets.testmodbroken.output.classesDirs) { include(classes) }
            dependsOn tasks.named('compileTestmodbrokenJava')
        }
        from(rootProject.file("mc/shared/src/testmodbroken/resources/${name}")) {
            filesMatching('fabric.mod.json') { expand(expandProps) }
        }
    }
}

tasks.register('testmods') {
    group = 'verification'
    description = 'Builds the Fabric test mods used by the CI smoke test'
    dependsOn testmodJar
    dependsOn brokenJars
}

// --- A Fabric mod using Fabric's renderer API, for the client smoke test with Fabric API (ci/smoke-client.sh)
sourceSets {
    testmodfrapi {
        java.srcDir testJava('testmodfrapi')
        testSources.each { resources.srcDir rootProject.file("$it/src/testmodfrapi/resources") }
    }
}
gameDependencies(sourceSets.testmodfrapi)
dependencies {
    testmodfrapiCompileOnly project(':fabric-loader-api')
}
tasks.named('processTestmodfrapiResources', ProcessResources) {
    inputs.properties(expandProps)
    filesMatching('fabric.mod.json') { expand(expandProps) }
}
addPlatformHalf('testmodfrapi')
def frapiTestmodJar = tasks.register('testmodFrapiJar', Jar) {
    archiveFileName = 'fabricated-testmod-frapi.jar'
    destinationDirectory = testmodsDir
    from sourceSets.testmodfrapi.output
}
// Not where the version has none: NeoForge would report a jar without its fabric.mod.json as a broken mod file.
if ((testSources.collect { rootProject.file(it) } + [projectDir]).any { new File(it, 'src/testmodfrapi/resources/fabric.mod.json').isFile() }) {
    tasks.named('testmods') { dependsOn frapiTestmodJar }
}

// --- Fabric API, at compile time only ----------------------------------------------------------------------------
// The module jars of the Fabric API release in this version's plan; Fabricated never ships them. The in-game mod compiles
// against the plan's pass-through modules, which the player's Fabric API provides at runtime (its own sources are the
// native ones): code that uses one only runs once that module is loaded, and its calls are typed and checked. The test
// mods compile against all of Fabric API, as a Fabric mod does. In the game's names, Mojang's: as published where the
// game is unobfuscated (26.x), and remapped from Intermediary's by core's own remapper where it isn't
// (remapFabricApi). fabricApi(modules) gives those modules' jars so, and fabricApi() all of them, to a version's own
// build script too; fabricApiAsPublished(modules) gives them as published, for code compiled in Intermediary's names, as
// Fabric mods for an obfuscated version are: a test mod compiled so says it with testmod_namespace=INTERMEDIARY.
def fabricApiPlan = new groovy.json.JsonSlurper().parse(file('src/fabricated/resources/META-INF/fabricated/fabric-api-plan.json'))
def fabricApiRelease = configurations.detachedConfiguration(dependencies.create("net.fabricmc.fabric-api:fabric-api:${fabricApiPlan.fabricApiVersion}"))
// The modules' own jars (every module's for null), not the release's jar, which nests them.
def publishedModules = { Collection<String> modules ->
    fabricApiRelease.incoming.artifactView {
        componentFilter {
            it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier && it.module != 'fabric-api' && (modules == null || it.module in modules)
        }
    }.artifacts
}
ext.fabricApiAsPublished = { Collection<String> modules = null -> publishedModules(modules).artifactFiles }
if (project.namespace == 'INTERMEDIARY') {
    // Mojang's mappings of the game: the platform's (mojangMappings, a provider of the file), else those ModDevGradle's
    // NeoForm run downloads for the game (NeoForge's and legacy Forge's builds), written out where the task is told.
    def mojangMappings = project.findProperty('mojangMappings')
    if (mojangMappings == null) {
        def written = layout.buildDirectory.file('mojang/client_mappings.txt')
        mojangMappings = tasks.named('createMinecraftArtifacts') {
            additionalResults.put('node.downloadClientMappings.output.output', written.get().asFile)
        }.map { written.get() }
    }
    // core's remapper, run by remapFabricApi on core's classes: build time only.
    sourceSets {
        fabricapiremap {
            java.srcDirs = [rootProject.file('mc/shared/src/fabricapiremap/java')]
        }
    }
    dependencies {
        fabricapiremapImplementation project(':core')
        fabricapiremapRuntimeOnly "org.ow2.asm:asm-commons:${asm_version}"
    }
    def allModules = publishedModules(null)
    def remapped = layout.buildDirectory.dir('fabricapi-mojang')
    def remapFabricApi = tasks.register('remapFabricApi', JavaExec) {
        description = "Remaps Fabric API's module jars from Intermediary's names to Mojang's, to compile against"
        classpath = sourceSets.fabricapiremap.runtimeClasspath
        mainClass = 'io.github.cmdralph.fabricated.fabricapiremap.RemapFabricApi'
        inputs.files(downloadIntermediary).withPropertyName('intermediary').withPathSensitivity(PathSensitivity.NONE)
        inputs.files(mojangMappings).withPropertyName('mojangMappings').withPathSensitivity(PathSensitivity.NONE)
        inputs.files(allModules.artifactFiles).withPropertyName('modules').withNormalizer(ClasspathNormalizer)
        outputs.dir(remapped).withPropertyName('remapped')
        outputs.cacheIf { true }
        argumentProviders.add({
            [intermediaryFile.get().asFile.path, mojangMappings.get().asFile.path, remapped.get().asFile.path] +
                    allModules.resolvedArtifacts.get().collect { "${(it.id.componentIdentifier as org.gradle.api.artifacts.component.ModuleComponentIdentifier).module}=${it.file.path}" }
        } as CommandLineArgumentProvider)
    }
    ext.fabricApi = { Collection<String> modules = null ->
        files(remapFabricApi).asFileTree.matching { include(modules == null ? ['*.jar'] : modules.collect { "${it}.jar" }) }
    }
} else {
    ext.fabricApi = fabricApiAsPublished
}
dependencies {
    compileOnly fabricApi(fabricApiPlan.modules.findAll { it.value.plan == 'passthrough' }.keySet())
    integrationstubsCompileOnly fabricApi(['fabric-transfer-api-v1'])
    testmodCompileOnly(project.findProperty('testmod_namespace') == 'INTERMEDIARY' ? fabricApiAsPublished() : fabricApi())
    testmodfrapiCompileOnly fabricApi()
}
