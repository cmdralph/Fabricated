# Minecraft 26.2 on Minecraft Forge 65 (the forge branch; docs/PORTING.md §4 and §7). The project is named
# forge-26.2 next to main's NeoForge project mc/26.2.
minecraft_version=26.2
forge_version=65.1.0
java_version=25
# Forge's part of the build (mc/platform-forge.gradle) and its discovery services (loader/forge).
platform=forge
loader_dir=forge
# Source shared by the forge branch's projects (mc/forge-common); main's mc/common is NeoForge's (mc/mc.gradle).
shared_sources=forge-common
# 26.x is unobfuscated: Fabric mods use Mojang's names, as Forge runs the game.
namespace=OFFICIAL
# Placeholders until the discovery adapter (F3) settles what core assumes: Forge 65 ships upstream Mixin 0.8.7.
mixin_lowest=0.8.7
mixin_fallback=0.8.7
forge_version_range=[65,)
minecraft_version_range=[26.2,26.3)
aw_header=classTweaker v1 official
