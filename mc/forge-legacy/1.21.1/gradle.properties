# Minecraft 1.21.1 on Minecraft Forge 52: the project :mc:forge-legacy-1.21.1.
minecraft_version=1.21.1
forge_version=52.1.21
java_version=21
# ForgeGradle 7 builds it, as it builds Forge 61 to 66 (mc/platform-forge.gradle): ModDevGradle's legacyforge plugin
# stops at 1.20.1. Below the game Forge 52 is Forge 61's (securemodules, Mixin 0.8.7, Mojang's names): its discovery
# services are loader/forge-shared's modern variant (mc/mc.gradle).
platform_build=forge
# The code it compiles as other Forge versions do is in mc/forge-shared: what every Forge version compiles, and its
# groups that serve 1.21.1 (with Forge 47: 1.20.1-1.21.1; with Forge 61 to 66: 1.21.1+; with Forge 61: 1.21.x).
shared_sources=mc/forge-shared
# Forge runs 1.21.1 with Mojang's names: Fabric mods are remapped from Intermediary. The shared sources name 1.21.11's
# Identifier, which 1.21.1 calls ResourceLocation (mc/mc.gradle).
namespace=INTERMEDIARY
renamed_classes=Identifier=ResourceLocation
# Fabric Intermediary 1.21.1 (CC0), as for NeoForge's mc/neoforge/1.21.1: the composer's other half, with the Mojang
# mappings Forge's installer leaves among the libraries.
intermediary_commit=2f69d5496ad149fcbd63cab81bd0e3b33297734c
intermediary_sha256=83071b5b17866658463255f5f21430ade2a49ce2dd089dc3c14de1e93b99211c
# The Mixin release the running Mixin is judged as (pre-flight, behaviour versions): Forge 52 ships upstream Mixin 0.8.7.
mixin_lowest=0.8.7
mixin_fallback=0.8.7
# MixinExtras (MIT) for Fabric mods, which Fabric Loader ships and Forge 52 doesn't: its Forge build, nested in the
# in-game mod (mc/forge-mixinextras.gradle).
mixinextras_version=0.5.5
forge_version_range=[52,)
minecraft_version_range=[1.21.1,1.21.2)
# The in-game mod's mixin configs besides those of the shared Forge sources (mc/platform-forge.gradle): the native key
# binding and particle modules' (client).
game_mod_mixins=fabricated-forge-color.mixins.json,fabricated-keybinding.mixins.json,fabricated-particles.mixins.json
# The test mod's access widener is a class tweaker: Forge's half of it injects an interface (mc/platform-forge.gradle).
aw_header=classTweaker v1 named
# Fabric API 0.116 has fabric-resource-loader-v0 only: the test mod depends on it (mc/mc.gradle).
testmod_resource_loader=fabric-resource-loader-v0
# Its built-in packs declare the data and resource pack formats 1.21.1 reads (mc/mc.gradle).
testmod_pack_formats="pack_format": 48
testmod_resource_pack_formats="pack_format": 34
# CI only (ci.yml): Modrinth version ids of the Forge mods that must construct and call the test mod's plugins (the
# recipe viewers, tooltip mods and Simple Voice Chat that have a Forge build for 1.21.1: REI and Jade have none)
ci_plugin_hosts=jei@qVF5T46z wthit@cCQhpuXM simple-voice-chat@4LuAeiNl
