# Fabric API's sources (Apache-2.0) at this tag, for the modules Fabricated ships natively on Forge 52 (see
# fabric-api-plan.json), migrated to Mojang's names as scripts/import-fabric-api.sh --yarn does (the same files as
# NeoForge's mc/neoforge/1.21.1/src/fabricapi, imported from the same tag). Of fabric-content-registries-v0's API, only
# the two interfaces it puts in fabric-api-base's package net.fabricmc.fabric.api.util. The loot builders' copies are
# changed where Forge's toolchain injects no interfaces at compile time (src/fabricapi-overrides). The implementations
# are in src/main and mc/forge-shared: upstream's loot accessor and builder mixins, its loading hook replaced by Forge's
# loot table event (LootBridge); Fabricated's key binding registry, which keeps the key bindings for Forge's key mapping
# event, and upstream's accessor (KEYMAP-3); and the particle factories registered through the particle engine's own
# methods.
