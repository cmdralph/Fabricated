# What upstream's access wideners open of the modules Fabricated ships natively on Forge 43 (fabric-api-plan.json), in
# Forge 43's names: on Fabric a mod's widener opens the game to every mod, and Fabric mods rely on it, as BCLib sets
# BiomeGenerationSettings' feature set without @Mutable (BIOME-6). Of the native modules only fabric-biome-api-v1
# (9.1.1) and fabric-particles-v1 (1.1.0) have one.
