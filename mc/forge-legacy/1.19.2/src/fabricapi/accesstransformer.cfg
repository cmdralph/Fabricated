# fabric-biome-api-v1, but Biome's climate field (f_47437_), which upstream's widener opens: Forge 43's coremod
# (field_to_method.js) reads it through getModifiedClimateSettings and needs it private; and the biome source's set of
# possible biomes (f_47891_), which Forge 43 replaced with a lazy supplier of its own.
