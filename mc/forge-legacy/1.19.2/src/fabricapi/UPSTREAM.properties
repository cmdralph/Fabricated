# Fabric API's sources (Apache-2.0) at this tag, for the modules Fabricated ships natively on Forge 43 (see
# fabric-api-plan.json). Upstream's 1.19.2 sources name the game in Yarn's names: these were renamed by hand to
# Mojang's, which the in-game mod compiles against, the API otherwise as upstream's (scripts/import-fabric-api.sh copies
# sources as they are, for the versions upstream writes in Mojang's names). Of fabric-content-registries-v0's API, only
# the two interfaces it puts in fabric-api-base's package net.fabricmc.fabric.api.util; fabric-loot-tables-v1 is
# upstream's deprecated/fabric-loot-tables-v1. The native modules' implementations are in src/main, and those that read
# the same on 1.20.1 in mc/forge-legacy/common: the loot modules' upstream's, their loading hook rewritten for Forge 43
# (LootTablesMixin, in place of LootManagerMixin) and the pools read as Forge's list; fabric-dimensions-v1's upstream's,
# its End hook moved onto Forge's teleporter (EntityMixin, FabricTargetTeleporter), without its level storage and
# dedicated server hooks, whose fixes Forge 43 makes itself; fabric-biome-api-v1's upstream's, its modifications applied
# as a Forge biome modifier and its biome sets read through Forge's lazy supplier of a source's biomes;
# fabric-particles-v1's upstream's, its factories and their sprite sets registered through the particle engine's own
# methods, as Forge 43 keeps the factories by the type's id; fabric-key-binding-api-v1's Fabricated's registry, keeping
# the key bindings for Forge's key mapping event, and upstream's accessor (KEYMAP-3).
