plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge'
}

apply from: rootProject.file('mc/mc.gradle')

// The pass-through modules the in-game mod calls besides those its plan lists (an unlisted module passes through).
dependencies {
    compileOnly fabricApi(['fabric-api-lookup-api-v1', 'fabric-content-registries-v0', 'fabric-item-api-v1',
            'fabric-lifecycle-events-v1', 'fabric-recipe-api-v1', 'fabric-registry-sync-v0', 'fabric-resource-conditions-api-v1',
            'fabric-transfer-api-v1'])
}

// The test mod's own part of 1.19.2's model loader checks: 1.19.2 reads only the models something asks for.
testmodDescriptor.testmod << [entrypoints: [client: ['io.github.cmdralph.fabricated.forgetest.ForgeModelLoaderClient']]]
