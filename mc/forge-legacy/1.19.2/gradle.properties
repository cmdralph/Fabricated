# Minecraft 1.19.2 on Minecraft Forge 43 (docs/PORTING.md §3 and §7): the project :mc:forge-legacy-1.19.2.
minecraft_version=1.19.2
# ModDevGradle's legacyforge plugin takes the Minecraft version with the Forge build.
forge_version=1.19.2-43.5.2
java_version=17
# Its platform's part of the build is mc/platform-forge-legacy.gradle; its discovery services are loader/forge-shared's,
# with Forge 47's variant below the game (fml47), whose securejarhandler, Mixin and SRG names Forge 43 shares (mc/mc.gradle).
loader_variant=fml47
# The code it compiles as Forge 47 does is in mc/forge-legacy/common, and what it compiles as Forge 47, 52 and 61 to 66 do
# in mc/forge-shared, by version group (mc/mc.gradle).
shared_sources=common,mc/forge-shared
# Fabric mods for 1.19.2 are in Intermediary's names, remapped to the names Forge 1.19.2 runs with: Mojang's class names
# and SRG member names (MappingComposer.composeSrg, from the mappings Forge's installer leaves; the fml47 variant).
namespace=INTERMEDIARY
# The test mods are compiled in Mojang's names and installed in Intermediary's, as a Fabric mod for 1.19.2 is published
# (mc/platform-forge-legacy.gradle). The shared sources name 1.21.11's Identifier, which 1.19.2 calls ResourceLocation,
# and 1.19.3's BuiltInRegistries, whose registries 1.19.2 keeps in Registry.
renamed_classes=Identifier=ResourceLocation,net.minecraft.core.registries.BuiltInRegistries=net.minecraft.core.Registry,BuiltInRegistries=Registry
# Fabric Intermediary 1.19.2 (CC0), downloaded at build time from this commit and verified.
intermediary_commit=916868752f6935dda70c4490404641a701335d81
intermediary_sha256=e6ffae7d65077b1b73fa95e5c06c9e1d32445bb43504d672559088a8b0706ca2
# The Mixin release the running Mixin is judged as (pre-flight, behaviour versions): Forge 43 ships Mixin 0.8.5, as Forge
# 47 does.
mixin_lowest=0.8.5
mixin_fallback=0.8.5
# MixinExtras (MIT) for Fabric mods, which Fabric Loader ships and Forge 43 doesn't: its Forge build, nested in the
# in-game mod (mc/forge-mixinextras.gradle).
mixinextras_version=0.5.5
# Mixin's annotation processor, which writes the in-game mod's refmap (mc/platform-forge-legacy.gradle): Forge 43's
# Mixin.
mixin_processor_version=0.8.5
forge_version_range=[43,)
minecraft_version_range=[1.19.2,1.19.3)
# The test mod's access widener is a class tweaker: Forge's half of it injects an interface.
aw_header=classTweaker v1 named
# The formats in the test mod's built-in packs' pack.mcmeta: 1.19.2's data and resource pack formats.
testmod_pack_formats="pack_format": 10
testmod_resource_pack_formats="pack_format": 9
# CI only (ci.yml): Modrinth version ids of the Forge mods that must construct and call the test mod's plugins (the
# recipe viewers, tooltip mods and Simple Voice Chat)
ci_plugin_hosts=jei@csoSOse9 rei@AVljjerh jade@kp0HjPre wthit@FuMynGus simple-voice-chat@Iof3EIEK
# Fabric API 0.77's POM leaves its deprecated modules out (fabric-loot-tables-v1 among them): they are in a POM of their
# own (mc/mc.gradle).
fabric_api_deprecated_pom=separate
