# Fabric API's sources (Apache-2.0) at this tag, for the modules Fabricated ships natively on Forge 47 (see
# fabric-api-plan.json). Upstream's 1.20.1 sources name the game in Yarn's names: these were renamed by hand to Mojang's,
# which the in-game mod compiles against, the API otherwise as upstream's (scripts/import-fabric-api.sh copies sources
# as they are, for the versions upstream writes in Mojang's names). Of fabric-content-registries-v0's API, only the two
# interfaces it puts in fabric-api-base's package net.fabricmc.fabric.api.util; fabric-loot-tables-v1 is upstream's
# deprecated/fabric-loot-tables-v1. The loot modules' implementations are in src/main: upstream's, its loading hook
# rewritten for Forge 47 (LootDataManagerMixin, in place of LootManagerMixin) and the pools read as Forge's list.
# fabric-dimensions-v1's implementation is in src/main too: upstream's, its End hook moved onto Forge's teleporter
# (EntityMixin, FabricTargetTeleporter), without its codec hook (Forge 47 patches that codec itself) or the DataFixerUpper
# mixins, which Forge 47 can't apply. fabric-particles-v1's implementation is in src/main too: upstream's, its factories
# and their sprite sets registered through the particle engine's own methods, as Forge 47 keeps the factories by the
# type's id (upstream's accessor read them by raw id).
