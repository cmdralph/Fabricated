# 47.4.28's game): on Fabric a mod's widener opens the game to every mod, and Fabric mods rely on it, as BCLib sets
# BiomeGenerationSettings' feature set without @Mutable (BIOME-6). Of the native modules only fabric-biome-api-v1
# (13.0.15) and fabric-particles-v1 (1.1.3) have one.
