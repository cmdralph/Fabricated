# Minecraft 26.3 on Minecraft Forge 66 (the forge branch; docs/PORTING.md §4 and §7). The project is named
# forge-26.3 next to main's NeoForge project mc/26.3.
minecraft_version=26.3
forge_version=66.1.0
java_version=25
# Forge's part of the build (mc/platform-forge.gradle) and its discovery services (loader/forge).
platform=forge
loader_dir=forge
# Source shared by the forge branch's projects (mc/forge-common) and its 26.x ones (mc/forge-common26); main's mc/common
# is NeoForge's (mc/mc.gradle).
shared_sources=forge-common,forge-common26
# 26.x is unobfuscated: Fabric mods use Mojang's names, as Forge runs the game.
namespace=OFFICIAL
# Placeholders until the discovery adapter (F3) settles what core assumes: Forge 66 ships upstream Mixin 0.8.7.
mixin_lowest=0.8.7
mixin_fallback=0.8.7
forge_version_range=[66,)
minecraft_version_range=[26.3,26.4)
aw_header=classTweaker v1 official
