# Minecraft 26.3 (unobfuscated). NeoForge's 26.3 line is stable (its 26.3.0-stable tag).
minecraft_version=26.3
neoforge_version=26.3.0.95
java_version=25
# Source folders in mc/neoforge this version shares with NeoForge's other versions (mc/mc.gradle).
shared_sources=common,common12111,common26,common26late
namespace=OFFICIAL
# Lowest Mixin behaviour version FML accepts (MixinFacade.DEFAULT_BEHAVIOUR_VERSION)
mixin_lowest=0.17.1
mixin_fallback=0.17.4+mixin.0.8.7
neoforge_version_range=[26.3,26.4)
minecraft_version_range=[26.3,26.4)
aw_header=classTweaker v1 official
# Mixin configs only this version ships (see mc.gradle)
version_mixin_configs=fabricated-biome.mixins.json
# CI only (build.yml): Modrinth version ids of the NeoForge mods that must construct and call the test mod's plugins
# (no WTHIT build for 26.3)
ci_plugin_hosts=jei@3EynCW85 rei@uwE0PJmc jade@dVB8U7Td simple-voice-chat@3rpCvvMZ
# CI only (build.yml): Modrinth version ids of the NeoForge builds of Sodium and Iris for the Sodium client, a pair
# that works together: the newest builds of each may not (CI-4)
ci_renderers=sodium@SS023RVV iris@Ag5S66CF
# CI only (build.yml): Modrinth version ids of the Fabric builds of Sodium and Iris for the extended run's client
# with them, a pair that works together (CI-4)
