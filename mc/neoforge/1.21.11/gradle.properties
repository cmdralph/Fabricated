# Minecraft 1.21.11 (obfuscated; Fabric mods use Intermediary names and are remapped).
minecraft_version=1.21.11
neoforge_version=21.11.45
java_version=21
# Source folders in mc/neoforge this version shares with NeoForge's other versions (mc/mc.gradle).
shared_sources=common,common121,common12111
# The Fabric test mods' sources it shares with every platform's projects for these Minecraft versions, in
# mc/shared/<group> (mc/mc.gradle).
testmod_sources=1.21.1+,1.21.x,1.21.11+,1.21.11
namespace=INTERMEDIARY
# Lowest Mixin behaviour version FML accepts (MixinFacade.DEFAULT_BEHAVIOUR_VERSION)
mixin_lowest=0.16.5
mixin_fallback=0.16.5+mixin.0.8.7
neoforge_version_range=[21.11,21.12)
minecraft_version_range=[1.21.11,1.21.12)
aw_header=accessWidener v2 named
# Fabric Intermediary 1.21.11 (CC0), downloaded at build time from this commit and verified.
intermediary_commit=916868752f6935dda70c4490404641a701335d81
