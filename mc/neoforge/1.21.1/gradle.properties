# Minecraft 1.21.1 (obfuscated; Fabric mods use Intermediary names and are remapped).
minecraft_version=1.21.1
neoforge_version=21.1.265
java_version=21
# Source folders in mc/neoforge this version shares with NeoForge's other versions (mc/mc.gradle).
shared_sources=common
# The shared sources call the game's ResourceLocation by its 1.21.11 name (mc/mc.gradle).
renamed_classes=Identifier=ResourceLocation
namespace=INTERMEDIARY
# NeoForge 21.1's FML 4 discovers mods as later ones do, but runs on ModLauncher: its loader classes are
# loader/neoforge/src/modlauncher's (mc/mc.gradle).
loader_variant=modlauncher
# FML 4 reads no Mixin behaviour version from a mod's metadata: its Mixin applies every config at its own (UNVERIFIED
# until checked against the runtime), so the lowest it accepts is the one it runs.
mixin_lowest=0.16.4
mixin_fallback=0.16.4+mixin.0.8.7
neoforge_version_range=[21.1,21.2)
minecraft_version_range=[1.21.1,1.21.2)
aw_header=accessWidener v2 named
# Fabric Intermediary 1.21.1 (CC0), downloaded at build time from this commit and verified.
intermediary_commit=2f69d5496ad149fcbd63cab81bd0e3b33297734c
intermediary_sha256=83071b5b17866658463255f5f21430ade2a49ce2dd089dc3c14de1e93b99211c
# Mixin configs only this version ships (see mc.gradle)
version_mixin_configs=fabricated-biome.mixins.json,fabricated-entity-events.mixins.json,fabricated-object-builder.mixins.json
