plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('mc/mc.gradle')

// The nullness annotations the shared sources use, which NeoForge ships from 21.11 on: compile-time only, as a missing
// annotation class is no error at runtime.
def jspecify = "org.jspecify:jspecify:${jspecify_version}"
dependencies {
    compileOnly jspecify
    testmodCompileOnly jspecify
    testmodfrapiCompileOnly jspecify
}
