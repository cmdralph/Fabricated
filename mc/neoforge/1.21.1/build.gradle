plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('mc/mc.gradle')

dependencies {
    // The nullness annotations the shared sources use, which NeoForge ships from 21.11 on: compile-time only, as a
    // missing annotation class is no error at runtime.
    compileOnly 'org.jspecify:jspecify:1.0.0'
    testmodCompileOnly 'org.jspecify:jspecify:1.0.0'
}
