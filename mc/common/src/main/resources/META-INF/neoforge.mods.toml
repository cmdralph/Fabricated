# Fabricated's in-game mod. Its sibling library (the jar you install) loads Fabric mods during discovery.
modLoader="javafml"
loaderVersion="*"
license="GPL-3.0"
issueTrackerURL="https://github.com/cmdralph/Fabricated/issues"

[[mods]]
modId="fabricated"
version="${version}"
displayName="Fabricated"
authors="Ralph Turner and Fabricated contributors"
displayURL="https://github.com/cmdralph/Fabricated"
description='''
Loads Fabric mods and libraries on NeoForge. Native Fabric API modules and NeoForge bridges live here.
Diagnostics: logs/fabric-bridge-report.txt and the /fabricated command.
'''

# Adds Fabric API's injected interfaces (networking contexts, resources, registries, mob effects, entity and block
# entity type builders) and Fabricated's hooks for its native modules: fields, methods, hooks that only observe (a
# constructor end, EntityType.Builder.build's result, a block's removal), and, where NeoForge has no event, the few
# interaction hooks upstream has (they change nothing unless a Fabric listener answers).
[[mixins]]
config="fabricated.mixins.json"

# Fabric API's own accessor interfaces, under their upstream names (used by its networking API).
[[mixins]]
config="fabricated-fabric-api.mixins.json"

# Fabric API's loot builder, accessor and drop mixins, unchanged from upstream (fabric-loot-api-v3).
[[mixins]]
config="fabricated-loot.mixins.json"

# Fabric API's content registry mixins, unchanged from upstream except where NeoForge rewrote the target
# (fabric-content-registries-v0; see the version's config).
[[mixins]]
config="fabricated-content-registries.mixins.json"

# Fabric API's lookup and transfer mixins, unchanged from upstream except the container ones NeoForge's patches
# required rewriting (fabric-api-lookup-api-v1, fabric-transfer-api-v1). One config per package: a config owns
# its whole package, so a shared parent package would make every other Fabric API mixin class unloadable.
[[mixins]]
config="fabricated-lookup.mixins.json"

[[mixins]]
config="fabricated-transfer.mixins.json"

# Fabric's renderer API defaults that keep NeoForge's model data and ambient occlusion (26.x; loaded only with the
# renderer API, which 1.21.11 doesn't support, so that version has no such config).
[[mixins]]
config="fabricated-renderer.mixins.json"
requiredMods=["fabric_renderer_api_v1"]

# Access for the vendored Fabric API sources (see the file).
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

# Access needed only on this Minecraft version (from mc/<version>/src/main/resources).
[[accessTransformers]]
file="META-INF/accesstransformer-version.cfg"

[[dependencies.fabricated]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.fabricated]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
