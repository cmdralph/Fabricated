# Minecraft 26.3 (unobfuscated). NeoForge's 26.3 line is stable (its 26.3.0-stable tag).
minecraft_version=26.3
neoforge_version=26.3.0.95
java_version=25
# Source folders in mc/ this version shares with others (mc/mc.gradle).
shared_sources=common,common26,common26late
namespace=OFFICIAL
# Lowest Mixin behaviour version FML accepts (MixinFacade.DEFAULT_BEHAVIOUR_VERSION)
mixin_lowest=0.17.1
mixin_fallback=0.17.4+mixin.0.8.7
neoforge_version_range=[26.3,26.4)
minecraft_version_range=[26.3,26.4)
aw_header=classTweaker v1 official
# Mixin configs only this version ships (see mc.gradle)
version_mixin_configs=fabricated-biome.mixins.json
