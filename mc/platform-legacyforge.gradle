// Forge 1.20.1's part of the build for a Minecraft version project (mc/mc.gradle applies this for
// platform=legacyforge): ModDevGradle's legacyforge settings, the in-game mod's mods.toml, and how a source set gets the
// game to compile against.

legacyForge {
    version = project.forge_version
}

ext.gameDependencies = { SourceSet sourceSet -> legacyForge.addModdingDependenciesTo(sourceSet) }

expandProps.forge_version_range = project.forge_version_range

tasks.named('processResources', ProcessResources) {
    filesMatching('META-INF/mods.toml') { expand(expandProps) }
}

// mc/common's stand-ins for other mods' plugin interfaces name 1.21's classes (Identifier); this version's test mod uses
// none of them, but stand-ins for the game classes it names in Intermediary's names, as a Fabric mod does.
sourceSets.testmodstubs.java.srcDirs = [file('src/testmodstubs/java')]
// It also uses Fabric API's biome, loot and dimensions modules, which Fabricated provides itself (in the in-game mod, in
// Mojang's names), in Intermediary's names as a Fabric mod is compiled against Fabric API: those stand-ins come first.
sourceSets.testmod.compileClasspath = sourceSets.testmodstubs.output + sourceSets.testmod.compileClasspath

// --- The in-game mod in Forge 47's names -----------------------------------------------------------------------------
// Forge 1.20.1 runs the game with SRG's member names. The in-game mod compiles against Mojang's: the copy nested in the
// Fabricated jar is reobfuscated (below), and the refmap of its mixins, which Mixin's annotation processor writes, names
// their targets in SRG's. Forge reads a mod's mixin configs from its manifest. All of them share the one refmap.
def gameModMixins = [
        'fabricated-forge.mixins.json',
        // Native fabric-biome-api-v1's biome source mixins (upstream's) and the accessors its modifications use.
        'fabricated-biome.mixins.json',
        // Native fabric-loot-api-v2's and fabric-loot-tables-v1's (upstream's, in one package): the builder mixins, and
        // the loot tables' events from the loot data manager's apply.
        'fabricated-loot.mixins.json',
        // Native fabric-dimensions-v1's: upstream's teleport target hook, and its End hook on Forge's teleporter.
        'fabricated-dimension.mixins.json']
dependencies {
    annotationProcessor "org.spongepowered:mixin:${project.mixin_processor_version}:processor"
    // The in-game mod's own mixins use MixinExtras' injectors, which the nested mixinextras-forge (below) provides. Its
    // annotation processor has Mixin's write their targets to the refmap too: Mixin's knows only its own injectors, and
    // left a vanilla method a MixinExtras injector names (LivingEntity.travel) in Mojang's name.
    compileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
}
def gameModRefmap = mixin.add(sourceSets.main, 'fabricated-forge.refmap.json')
gameModMixins.each { mixin.config(it) }

// --- MixinExtras for Fabric mods --------------------------------------------------------------------------------------
// Fabric Loader ships MixinExtras and Forge 47 doesn't. Its Forge build, a game library that starts MixinExtras from its
// own mixin config's plugin, is nested in the in-game mod with the metadata of Forge's jar-in-jar locator, which reads the
// files Fabricated's dependency locator hands Forge and adds the newest nested copy. Discovery reads the same metadata to
// tell pre-flight which version runs.
configurations {
    nestedMixinExtras { transitive = false }
}
dependencies {
    nestedMixinExtras "io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}"
    testmodCompileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
}
def mixinExtrasJarJar = tasks.register('mixinExtrasJarJar') {
    def version = project.mixinextras_version
    def out = layout.buildDirectory.dir('jarjar')
    inputs.property('version', version)
    outputs.dir(out)
    doLast {
        def file = out.get().file('META-INF/jarjar/metadata.json').asFile
        file.parentFile.mkdirs()
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([jars: [[
                identifier: [group: 'io.github.llamalad7', artifact: 'mixinextras-forge'],
                version: [range: "[${version},)", artifactVersion: version],
                path: "META-INF/jarjar/mixinextras-forge-${version}.jar",
                isObfuscated: false]]])) + '\n'
    }
}

// --- The language provider (docs/PORTING.md §4.1, as on the forge branch) ------------------------------------------
// Forge loads language providers into its plugin layer, which sees neither Fabricated's discovery (the service layer)
// nor the game: the provider is a jar of its own, nested in the Fabricated jar, and compiles against the two Forge
// libraries it may use, so code reaching for anything else fails to build.
def pluginLayerApis = ~/(forgespi|fmlcore)-.+\.jar/
sourceSets {
    langprovider {
        java.srcDirs = [rootProject.file('loader/forge-legacy/src/langprovider/java')]
        resources.srcDirs = [rootProject.file('loader/forge-legacy/src/langprovider/resources')]
        compileClasspath = configurations.loaderCompileClasspath.filter { it.name ==~ pluginLayerApis }
    }
}

def langProviderJar = tasks.register('langProviderJar', Jar) {
    archiveFileName = 'lang-provider.jar'
    destinationDirectory = layout.buildDirectory.dir('langprovider')
    from sourceSets.langprovider.output
    from(rootProject.file('LICENSE'))
    from(rootProject.file('NOTICE'))
    manifest.attributes(
            'FMLModType': 'LANGPROVIDER',
            'Automatic-Module-Name': 'io.github.cmdralph.fabricated.langprovider',
            // Forge reads a provider's version from its package's Implementation-Version and fails without one.
            'Implementation-Version': project.version)
}

// Which Forge libraries a source set compiles against: the loader's classpath, by jar name (what Forge's own libraries
// are named decides the language provider's classpath above).
tasks.register('forgeClasspathReport') {
    group = 'help'
    description = "Lists the jars of the loader's compile classpath"
    def classpath = configurations.loaderCompileClasspath
    doLast {
        def names = classpath.files*.name.sort()
        logger.lifecycle("Loader compile classpath (${names.size()} jars):")
        names.each { logger.lifecycle("  $it") }
        logger.lifecycle("Language provider compile classpath: ${names.findAll { it ==~ pluginLayerApis }}")
    }
}

afterEvaluate {
    tasks.named('gameModJar', Jar) {
        from(configurations.nestedMixinExtras) { into 'META-INF/jarjar' }
        from(mixinExtrasJarJar)
        from(gameModRefmap)
        manifest.attributes('MixinConfigs': gameModMixins.join(','))
    }
    // ModDevGradle moves the jar as built (Mojang's names) to build/devlibs and writes the reobfuscated one here.
    def reobfGameModJar = obfuscation.reobfuscate(tasks.named('gameModJar'), sourceSets.main) {
        archiveFileName = 'game-mod.jar'
        destinationDirectory = layout.buildDirectory.dir('gamemod-srg')
    }
    def fabricatedJar = tasks.named('fabricatedJar', Jar) {
        // Named apart from the NeoForge jar of the same Minecraft version: here, once mc/mc.gradle has registered the
        // task, as its own configuration would otherwise set the name back.
        archiveBaseName = 'fabricated-forge'
        from(langProviderJar) { into 'META-INF/fabricated' }
        // mc/mc.gradle nests the in-game mod as built: the reobfuscated copy is nested instead. An exclusion sees a file's
        // path in its source (a single file's name), not where it goes.
        exclude { FileTreeElement e -> e.name == 'game-mod.jar' && e.file.parentFile.name == 'devlibs' }
        from(reobfGameModJar) { into 'META-INF/fabricated' }
    }

    // What Forge needs of the jar's layout, checked on the built jar: the nested language provider's manifest and
    // service file, and no package in two of the three parts (each is a module in its own layer, and the game layer
    // reads them all).
    def checkJar = tasks.register('checkForgeJar') {
        group = 'verification'
        description = 'Checks the Fabricated jar against the layout Forge loads it by'
        def jarFile = fabricatedJar.flatMap { it.archiveFile }
        inputs.file(jarFile)
        doLast {
            def readZip = { InputStream input ->
                def entries = [:]
                new java.util.zip.ZipInputStream(input).withCloseable { zip ->
                    for (def e = zip.nextEntry; e != null; e = zip.nextEntry) {
                        if (!e.directory) entries[e.name] = zip.readAllBytes()
                    }
                }
                entries
            }
            def packages = { Map entries ->
                entries.keySet().findAll { it.endsWith('.class') && it.contains('/') && !it.startsWith('META-INF/') }
                        .collect { it.substring(0, it.lastIndexOf('/')).replace('/', '.') } as Set
            }
            def outer = jarFile.get().asFile.withInputStream { readZip(it) }
            def parts = [outer: outer]
            ['lang-provider.jar', 'game-mod.jar'].each { name ->
                def bytes = outer["META-INF/fabricated/$name"]
                if (bytes == null) throw new GradleException("The Fabricated jar has no META-INF/fabricated/$name")
                parts[name] = readZip(new ByteArrayInputStream(bytes))
            }

            def provider = parts['lang-provider.jar']
            def manifest = new java.util.jar.Manifest(new ByteArrayInputStream(provider['META-INF/MANIFEST.MF'] ?: new byte[0])).mainAttributes
            if (manifest.getValue('FMLModType') != 'LANGPROVIDER') throw new GradleException('lang-provider.jar is not FMLModType: LANGPROVIDER')
            if (!manifest.getValue('Implementation-Version')) throw new GradleException('lang-provider.jar has no Implementation-Version')
            // A service file's first provider, which must be a class of the same jar.
            def provided = { Map entries, String jarName, String service ->
                def file = entries["META-INF/services/$service"]
                def name = file == null ? null : new String(file, 'UTF-8').readLines()*.trim().find { it && !it.startsWith('#') }
                if (name == null || !entries.containsKey(name.replace('.', '/') + '.class')) {
                    throw new GradleException("$jarName's $service service names no class it has: $name")
                }
                name
            }
            def implementation = provided(provider, 'lang-provider.jar', 'net.minecraftforge.forgespi.language.IModLanguageProvider')
            // Forge finds the Fabricated jar in the mods folder by these (ModDirTransformerDiscoverer), and ModLauncher loads
            // the transformation service from it.
            def locators = ['net.minecraftforge.forgespi.locating.IModLocator', 'net.minecraftforge.forgespi.locating.IDependencyLocator',
                    'cpw.mods.modlauncher.api.ITransformationService']
                    .collect { provided(outer, 'The Fabricated jar', it) }

            // The in-game mod's mixins: Forge reads their configs from its manifest (a config it doesn't name never loads),
            // and Mixin their targets' SRG names from the refmap a config names. What the refmap maps, by mixin, is logged.
            def gameMod = parts['game-mod.jar']
            def gameModManifest = new java.util.jar.Manifest(new ByteArrayInputStream(gameMod['META-INF/MANIFEST.MF'] ?: new byte[0])).mainAttributes
            def mixinConfigs = (gameModManifest.getValue('MixinConfigs') ?: '').split(',')*.trim().findAll { it }
            if (!mixinConfigs) throw new GradleException('game-mod.jar names no MixinConfigs')
            def unnamed = gameMod.keySet().findAll { !it.contains('/') && it.endsWith('.mixins.json') } - mixinConfigs
            if (unnamed) throw new GradleException("game-mod.jar's MixinConfigs doesn't name ${unnamed.sort()}")
            def refmaps = [] as Set
            mixinConfigs.each { name ->
                if (gameMod[name] == null) throw new GradleException("game-mod.jar's MixinConfigs names $name, which it doesn't have")
                def config = new groovy.json.JsonSlurper().parseText(new String(gameMod[name], "UTF-8"))
                if (config.refmap && !gameMod.containsKey(config.refmap)) throw new GradleException("game-mod.jar's $name names the refmap ${config.refmap}, which it doesn't have")
                if (config.refmap) refmaps << config.refmap
                (config.mixins ?: []).each { mixinName ->
                    def classFile = "${config['package']}.${mixinName}".replace('.', '/') + '.class'
                    if (!gameMod.containsKey(classFile)) throw new GradleException("game-mod.jar's $name lists the mixin $mixinName, which it doesn't have")
                }
            }
            refmaps.each { refmap ->
                def mappings = new groovy.json.JsonSlurper().parseText(new String(gameMod[refmap], "UTF-8")).mappings ?: [:]
                logger.lifecycle("Refmap $refmap: ${mappings.collect { owner, members -> "${owner.substring(owner.lastIndexOf('/') + 1)} (${members.size()})" }.sort().join(', ')}")
            }

            def names = parts.keySet() as List
            for (int i = 0; i < names.size(); i++) {
                for (int j = i + 1; j < names.size(); j++) {
                    def shared = packages(parts[names[i]]).intersect(packages(parts[names[j]]))
                    if (shared) throw new GradleException("${names[i]} and ${names[j]} share packages: ${shared.sort()}")
                }
            }
            logger.lifecycle("Forge layout: ${names.collect { "$it (${packages(parts[it]).size()} packages)" }.join(', ')}; language provider $implementation; locators $locators; in-game mixins $mixinConfigs")
        }
    }
    tasks.named('check') { dependsOn checkJar }
}
