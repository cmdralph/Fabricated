// Forge 1.20.1's part of the build for a Minecraft version project in mc/forge-legacy (mc/mc.gradle applies this):
// ModDevGradle's legacyforge settings, the in-game mod's mods.toml, and how a source set gets the game to compile
// against.

legacyForge {
    version = project.forge_version
}

ext.gameDependencies = { SourceSet sourceSet -> legacyForge.addModdingDependenciesTo(sourceSet) }

expandProps.forge_version_range = project.forge_version_range

tasks.named('processResources', ProcessResources) {
    filesMatching('META-INF/mods.toml') { expand(expandProps) }
}

// --- The test mods: Mojang's names in their sources, Intermediary's in their jars --------------------------------------
// A Fabric mod for 1.20.1 is published in Intermediary's names, which Fabricated remaps to Forge 47's (Mojang's class names,
// SRG's member names). The test mods are compiled in Mojang's, against the game and Fabric API's remapped jars, as every
// version's are (mc/shared), and CI installs them remapped to Intermediary's as Loom remaps a mod: the classes by
// AutoRenamingTool (ModDevGradle's reobfuscation, below) with Mojang-to-Intermediary mappings, the targets of the mixins by
// the refmap Mixin's annotation processor writes from the same mappings, and the access widener by them too.
def srgUtils = configurations.detachedConfiguration(dependencies.create('net.neoforged:srgutils:1.0.10'))
def srgUtilsClass = { -> new URLClassLoader(srgUtils.files.collect { it.toURI().toURL() } as URL[]) }.memoize() >> { it.loadClass('net.neoforged.srgutils.IMappingFile') }
def mappingFile = { File file -> srgUtilsClass().load(file) }
def namedToIntermediary = layout.buildDirectory.file('intermediary/named-intermediary.tsrg')
def namedToIntermediaryMappings = tasks.register('namedToIntermediaryMappings') {
    description = "Writes the mappings from Mojang's names to Intermediary's, which the test mods' jars are remapped with"
    def intermediaryTiny = tasks.named('downloadIntermediary').map { it.outputs.files.singleFile }
    inputs.files(intermediaryTiny).withPropertyName('intermediary')
    inputs.files(project.mojangMappings).withPropertyName('mojang')
    outputs.file(namedToIntermediary)
    doLast {
        def intermediary = mappingFile(project.mojangMappings.get().asFile).chain(mappingFile(intermediaryTiny.get()))
        def out = namedToIntermediary.get().asFile
        intermediary.write(out.toPath(), srgUtilsClass().classLoader.loadClass('net.neoforged.srgutils.IMappingFile$Format').TSRG, false)
        // Intermediary names a method where it is first declared, so an override keeps its obfuscated name in the chain: it
        // takes the name of the declaration of its name and descriptor, which Mixin's annotation processor doesn't look
        // up in supertypes, and goes where that name isn't one. A member the game doesn't obfuscate keeps its name.
        def mapped = { String line -> line ==~ /.*\s(method|field|comp)_\d+/ }
        def lines = out.readLines()
        def declared = lines.findAll { it.startsWith('\t') && mapped(it) }.groupBy { it.trim().tokenize()[0..-2].join(' ') }
                .collectEntries { key, found -> [(key): found*.tokenize()*.last().unique()] }
        out.text = lines.findResults { String line ->
            def member = line.trim().tokenize()
            if (!line.startsWith('\t') || mapped(line) || member.first() == member.last()) return line
            def names = declared[member[0..-2].join(' ')]
            member.size() == 3 && names?.size() == 1 ? "\t${member[0]} ${member[1]} ${names[0]}" : null
        }.collect { it + '\n' }.join()
    }
}
// Each source set with mixins gets its refmap, and the mappings of the members its mixins shadow, which the remapping
// renames in the mixins too.
def mixinMappings = [testmod: 'fabricated-testmod.refmap.json', testmodbroken: 'fabricated-testmod-badmixin.refmap.json'].collectEntries { name, refmap ->
    def dir = layout.buildDirectory.dir("mixin/${name}")
    dependencies {
        add("${name}AnnotationProcessor", "org.spongepowered:mixin:${project.mixin_processor_version}:processor")
        add("${name}AnnotationProcessor", "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}")
    }
    tasks.named("compile${name.capitalize()}Java", JavaCompile) {
        inputs.files(namedToIntermediaryMappings).withPropertyName('namedToIntermediary')
        outputs.dir(dir).withPropertyName('mixinMappings')
        options.compilerArgumentProviders.add({
            ["-AreobfTsrgFile=${namedToIntermediary.get().asFile}", "-AoutTsrgFile=${dir.get().file('shadows.tsrg').asFile}",
             "-AoutRefMapFile=${dir.get().file(refmap).asFile}", '-AmappingTypes=tsrg', '-AdefaultObfuscationEnv=searge',
             // Accessors of vanilla fields Forge's game no longer has name them as the mod's jar does (forgetest.mixin).
             '-AMSG_ACCESSOR_TARGET_NOT_FOUND=warning']
        } as CommandLineArgumentProvider)
    }
    [(name): [refmap: refmap, file: dir.map { it.file(refmap) }, shadows: dir.map { it.file('shadows.tsrg') }]]
}
// A mixin config names its source set's refmap.
def namingRefmap = { String refmap -> { String line -> line.replaceFirst(/^(\s*)"package":/, "\$1\"refmap\": \"${refmap}\",\n\$1\"package\":") } }
// An access widener's names, in Intermediary's.
def remapAccessWidener = { File file, mappings ->
    def lines = file.readLines()
    def header = lines[0].tokenize()
    file.text = ([header[0], header[1], 'intermediary'].join(' ') + '\n' + lines.drop(1).collect { String line ->
        def t = line.tokenize()
        if (t.isEmpty() || t[0].startsWith('#')) return line
        if (t[0] == 'inject-interface') return [t[0], mappings.remapClass(t[1]), t[2]].join(' ')
        def owner = mappings.getClass(t[2])
        switch (t[1]) {
            case 'class': return [t[0], t[1], mappings.remapClass(t[2])].join(' ')
            case 'method': return [t[0], t[1], mappings.remapClass(t[2]), owner?.remapMethod(t[3], t[4]) ?: t[3], mappings.remapDescriptor(t[4])].join(' ')
            default: return [t[0], t[1], mappings.remapClass(t[2]), owner?.remapField(t[3]) ?: t[3], mappings.remapDescriptor(t[4])].join(' ')
        }
    }.collect { it + '\n' }.join())
}
// Forge 47's half of the test mod (src/testmod), beside the shared one (mc/mc.gradle): the checks of Forge's own hooks
// and of the Fabric API modules Fabricated ships here, their mixins, the Fabric mod it nests (mc.gradle's testmodnested,
// JIJ-1), and the access widener's interface injected into the server and its fields, one of which Forge's coremod reads
// through a getter and must stay private.
testmodDescriptor.testmod << [entrypoints: [main: ['io.github.cmdralph.fabricated.forgetest.ForgeTestMod'],
        client: ['io.github.cmdralph.fabricated.forgetest.ForgeTestClient']], mixins: ['fabricated-forge-testmod.mixins.json'],
        jars: [[file: 'META-INF/jars/fabricated-forge-nested.jar']],
        depends: ['fabric-biome-api-v1': '*', 'fabric-dimensions-v1': '*', 'fabric-loot-tables-v1': '*', 'fabric-particles-v1': '*']]
testmodAccessWidener << 'inject-interface net/minecraft/server/MinecraftServer io/github/cmdralph/fabricated/forgetest/ForgeTestMarker' <<
        'accessible field net/minecraft/world/item/BucketItem content Lnet/minecraft/world/level/material/Fluid;' <<
        'accessible class net/minecraft/world/item/alchemy/PotionBrewing$Mix' <<
        'accessible field net/minecraft/world/item/alchemy/PotionBrewing$Mix from Ljava/lang/Object;'
// Forge Config API Port's API, which the in-game mod provides: the test mod uses it as a Fabric mod does.
def configPortApiJar = tasks.register('configPortApiJar', Jar) {
    archiveFileName = 'forgeconfigapiport-api.jar'
    destinationDirectory = layout.buildDirectory.dir('configportapi')
    from(sourceSets.main.output) { include 'fuzs/**' }
}
dependencies {
    testmodCompileOnly files(configPortApiJar)
    // The nullness annotations of the shared sources, which the platforms of later versions have and Forge 47 doesn't.
    testmodCompileOnly 'org.jspecify:jspecify:1.0.0'
}

// --- The in-game mod in Forge 47's names -----------------------------------------------------------------------------
// Forge 1.20.1 runs the game with SRG's member names. The in-game mod compiles against Mojang's: the copy nested in the
// Fabricated jar is reobfuscated (below), and the refmap of its mixins, which Mixin's annotation processor writes, names
// their targets in SRG's. Forge reads a mod's mixin configs from its manifest. All of them share the one refmap.
def gameModMixins = [
        'fabricated-forge.mixins.json',
        // Native fabric-biome-api-v1's biome source mixins (upstream's) and the accessors its modifications use.
        'fabricated-biome.mixins.json',
        // Native fabric-loot-api-v2's and fabric-loot-tables-v1's (upstream's, in one package): the builder mixins, and
        // the loot tables' events from the loot data manager's apply.
        'fabricated-loot.mixins.json',
        // Native fabric-dimensions-v1's: upstream's teleport target hook, and its End hook on Forge's teleporter.
        'fabricated-dimension.mixins.json',
        // Native fabric-particles-v1's (client): upstream's hook that registers Fabric's particle factories once the
        // engine's own are in, the accessors its sprite provider reads, and its block dust tint event on Forge's check.
        'fabricated-particles.mixins.json',
        // Native fabric-key-binding-api-v1's (client): upstream's accessor of the categories' order and of a key binding's
        // key; its key bindings go to Forge's key mapping event (KEYMAP-3).
        'fabricated-keybinding.mixins.json',
        // The block and item colour lookups Fabric API's colour provider registry calls, on Forge's maps (upstream's read
        // vanilla's, which Forge replaced).
        'fabricated-forge-color.mixins.json',
        // Fabric API's block break events in Forge's block breaking (BREAK-1), and its sleep events in Forge's bed
        // handling (SLEEP-1): upstream's hooks look for vanilla's calls, which Forge replaced.
        'fabricated-forge-interaction.mixins.json',
        'fabricated-forge-entity.mixins.json',
        // Fabric API's item hooks where Forge's item stack asks Forge's own (its crafting remainder, attribute modifiers
        // and tool check), and Forge's equipment slot hook.
        'fabricated-forge-item.mixins.json',
        // Fabric API's fuels in vanilla's fuel table, which Forge's burn times read (FUEL-1), and its brewing recipes
        // built with Forge's constructor of a brewing mix (BREW-1).
        'fabricated-forge-content.mixins.json',
        // Fabric's renderer API in Forge's chunk section compiler and block renderers (task 4, R5), with FRAPI rule 8's
        // guard: only with Fabric API's renderer installed (its plugin).
        'fabricated-forge-frapi.mixins.json']
dependencies {
    annotationProcessor "org.spongepowered:mixin:${project.mixin_processor_version}:processor"
    // The in-game mod's own mixins use MixinExtras' injectors, which the nested mixinextras-forge (below) provides. Its
    // annotation processor has Mixin's write their targets to the refmap too: Mixin's knows only its own injectors, and
    // left a vanilla method a MixinExtras injector names (LivingEntity.travel) in Mojang's name.
    compileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
}
def gameModRefmap = mixin.add(sourceSets.main, 'fabricated-forge.refmap.json')
gameModMixins.each { mixin.config(it) }

// --- Forgified Fabric Loader's place (PROVIDER-2) -------------------------------------------------------------------
// Forgified Fabric API for 1.20.1 nests Forgified Fabric Loader through Forge's jar-in-jar, and its packages are Fabric
// Loader's, as Fabricated's own copy's are: one game can't load both. Forge's jar-in-jar adds one jar per identifier, the
// newest every range admits, so the in-game mod nests an empty library under that identifier at a version above any
// other, and the other copies are left out, as Sinytra Connector does; Forgified Fabric API's modules use Fabric
// Loader's public API only, which Fabricated's copy implements. META-INF/fabricated/loader-placeholder.json tells the
// mod locator which nested copies Forge leaves out (FabricLoaderCopies), and checkForgeJar checks the two agree.
def loaderPlaceholder = [group: 'dev.su5ed.sinytra', artifact: 'fabric-loader', version: '999.999.999']
def loaderPlaceholderJar = tasks.register('loaderPlaceholderJar', Jar) {
    archiveFileName = "fabric-loader-placeholder-${loaderPlaceholder.version}.jar"
    destinationDirectory = layout.buildDirectory.dir('loaderplaceholder')
    manifest.attributes(
            'FMLModType': 'LIBRARY',
            'Automatic-Module-Name': 'io.github.cmdralph.fabricated.loaderplaceholder',
            'Implementation-Version': loaderPlaceholder.version)
}
def loaderPlaceholderInfo = tasks.register('loaderPlaceholderInfo') {
    def out = layout.buildDirectory.dir('loaderplaceholderinfo')
    inputs.property('placeholder', loaderPlaceholder.toString())
    outputs.dir(out)
    doLast {
        def file = out.get().file('META-INF/fabricated/loader-placeholder.json').asFile
        file.parentFile.mkdirs()
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(loaderPlaceholder)) + '\n'
    }
}
ext.forgeJarJarExtras = [loaderPlaceholder + [jar: loaderPlaceholderJar]]

// --- MixinExtras for Fabric mods --------------------------------------------------------------------------------------
// Nested in the in-game mod as on Forge 61 to 66 (mc/forge-mixinextras.gradle); the test mod's @WrapMethod compiles
// against it.
apply from: rootProject.file('mc/forge-mixinextras.gradle')
dependencies {
    testmodCompileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
}

// --- The language provider (docs/PORTING.md §4.1, as on the forge branch) ------------------------------------------
// Forge loads language providers into its plugin layer, which sees neither Fabricated's discovery (the service layer)
// nor the game: the provider is a jar of its own, nested in the Fabricated jar, and compiles against the two Forge
// libraries it may use, so code reaching for anything else fails to build.
def pluginLayerApis = ~/(forgespi|fmlcore)-.+\.jar/
sourceSets {
    langprovider {
        java.srcDirs = [rootProject.file('loader/forge-shared/src/langprovider/java')]
        resources.srcDirs = [rootProject.file('loader/forge-shared/src/langprovider/resources')]
        compileClasspath = configurations.loaderCompileClasspath.filter { it.name ==~ pluginLayerApis }
    }
}

def langProviderJar = tasks.register('langProviderJar', Jar) {
    archiveFileName = 'lang-provider.jar'
    destinationDirectory = layout.buildDirectory.dir('langprovider')
    from sourceSets.langprovider.output
    from(rootProject.file('LICENSE'))
    from(rootProject.file('NOTICE'))
    manifest.attributes(
            'FMLModType': 'LANGPROVIDER',
            'Automatic-Module-Name': 'io.github.cmdralph.fabricated.langprovider',
            // Forge reads a provider's version from its package's Implementation-Version and fails without one.
            'Implementation-Version': project.version)
}

// Which Forge libraries a source set compiles against: the loader's classpath, by jar name (what Forge's own libraries
// are named decides the language provider's classpath above).
tasks.register('forgeClasspathReport') {
    group = 'help'
    description = "Lists the jars of the loader's compile classpath"
    def classpath = configurations.loaderCompileClasspath
    doLast {
        def names = classpath.files*.name.sort()
        logger.lifecycle("Loader compile classpath (${names.size()} jars):")
        names.each { logger.lifecycle("  $it") }
        logger.lifecycle("Language provider compile classpath: ${names.findAll { it ==~ pluginLayerApis }}")
    }
}

afterEvaluate {
    tasks.named('gameModJar', Jar) {
        from(gameModRefmap)
        // What upstream's wideners of the natively shipped modules open (BIOME-6), in Forge 47's names. Not in
        // src/main/resources, whose access transformer ModDevGradle applies to the game the in-game mod compiles against.
        from(file('src/fabricapi/accesstransformer.cfg')) { into 'META-INF' }
        manifest.attributes('MixinConfigs': gameModMixins.join(','))
    }
    // ModDevGradle moves the jar as built (Mojang's names) to build/devlibs and writes the reobfuscated one here.
    def reobfGameModJar = obfuscation.reobfuscate(tasks.named('gameModJar'), sourceSets.main) {
        archiveFileName = 'game-mod.jar'
        destinationDirectory = layout.buildDirectory.dir('gamemod-srg')
    }
    // The hash naming the in-game mod's copy in the cache (PERF-2) is the nested jar's: the reobfuscated one, not the jar
    // as built, which mc/mc.gradle records.
    tasks.named('fabricatedVersionProperties', WriteProperties) {
        def nestedGameMod = reobfGameModJar.flatMap { it.archiveFile }
        inputs.files(nestedGameMod)
        property 'gamemod.sha256', providers.provider {
            java.security.MessageDigest.getInstance('SHA-256').digest(nestedGameMod.get().asFile.bytes).encodeHex().toString()
        }
    }
    // The test mods' jars as CI installs them (above); the jars as built go to build/devlibs. A remapping task is registered
    // as ModDevGradle's reobfuscate() registers its own, without what that adds to the source set's published variants:
    // the test mods have none (reobfuscate() fails on a source set without them) and are never published. Its class comes
    // from the plugin's class loader, which a script applied with `apply from` can't name.
    def remapJarType = obfuscation.getClass().classLoader.loadClass('net.neoforged.moddevgradle.legacyforge.tasks.RemapJar')
    tasks.named('processTestmodResources', ProcessResources) {
        inputs.files(namedToIntermediaryMappings).withPropertyName('namedToIntermediary')
        filesMatching('*.mixins.json') { filter(namingRefmap(mixinMappings.testmod.refmap)) }
        doLast {
            def accessWidener = new File(destinationDir, 'fabricated-testmod.accesswidener')
            if (accessWidener.isFile()) remapAccessWidener(accessWidener, mappingFile(namedToIntermediary.get().asFile))
        }
    }
    tasks.named('testmodJar', Jar) { from(mixinMappings.testmod.file) }
    tasks.named('testmodBadmixinJar', Jar) {
        from(mixinMappings.testmodbroken.file)
        filesMatching('*.mixins.json') { filter(namingRefmap(mixinMappings.testmodbroken.refmap)) }
    }
    [testmodJar: 'testmod', testmodThrowsJar: 'testmodbroken', testmodBadmixinJar: 'testmodbroken', testmodFrapiJar: 'testmodfrapi'].each { jar, sourceSet ->
        def built = tasks.named(jar, Jar) { destinationDirectory = layout.buildDirectory.dir('devlibs') }
        def remapped = tasks.register("${jar}Intermediary", remapJarType) {
            group = 'verification'
            description = "Remaps ${jar}'s jar to Intermediary's names, as a Fabric mod for 1.20.1 is published"
            input.set(built.flatMap { it.archiveFile })
            archiveFileName = built.flatMap { it.archiveFileName }
            destinationDirectory = layout.buildDirectory.dir('testmods')
            // The classes the test mod's classes extend (the game's and Fabric API's), so that the methods which override
            // theirs are renamed with them.
            libraries.from(sourceSets[sourceSet].compileClasspath)
            obfuscation.configureNamedToSrgOperation(remapOperation)
            remapOperation.mappings.setFrom(namedToIntermediaryMappings, mixinMappings[sourceSet]?.shadows ?: [])
            // The task doesn't track the mappings' contents itself.
            inputs.files(remapOperation.mappings).withPropertyName('remapMappings')
        }
        tasks.named('testmods') { dependsOn remapped }
    }
    def fabricatedJar = tasks.named('fabricatedJar', Jar) {
        // Named apart from the NeoForge jar of the same Minecraft version: here, once mc/mc.gradle has registered the
        // task, as its own configuration would otherwise set the name back.
        archiveBaseName = 'fabricated-forge'
        from(langProviderJar) { into 'META-INF/fabricated' }
        // mc/mc.gradle nests the in-game mod as built: the reobfuscated copy is nested instead. An exclusion sees a file's
        // path in its source (a single file's name), not where it goes.
        exclude { FileTreeElement e -> e.name == 'game-mod.jar' && e.file.parentFile.name == 'devlibs' }
        from(reobfGameModJar) { into 'META-INF/fabricated' }
        from(loaderPlaceholderInfo)
    }

    // What Forge needs of the jar's layout, checked on the built jar: the nested language provider's manifest and
    // service file, and no package in two of the three parts (each is a module in its own layer, and the game layer
    // reads them all).
    def checkJar = tasks.register('checkForgeJar') {
        group = 'verification'
        description = 'Checks the Fabricated jar against the layout Forge loads it by'
        def jarFile = fabricatedJar.flatMap { it.archiveFile }
        inputs.file(jarFile)
        doLast {
            def readZip = { InputStream input ->
                def entries = [:]
                new java.util.zip.ZipInputStream(input).withCloseable { zip ->
                    for (def e = zip.nextEntry; e != null; e = zip.nextEntry) {
                        if (!e.directory) entries[e.name] = zip.readAllBytes()
                    }
                }
                entries
            }
            def packages = { Map entries ->
                entries.keySet().findAll { it.endsWith('.class') && it.contains('/') && !it.startsWith('META-INF/') }
                        .collect { it.substring(0, it.lastIndexOf('/')).replace('/', '.') } as Set
            }
            def outer = jarFile.get().asFile.withInputStream { readZip(it) }
            def parts = [outer: outer]
            ['lang-provider.jar', 'game-mod.jar'].each { name ->
                def bytes = outer["META-INF/fabricated/$name"]
                if (bytes == null) throw new GradleException("The Fabricated jar has no META-INF/fabricated/$name")
                parts[name] = readZip(new ByteArrayInputStream(bytes))
            }

            def provider = parts['lang-provider.jar']
            def manifest = new java.util.jar.Manifest(new ByteArrayInputStream(provider['META-INF/MANIFEST.MF'] ?: new byte[0])).mainAttributes
            if (manifest.getValue('FMLModType') != 'LANGPROVIDER') throw new GradleException('lang-provider.jar is not FMLModType: LANGPROVIDER')
            if (!manifest.getValue('Implementation-Version')) throw new GradleException('lang-provider.jar has no Implementation-Version')
            // A service file's first provider, which must be a class of the same jar.
            def provided = { Map entries, String jarName, String service ->
                def file = entries["META-INF/services/$service"]
                def name = file == null ? null : new String(file, 'UTF-8').readLines()*.trim().find { it && !it.startsWith('#') }
                if (name == null || !entries.containsKey(name.replace('.', '/') + '.class')) {
                    throw new GradleException("$jarName's $service service names no class it has: $name")
                }
                name
            }
            def implementation = provided(provider, 'lang-provider.jar', 'net.minecraftforge.forgespi.language.IModLanguageProvider')
            // Forge finds the Fabricated jar in the mods folder by these (ModDirTransformerDiscoverer), and ModLauncher loads
            // the transformation service from it.
            def locators = ['net.minecraftforge.forgespi.locating.IModLocator', 'net.minecraftforge.forgespi.locating.IDependencyLocator',
                    'cpw.mods.modlauncher.api.ITransformationService']
                    .collect { provided(outer, 'The Fabricated jar', it) }

            // The in-game mod's mixins: Forge reads their configs from its manifest (a config it doesn't name never loads),
            // and Mixin their targets' SRG names from the refmap a config names. What the refmap maps, by mixin, is logged.
            def gameMod = parts['game-mod.jar']
            def gameModManifest = new java.util.jar.Manifest(new ByteArrayInputStream(gameMod['META-INF/MANIFEST.MF'] ?: new byte[0])).mainAttributes
            def mixinConfigs = (gameModManifest.getValue('MixinConfigs') ?: '').split(',')*.trim().findAll { it }
            if (!mixinConfigs) throw new GradleException('game-mod.jar names no MixinConfigs')
            def unnamed = gameMod.keySet().findAll { !it.contains('/') && it.endsWith('.mixins.json') } - mixinConfigs
            if (unnamed) throw new GradleException("game-mod.jar's MixinConfigs doesn't name ${unnamed.sort()}")
            def refmaps = [] as Set
            mixinConfigs.each { name ->
                if (gameMod[name] == null) throw new GradleException("game-mod.jar's MixinConfigs names $name, which it doesn't have")
                def config = new groovy.json.JsonSlurper().parseText(new String(gameMod[name], "UTF-8"))
                if (config.refmap && !gameMod.containsKey(config.refmap)) throw new GradleException("game-mod.jar's $name names the refmap ${config.refmap}, which it doesn't have")
                if (config.refmap) refmaps << config.refmap
                (config.mixins ?: []).each { mixinName ->
                    def classFile = "${config['package']}.${mixinName}".replace('.', '/') + '.class'
                    if (!gameMod.containsKey(classFile)) throw new GradleException("game-mod.jar's $name lists the mixin $mixinName, which it doesn't have")
                }
            }
            refmaps.each { refmap ->
                def mappings = new groovy.json.JsonSlurper().parseText(new String(gameMod[refmap], "UTF-8")).mappings ?: [:]
                logger.lifecycle("Refmap $refmap: ${mappings.collect { owner, members -> "${owner.substring(owner.lastIndexOf('/') + 1)} (${members.size()})" }.sort().join(', ')}")
            }

            // Forgified Fabric Loader's place (above): the in-game mod nests the empty library under the identifier and
            // version the outer jar's loader-placeholder.json names, and Forge's jar-in-jar lists it.
            def placeholderInfo = outer['META-INF/fabricated/loader-placeholder.json']
            if (placeholderInfo == null) throw new GradleException('The Fabricated jar has no META-INF/fabricated/loader-placeholder.json')
            def placeholder = new groovy.json.JsonSlurper().parseText(new String(placeholderInfo, 'UTF-8'))
            def gameModJarJar = gameMod['META-INF/jarjar/metadata.json']
            if (gameModJarJar == null) throw new GradleException('game-mod.jar has no META-INF/jarjar/metadata.json')
            def nested = new groovy.json.JsonSlurper().parseText(new String(gameModJarJar, 'UTF-8')).jars.find {
                it.identifier.group == placeholder.group && it.identifier.artifact == placeholder.artifact
            }
            if (nested == null || nested.version.artifactVersion != placeholder.version || nested.version.range != "[${placeholder.version},)") {
                throw new GradleException("game-mod.jar's jar-in-jar doesn't list ${placeholder.group}:${placeholder.artifact} ${placeholder.version}: $nested")
            }
            def placeholderBytes = gameMod[nested.path]
            if (placeholderBytes == null) throw new GradleException("game-mod.jar has no ${nested.path}")
            def placeholderEntries = readZip(new ByteArrayInputStream(placeholderBytes))
            if (placeholderEntries.keySet().any { !it.startsWith('META-INF/') }) {
                throw new GradleException("${nested.path} is not empty: ${placeholderEntries.keySet().sort()}")
            }

            // The in-game mod's hash version.properties records, which names its copy in the cache (PERF-2), is the nested
            // jar's: the reobfuscated one.
            def versionBytes = outer['META-INF/fabricated/version.properties']
            if (versionBytes == null) throw new GradleException('The Fabricated jar has no META-INF/fabricated/version.properties')
            def versionInfo = new Properties()
            versionInfo.load(new ByteArrayInputStream(versionBytes))
            def gameModSha = java.security.MessageDigest.getInstance('SHA-256').digest(outer['META-INF/fabricated/game-mod.jar']).encodeHex().toString()
            if (versionInfo.getProperty('gamemod.sha256') != gameModSha) {
                throw new GradleException("version.properties records the in-game mod's hash ${versionInfo.getProperty('gamemod.sha256')}, the nested game-mod.jar's is $gameModSha")
            }

            def names = parts.keySet() as List
            for (int i = 0; i < names.size(); i++) {
                for (int j = i + 1; j < names.size(); j++) {
                    def shared = packages(parts[names[i]]).intersect(packages(parts[names[j]]))
                    if (shared) throw new GradleException("${names[i]} and ${names[j]} share packages: ${shared.sort()}")
                }
            }
            logger.lifecycle("Forge layout: ${names.collect { "$it (${packages(parts[it]).size()} packages)" }.join(', ')}; language provider $implementation; locators $locators; in-game mixins $mixinConfigs")
        }
    }
    tasks.named('check') { dependsOn checkJar }
}
