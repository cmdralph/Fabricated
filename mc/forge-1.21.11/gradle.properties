# Minecraft 1.21.11 on Minecraft Forge 61 (the forge branch; docs/PORTING.md §4 and §7). The project is named
# forge-1.21.11 next to main's NeoForge project mc/1.21.11.
minecraft_version=1.21.11
forge_version=61.2.4
java_version=21
# Forge's part of the build (mc/platform-forge.gradle) and its discovery services (loader/forge).
platform=forge
loader_dir=forge
# Source shared by the forge branch's projects (mc/forge-common); main's mc/common is NeoForge's (mc/mc.gradle).
shared_sources=forge-common
# Forge runs 1.21.11 with Mojang's names, as NeoForge does: Fabric mods are remapped from Intermediary.
namespace=INTERMEDIARY
# Placeholders until the discovery adapter (F3) settles what core assumes: Forge 61 ships upstream Mixin 0.8.7.
mixin_lowest=0.8.7
mixin_fallback=0.8.7
forge_version_range=[61,)
minecraft_version_range=[1.21.11,1.21.12)
aw_header=accessWidener v2 named
