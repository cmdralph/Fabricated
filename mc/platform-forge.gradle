// Minecraft Forge's part of the build for the versions ForgeGradle 7 builds (mc/mc.gradle applies this): Forge 61 to 66
// (mc/forge), and Forge 52 (forge-legacy's mc/forge-legacy/1.21.1, whose platform_build names this). ForgeGradle's
// settings, the in-game mod's mods.toml, and how a source set gets the game to compile against.

def forgeArtifact = "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

minecraft {
    // An obfuscated Minecraft version (Fabric mods in Intermediary's names) is named with Mojang's mappings, as Forge
    // runs it; 26.x is unobfuscated.
    if (project.namespace == 'INTERMEDIARY') mappings channel: 'official', version: project.minecraft_version
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

// The game, declared once (ForgeGradle names each Minecraft dependency it prepares, "default" unless told otherwise);
// ForgeGradle prepares it for every resolvable configuration whose hierarchy contains it.
configurations {
    forgeGame {
        canBeConsumed = false
        canBeResolved = false
    }
    implementation.extendsFrom(forgeGame)
    // The annotations the vendored Fabric API sources carry (JetBrains' and JSpecify's), declared rather than left to
    // whatever Forge's classpath brings; compile time only.
    fabricApiAnnotations {
        canBeConsumed = false
        canBeResolved = false
    }
    compileOnly.extendsFrom(fabricApiAnnotations)
}
def forgeGameDependency = minecraft.dependency(forgeArtifact)
dependencies {
    forgeGame forgeGameDependency
    fabricApiAnnotations 'org.jetbrains:annotations:24.1.0'
    fabricApiAnnotations "org.jspecify:jspecify:${jspecify_version}"
}

ext.gameDependencies = { SourceSet sourceSet ->
    configurations.named(sourceSet.compileOnlyConfigurationName) { extendsFrom(configurations.forgeGame, configurations.fabricApiAnnotations) }
}

// Mojang's mappings of an obfuscated version, which mc/mc.gradle remaps Fabric API's jars with: those ForgeGradle names the
// game with, its Mojang to obfuscated names in TSRG v2, written as the TSRG v1 core reads (the same class and member
// lines, without the header and the parameter and static lines).
if (project.namespace == 'INTERMEDIARY') {
    def tsrg = layout.buildDirectory.file('mojang/mappings.tsrg')
    def mojangTsrg = tasks.register('mojangMappingsTsrg') {
        def source = forgeGameDependency.toObfFile
        inputs.file(source).withPathSensitivity(PathSensitivity.NONE)
        outputs.file(tsrg)
        doLast {
            tsrg.get().asFile.withWriter('UTF-8') { out ->
                new java.util.zip.GZIPInputStream(source.get().newInputStream()).withReader('UTF-8') { reader ->
                    reader.eachLine { line -> if (!line.startsWith('tsrg2 ') && !line.startsWith('\t\t')) out.write(line + '\n') }
                }
            }
        }
    }
    ext.mojangMappings = mojangTsrg.map { tsrg.get() }
}

// Forge's half of the test mod (mc/forge's src/testmod), beside the shared one (mc/mc.gradle): the checks of Forge's own
// hooks, their mixins, the Fabric mod it nests (mc.gradle's testmodnested, JIJ-1), and the access widener's interface
// injected into the server and the field Forge's coremod reads through a getter, which must stay private.
testmodDescriptor.testmod << [entrypoints: [main: ['io.github.cmdralph.fabricated.forgetest.ForgeTestMod'],
        client: ['io.github.cmdralph.fabricated.forgetest.ForgeTestClient']], mixins: ['fabricated-forge-testmod.mixins.json'],
        jars: [[file: 'META-INF/jars/fabricated-forge-nested.jar']]]
// sharedSources holds GStrings, which no String equals.
def sharedSourcePaths = sharedSources*.toString()
// Forge's half of the renderer test mod, where the version has one (Forge 61 to 66, not Forge 52).
def forgeFrapiClient = 'src/testmodfrapi/java/io/github/cmdralph/fabricated/testmod/frapi/ForgeFrapiClient.java'
if (([projectDir] + sharedSourcePaths.collect { rootProject.file(it) }).any { new File(it, forgeFrapiClient).isFile() }) {
    testmodDescriptor.testmodfrapi << [entrypoints: [client: ['io.github.cmdralph.fabricated.testmod.frapi.ForgeFrapiClient']]]
}
// 26.x's half of the renderer test mod drives screen input through mixins (common26).
if ('mc/forge/common26' in sharedSourcePaths) testmodDescriptor.testmodfrapi << [mixins: ['fabricated-testmod-frapi-forge.mixins.json']]
// Fabric API's advancement module is 26.2's and later's, common26late's versions'.
if ('mc/forge/common26late' in sharedSourcePaths) testmodDescriptor.testmod << [entrypoints: [main: ['io.github.cmdralph.fabricated.forgetest.ForgeAdvancementTest']]]
testmodAccessWidener << 'inject-interface net/minecraft/server/MinecraftServer io/github/cmdralph/fabricated/forgetest/ForgeTestMarker' <<
        'accessible field net/minecraft/world/item/BucketItem content Lnet/minecraft/world/level/material/Fluid;'

expandProps.forge_version_range = project.forge_version_range

tasks.named('processResources', ProcessResources) {
    filesMatching('META-INF/mods.toml') { expand(expandProps) }
}

// --- MixinExtras for Fabric mods: nested in the in-game mod (mc/forge-mixinextras.gradle) --------------------------
apply from: rootProject.file('mc/forge-mixinextras.gradle')

// --- The language provider (docs/PORTING.md §4.1) ----------------------------------------------------------------
// Forge loads language providers into its plugin layer, which sees neither Fabricated's discovery (the service layer)
// nor the game: the provider is a jar of its own, nested in the Fabricated jar, and compiles against the two Forge
// libraries it may use, so code reaching for anything else fails to build.
def pluginLayerApis = ~/(forgespi|fmlcore)-.+\.jar/
sourceSets {
    langprovider {
        java.srcDirs = [rootProject.file('loader/forge-shared/src/langprovider/java')]
        resources.srcDirs = [rootProject.file('loader/forge-shared/src/langprovider/resources')]
        compileClasspath = configurations.loaderCompileClasspath.filter { it.name ==~ pluginLayerApis }
    }
}

def langProviderJar = tasks.register('langProviderJar', Jar) {
    archiveFileName = 'lang-provider.jar'
    destinationDirectory = layout.buildDirectory.dir('langprovider')
    from sourceSets.langprovider.output
    from(rootProject.file('LICENSE'))
    from(rootProject.file('NOTICE'))
    manifest.attributes(
            'FMLModType': 'LANGPROVIDER',
            'Automatic-Module-Name': 'io.github.cmdralph.fabricated.langprovider',
            'Implementation-Title': 'Fabricated (language provider)',
            // Forge reads a provider's version from its package's Implementation-Version and fails without one.
            'Implementation-Version': project.version)
}

// Which Forge libraries a source set compiles against: ForgeGradle's classpath for the loader, by jar name (what
// Forge's own libraries are named decides the language provider's classpath above).
tasks.register('forgeClasspathReport') {
    group = 'help'
    description = "Lists the jars of the loader's compile classpath"
    def classpath = configurations.loaderCompileClasspath
    doLast {
        def names = classpath.files*.name.sort()
        logger.lifecycle("Loader compile classpath (${names.size()} jars):")
        names.each { logger.lifecycle("  $it") }
        logger.lifecycle("Language provider compile classpath: ${names.findAll { it ==~ pluginLayerApis }}")
    }
}

// --- The in-game mod's own mixins -----------------------------------------------------------------------------------
// Forge runs the game in Mojang's names, as the in-game mod compiles, so its mixins need no refmap; Forge reads a mod's
// mixin configs from its manifest: Fabricated's own, upstream's loot mixins (fabric-loot-api-v3, native), the loot
// module's hooks into Forge's loot table loading, Fabric's interaction and block break events in Forge's interaction
// hooks and block breaking (BREAK-1), its sleep events in Forge's bed handling (SLEEP-1), its screen input events in
// Forge's screen input hooks (SCREEN-1), Forge's item and block hooks answered from Fabric's item and block APIs, those
// of them the version's sources have (Forge 61 to 66's all, from mc/forge/common; Forge 52's some), and those a version's
// project names (game_mod_mixins). checkForgeJar refuses a config of the jar that none of them names.
def gameModMixins = ['fabricated-forge.mixins.json', 'fabricated-loot.mixins.json', 'fabricated-forge-loot.mixins.json',
        'fabricated-forge-interaction.mixins.json', 'fabricated-forge-entity.mixins.json', 'fabricated-forge-screen.mixins.json',
        'fabricated-forge-item.mixins.json', 'fabricated-forge-block.mixins.json'].findAll { config ->
            sourceSets.main.resources.srcDirs.any { new File(it, config).isFile() }
        } + (project.findProperty('game_mod_mixins') ?: '').toString().split(',')*.trim().findAll { it }

afterEvaluate {
    tasks.named('gameModJar', Jar) {
        manifest.attributes('MixinConfigs': gameModMixins.join(','))
    }

    // Here, once mc/mc.gradle has registered the task, which names the jar fabricated-forge for both Forge platforms.
    def fabricatedJar = tasks.named('fabricatedJar', Jar) {
        from(langProviderJar) { into 'META-INF/fabricated' }
    }

    // What Forge needs of the jar's layout, checked on the built jar: the nested language provider's manifest and
    // service file, and no package in two of the three parts (each is a module in its own layer, and the game layer
    // reads them all).
    def checkJar = tasks.register('checkForgeJar') {
        group = 'verification'
        description = 'Checks the Fabricated jar against the layout Forge loads it by'
        def jarFile = fabricatedJar.flatMap { it.archiveFile }
        inputs.file(jarFile)
        doLast {
            def readZip = { InputStream input ->
                def entries = [:]
                new java.util.zip.ZipInputStream(input).withCloseable { zip ->
                    for (def e = zip.nextEntry; e != null; e = zip.nextEntry) {
                        if (!e.directory) entries[e.name] = zip.readAllBytes()
                    }
                }
                entries
            }
            def packages = { Map entries ->
                entries.keySet().findAll { it.endsWith('.class') && it.contains('/') && !it.startsWith('META-INF/') }
                        .collect { it.substring(0, it.lastIndexOf('/')).replace('/', '.') } as Set
            }
            def outer = jarFile.get().asFile.withInputStream { readZip(it) }
            def parts = [outer: outer]
            ['lang-provider.jar', 'game-mod.jar'].each { name ->
                def bytes = outer["META-INF/fabricated/$name"]
                if (bytes == null) throw new GradleException("The Fabricated jar has no META-INF/fabricated/$name")
                parts[name] = readZip(new ByteArrayInputStream(bytes))
            }

            def provider = parts['lang-provider.jar']
            def manifest = new java.util.jar.Manifest(new ByteArrayInputStream(provider['META-INF/MANIFEST.MF'] ?: new byte[0])).mainAttributes
            if (manifest.getValue('FMLModType') != 'LANGPROVIDER') throw new GradleException('lang-provider.jar is not FMLModType: LANGPROVIDER')
            if (!manifest.getValue('Implementation-Version')) throw new GradleException('lang-provider.jar has no Implementation-Version')
            // A service file's first provider, which must be a class of the same jar.
            def provided = { Map entries, String jarName, String service ->
                def file = entries["META-INF/services/$service"]
                def name = file == null ? null : new String(file, 'UTF-8').readLines()*.trim().find { it && !it.startsWith('#') }
                if (name == null || !entries.containsKey(name.replace('.', '/') + '.class')) {
                    throw new GradleException("$jarName's $service service names no class it has: $name")
                }
                name
            }
            def implementation = provided(provider, 'lang-provider.jar', 'net.minecraftforge.forgespi.language.IModLanguageProvider')
            // The in-game mod's mixin configs, named in its manifest, are in its jar, every config it has is named (Forge
            // applies no other), and every mixin a config lists is a class of the jar.
            def gameMod = parts['game-mod.jar']
            def configs = (new java.util.jar.Manifest(new ByteArrayInputStream(gameMod['META-INF/MANIFEST.MF'] ?: new byte[0])).mainAttributes
                    .getValue('MixinConfigs') ?: '').split(',')*.trim().findAll { it }
            if (configs as Set != gameModMixins as Set || configs.size() != gameModMixins.size()) {
                throw new GradleException("game-mod.jar's manifest names the mixin configs ${configs}, not ${gameModMixins}")
            }
            def unnamed = gameMod.keySet().findAll { !it.contains('/') && it.endsWith('.mixins.json') } - configs
            if (unnamed) throw new GradleException("game-mod.jar has mixin configs its manifest doesn't name: ${unnamed.sort()}")
            configs.each { config ->
                if (!gameMod.containsKey(config)) throw new GradleException("game-mod.jar has no mixin config ${config}")
                def json = new groovy.json.JsonSlurper().parse(gameMod[config])
                ((json.mixins ?: []) + (json.client ?: []) + (json.server ?: [])).each { name ->
                    def entry = "${json.package}.${name}".replace('.', '/') + '.class'
                    if (!gameMod.containsKey(entry)) throw new GradleException("game-mod.jar's ${config} lists the mixin ${name}, which it doesn't have")
                }
            }
            // Forge finds the Fabricated jar in the mods folder by these (ModDirTransformerDiscoverer), and ModLauncher loads
            // the transformation service from it.
            def locators = ['net.minecraftforge.forgespi.locating.IModLocator', 'net.minecraftforge.forgespi.locating.IDependencyLocator',
                    'cpw.mods.modlauncher.api.ITransformationService']
                    .collect { provided(outer, 'The Fabricated jar', it) }

            def names = parts.keySet() as List
            for (int i = 0; i < names.size(); i++) {
                for (int j = i + 1; j < names.size(); j++) {
                    def shared = packages(parts[names[i]]).intersect(packages(parts[names[j]]))
                    if (shared) throw new GradleException("${names[i]} and ${names[j]} share packages: ${shared.sort()}")
                }
            }
            logger.lifecycle("Forge layout: ${names.collect { "$it (${packages(parts[it]).size()} packages)" }.join(', ')}; language provider $implementation; locators $locators; in-game mixins $configs")
        }
    }
    tasks.named('check') { dependsOn checkJar }
}
