# Minecraft 1.20.1 on Minecraft Forge 47 (the forge-legacy branch; docs/PORTING.md §3 and §7).
minecraft_version=1.20.1
# ModDevGradle's legacyforge plugin takes the Minecraft version with the Forge build.
forge_version=1.20.1-47.4.28
java_version=17
# Forge's part of the build (mc/platform-legacyforge.gradle) and its discovery services (loader/forge).
platform=legacyforge
loader_dir=forge
# No source folder of mc/ is shared with this version yet: mc/common is NeoForge's (mc/mc.gradle).
shared_sources=
# Fabric mods for 1.20.1 are in Intermediary's names, remapped to the names Forge 1.20.1 runs with: Mojang's class names
# and SRG member names (MappingComposer.composeSrg, from the mappings Forge's installer leaves; loader/forge).
namespace=INTERMEDIARY
# Fabric Intermediary 1.20.1 (CC0), downloaded at build time from this commit and verified.
intermediary_commit=916868752f6935dda70c4490404641a701335d81
intermediary_sha256=5a808bd1ebc4a9ee7d1c5900dbd2bf391586b536c3d86fbf2f972047faa2d165
# Placeholders until the discovery adapter (L3) settles what core assumes: Forge 47 ships Mixin 0.8.5 (UNVERIFIED which
# behaviour version it accepts).
mixin_lowest=0.8.5
mixin_fallback=0.8.5
forge_version_range=[47,)
minecraft_version_range=[1.20.1,1.20.2)
aw_header=accessWidener v2 named
