# Minecraft 26.1.2 on Minecraft Forge 64 (docs/PORTING.md §4 and §7): the project :mc:forge-26.1.2.
minecraft_version=26.1.2
forge_version=64.1.5
java_version=25
# Source shared by Forge's versions in mc/forge (mc/mc.gradle): every version (common), 26.x (common26) and 26.1.2 and
# 26.2 (common26early: 26.3 changed loot tables' fields).
shared_sources=mc/forge-shared,common,common26,common26early
# The Fabric test mods' sources it shares with every platform's projects for these Minecraft versions, in
# mc/shared/<group> (mc/mc.gradle).
testmod_sources=1.21.1+,1.21.11+,26.x,26.1-26.2,26.1.2
# 26.x is unobfuscated: Fabric mods use Mojang's names, as Forge runs the game.
namespace=OFFICIAL
# The Mixin release the running Mixin is judged as (pre-flight, behaviour versions): Forge 64 ships upstream Mixin 0.8.7.
mixin_lowest=0.8.7
mixin_fallback=0.8.7
# MixinExtras (MIT) for Fabric mods, which Fabric Loader ships 0.5.x of and this Forge offers 0.5.4 of: its Forge
# build, nested in the in-game mod (mc/forge-mixinextras.gradle).
mixinextras_version=0.5.5
forge_version_range=[64,)
minecraft_version_range=[26.1,26.2)
aw_header=classTweaker v1 official
# The in-game mod's mixin configs Forge 64 alone needs (mc/platform-forge.gradle): Fabric API's after-damage event,
# whose hook reads a local Forge 64's hurtServer dropped (DAMAGE-1), 26.x's character typing events in Forge's screen
# input hook, the native key mapping module's category order, upstream's (KEYMAP-3), and FRAPI rule 8's guard on the
# renderer's entry points, with 26.1.2's breaking overlay (task 4, R5).
game_mod_mixins=fabricated-forge-damage.mixins.json,fabricated-forge-screen-chars.mixins.json,fabricated-keymapping.mixins.json,fabricated-forge-frapi.mixins.json,fabricated-forge-frapi-breaking.mixins.json
# CI only: Modrinth version ids of the Fabric builds of Sodium and Iris for the difficult mods'
# client with them, a pair that works together (CI-4)
ci_fabric_renderers=sodium@tZQ3jqnf iris@sZbVsl2Q
