# Minecraft 1.21.11 on Minecraft Forge 61 (docs/PORTING.md §4 and §7): the project :mc:forge-1.21.11.
minecraft_version=1.21.11
forge_version=61.2.4
java_version=21
# Source shared by Forge's versions in mc/forge (mc/mc.gradle): every version (common).
shared_sources=mc/forge-shared,common
# Forge runs 1.21.11 with Mojang's names, as NeoForge does: Fabric mods are remapped from Intermediary.
namespace=INTERMEDIARY
# Fabric's Intermediary for 1.21.11 (CC0), bundled as for NeoForge's mc/neoforge/1.21.11: the composer's other half,
# with the Mojang mappings Forge's installer leaves among the libraries.
intermediary_commit=916868752f6935dda70c4490404641a701335d81
intermediary_sha256=d54cd7b17e0d43634fe5657e535d40a040a3f3b0c4eae2c4c174e29f66244b3c
# Placeholders until the discovery adapter (F3) settles what core assumes: Forge 61 ships upstream Mixin 0.8.7.
mixin_lowest=0.8.7
mixin_fallback=0.8.7
forge_version_range=[61,)
minecraft_version_range=[1.21.11,1.21.12)
aw_header=accessWidener v2 named
# The in-game mod's mixin configs Forge 61 alone needs (mc/platform-forge.gradle): the block colour lookup Fabric API's
# colour provider registry calls, on Forge's map (its own reads vanilla's, which Forge replaced), and Fabric API's
# after-damage event, whose hook reads a local Forge 61's hurtServer dropped (DAMAGE-1).
game_mod_mixins=fabricated-forge-color.mixins.json,fabricated-forge-particle.mixins.json,fabricated-forge-damage.mixins.json
