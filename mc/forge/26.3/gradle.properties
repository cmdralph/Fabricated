# Minecraft 26.3 on Minecraft Forge 66 (docs/PORTING.md §4 and §7): the project :mc:forge-26.3.
minecraft_version=26.3
forge_version=66.1.0
java_version=25
# Source shared by Forge's versions in mc/forge (mc/mc.gradle): every version (common) and 26.x (common26).
shared_sources=mc/forge-shared,common,common26
# 26.x is unobfuscated: Fabric mods use Mojang's names, as Forge runs the game.
namespace=OFFICIAL
# Placeholders until the discovery adapter (F3) settles what core assumes: Forge 66 ships upstream Mixin 0.8.7.
mixin_lowest=0.8.7
mixin_fallback=0.8.7
# MixinExtras (MIT) for Fabric mods, which Fabric Loader ships 0.5.x of and this Forge offers 0.5.4 of: its Forge
# build, nested in the in-game mod (mc/forge-mixinextras.gradle).
mixinextras_version=0.5.5
forge_version_range=[66,)
minecraft_version_range=[26.3,26.4)
aw_header=classTweaker v1 official
# The in-game mod's mixin configs Forge 66 alone needs (mc/platform-forge.gradle): Fabric API's advancement events on
# Forge's conditional decoding.
game_mod_mixins=fabricated-forge-advancement.mixins.json
