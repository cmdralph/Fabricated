// Root build: conventions shared by every project.
allprojects {
    group = rootProject.group
    version = rootProject.fabricated_version
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java {
            withSourcesJar()
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.compilerArgs.addAll(['-Xlint:all,-processing,-serial,-classfile,-options', '-Werror'])
        }
        tasks.withType(AbstractArchiveTask).configureEach {
            // Deterministic archives: stable order, no timestamps.
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            testLogging {
                events 'failed', 'skipped'
                exceptionFormat 'full'
            }
        }
    }
}

// The engine's projects: built with Java 21, their main code loadable on Java 17, for the 1.20.1 branch
// (docs/PORTING.md, D2); tests may use newer APIs.
configure(subprojects.findAll { it.path in [':core', ':api', ':fabric-loader-api'] }) {
    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(21)
        tasks.withType(JavaCompile).configureEach {
            options.release = name == 'compileJava' ? 17 : 21
        }
        repositories {
            mavenCentral()
        }
        dependencies {
            testImplementation platform("org.junit:junit-bom:${junit_version}")
            testImplementation 'org.junit.jupiter:junit-jupiter'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
    }
}
